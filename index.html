                          <button
                            type="button"
                            onClick={handleSetCycleEndOnSelectedDate}
                            className="bg-rose-600 text-white px-2.5 py-1 rounded-lg text-[10px] font-bold"
                          >
                            この日を終了日にする
                          </button>
                        </div>
                        <div className="flex space-x-1.5">
                          <input
                            type="text"
                            placeholder="体調メモ（例：腹痛あり、薬服用、眠気）"
                            value={cycleNoteInput}
                            onChange={e => setCycleNoteInput(e.target.value)}
                            className="flex-1 p-2 border border-rose-200 rounded-xl bg-white text-xs"
                          />
                          <button
                            type="button"
                            onClick={handleSaveCycleNote}
                            className="bg-rose-700 text-white px-3 rounded-xl font-bold text-xs"
                          >
                            保存
                          </button>
                        </div>
                      </div>
                    ) : (
                      <div className="flex items-center justify-between">
                        <span className="text-[11px] text-rose-800">この日の記録はまだありません</span>
                        <button
                          type="button"
                          onClick={handleStartCycleOnSelectedDate}
                          className="bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-xl font-bold text-xs"
                        >
                          ＋ 生理開始日として記録
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* その日の予定・収支一覧 */}
                <div className="space-y-2.5">
                  {dayEvents.length === 0 ? (
                    <div className="text-center py-12 bg-white rounded-2xl border border-stone-200/80 text-slate-400 text-xs">
                      この日の予定や支出はありません
                    </div>
                  ) : (
                    dayEvents.map(ev => {
                      const isMultiDay = ev.endDate && ev.endDate > ev.date;
                      const isShared = ev.isSharedImport;
                      const isPayday = ev.isAutoPayday;
                      const hasReminder = ev.reminder && ev.reminder !== 'none';
                      return (
                        <div
                          key={ev.id}
                          className={`p-3.5 rounded-2xl shadow-sm transition ${ev.completed && !isPayday ? 'opacity-55' : ''}`}
                          style={
                            isPayday
                              ? {
                                  backgroundColor: darkMode ? '#064E3B' : '#ECFDF5',
                                  border: '1px solid #6EE7B7',
                                  borderLeft: `4px solid ${ev.color}`,
                                }
                              : isShared
                              ? {
                                  backgroundColor: `${ev.color}18`,
                                  border: `1px solid ${ev.color}40`,
                                  borderLeft: `4px solid ${ev.color}`,
                                }
                              : {
                                  backgroundColor: darkMode ? '#1E293B' : '#FFFFFF',
                                  border: darkMode ? '1px solid #334155' : '1px solid #E7E5E4',
                                  borderLeft: `4px solid ${ev.color}`,
                                }
                          }
                        >
                          <div className="flex items-start justify-between">
                            <div className="flex items-start space-x-3 flex-1">
                              {!isViewingShared && !isPayday && (
                                <button onClick={() => toggleComplete(ev.id)} className="text-slate-400 hover:text-slate-700 text-lg mt-0.5">
                                  {ev.completed ? '☑' : '☐'}
                                </button>
                              )}
                              <div className="flex-1">
                                <div className="flex flex-wrap items-center gap-1.5">
                                  {ev.isPinned && (
                                    <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-100 text-amber-900">
                                      📌 ピン留め
                                    </span>
                                  )}
                                  {ev.seriesId && (
                                    <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">
                                      🔁 繰り返し
                                    </span>
                                  )}
                                  {isPayday && (
                                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-700 text-white tracking-wide">
                                      自動給料日
                                    </span>
                                  )}
                                  {isShared && (
                                    <span
                                      className="text-[10px] font-bold px-2 py-0.5 rounded-md text-white tracking-wide"
                                      style={{ backgroundColor: ev.color }}
                                    >
                                      {ev.sharedBadge || '共有'}
                                    </span>
                                  )}
                                  <span className={`font-bold text-sm ${ev.completed && !isPayday ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                                    {ev.title}
                                  </span>
                                  {hasReminder && (
                                    <span className="text-[10px] bg-amber-100 text-amber-900 px-1.5 py-0.5 rounded font-bold">
                                      🔔 {REMINDER_OPTIONS.find(r => r.value === ev.reminder)?.label}
                                    </span>
                                  )}
                                </div>
                                <div className="flex flex-wrap items-center gap-1.5 text-xs text-slate-500 mt-1">
                                  {isMultiDay && (
                                    <span className="bg-stone-100 text-slate-700 px-1.5 py-0.5 rounded text-[10px] font-bold">
                                      {ev.date.slice(5)} 〜 {ev.endDate.slice(5)}
                                    </span>
                                  )}
                                  {ev.isAllDay ? (
                                    <span className="bg-stone-100 text-slate-600 px-1.5 py-0.5 rounded text-[10px] font-bold">終日</span>
                                  ) : (
                                    ev.startTime && <span>{ev.startTime} - {ev.endTime}</span>
                                  )}
                                  {ev.shiftMeta && (
                                    <span className="bg-emerald-50 text-emerald-800 border border-emerald-200/70 px-1.5 py-0.5 rounded text-[10px]">
                                      実働{ev.shiftMeta.workHours}h
                                      {ev.shiftMeta.nightHours > 0 ? ` / 深夜${ev.shiftMeta.nightHours}h` : ''}
                                      {ev.shiftMeta.breakMins > 0 ? ` / 休憩${ev.shiftMeta.breakMins}分` : ''}
                                      {ev.shiftMeta.transport > 0 ? ` +交通費${ev.shiftMeta.transport}円` : ''}
                                    </span>
                                  )}
                                </div>
                                {ev.memo && (
                                  <div className="text-xs text-slate-600 bg-white/80 p-2.5 rounded-lg mt-2 border border-stone-200/70 leading-relaxed">
                                    {ev.memo}
                                  </div>
                                )}
                                {ev.subItems && ev.subItems.length > 0 && (
                                  <div className="mt-2 border-t border-stone-100 pt-1.5 space-y-1">
                                    <div className="text-[10px] font-bold text-slate-400">内訳:</div>
                                    {ev.subItems.map(sub => (
                                      <div key={sub.id} className="flex justify-between text-xs text-slate-600">
                                        <span>・{sub.name}</span>
                                        <span>{sub.price.toLocaleString()}円</span>
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </div>
                            </div>
                            <div className="flex flex-col items-end space-y-2 ml-2">
                              {ev.amount > 0 && (
                                <span className={`text-sm font-bold ${ev.isExpense ? 'text-rose-600' : 'text-emerald-700'}`}>
                                  {ev.isExpense ? '-' : '+'}{ev.amount.toLocaleString()}円
                                </span>
                              )}
                              <div className="flex space-x-2 text-[11px]">
                                {!isViewingShared && !isPayday && (
                                  <button
                                    onClick={() => togglePinEvent(ev.id)}
                                    className={`${ev.isPinned ? 'text-amber-600 font-bold' : 'text-slate-400 hover:text-amber-600'}`}
                                  >
                                    {ev.isPinned ? '📌解除' : '📌固定'}
                                  </button>
                                )}
                                <button onClick={() => downloadICS(ev)} className="text-slate-400 hover:text-slate-700">通知</button>
                                {!isViewingShared && !isPayday && (
                                  <>
                                    <button onClick={() => openEditModal(ev)} className="text-slate-700 hover:underline font-bold">編集</button>
                                    <button onClick={() => requestDeleteEvent(ev)} className="text-slate-400 hover:text-rose-600">削除</button>
                                  </>
                                )}
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* 3. 収支タブ */}
            {viewMode === 'finance' && (
              <div className="space-y-3.5">
                {!isViewingShared && (
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-stone-200/80 space-y-3">
                    <div className="flex justify-between items-center">
                      <h2 className="text-sm font-bold text-slate-800">{month}月のマネー状況（3指標）</h2>
                      <button
                        onClick={() => { setStatementRawText(''); setParsedStatements([]); setIsStatementModalOpen(true); }}
                        className="text-[11px] bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200/80 px-2.5 py-1 rounded-lg font-bold transition"
                      >
                        ＋ 明細貼付
                      </button>
                    </div>

                    <div className="space-y-2.5 text-xs">
                      <div className="bg-slate-800 text-white p-3.5 rounded-xl flex justify-between items-center">
                        <div>
                          <div className="text-slate-300 text-[11px] font-bold">① 口座内金額（現在の実残高）</div>
                          <div className="text-[10px] text-slate-400 mt-0.5">
                            今後の給料・予定反映後見込: {accountStats.projectedAccountBalance.toLocaleString()}円
                          </div>
                        </div>
                        <div className={`text-xl font-bold ${accountStats.currentAccountBalance >= 0 ? 'text-white' : 'text-rose-300'}`}>
                          {accountStats.currentAccountBalance.toLocaleString()}円
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-2.5">
                        <div
                          onClick={jumpToBudgetSettings}
                          className={`p-3 rounded-xl border cursor-pointer transition ${
                            isOverBudget ? 'bg-rose-50 border-rose-200' : isNearBudget ? 'bg-amber-50 border-amber-200' : 'bg-stone-50 border-stone-200/80 hover:border-slate-400'
                          }`}
                        >
                          <div className="text-slate-500 text-[11px] font-bold">② 今月使える金額 ⚙</div>
                          <div className={`text-lg font-bold mt-1 ${usableRemainingThisMonth >= 0 ? 'text-slate-800' : 'text-rose-600'}`}>
                            {usableRemainingThisMonth >= 0 ? `${usableRemainingThisMonth.toLocaleString()}円` : `-${Math.abs(usableRemainingThisMonth).toLocaleString()}円`}
                          </div>
                          <div className="text-[10px] text-slate-400 mt-0.5">
                            予算 {monthlyBudget.toLocaleString()}円 − 支出 {monthlyStats.expense.toLocaleString()}円
                          </div>
                        </div>

                        <div className="bg-emerald-50/70 p-3 rounded-xl border border-emerald-200/80">
                          <div className="text-emerald-900 text-[11px] font-bold">③ 今月稼いだ金額</div>
                          <div className="text-lg font-bold text-emerald-700 mt-1">
                            +{monthlyStats.earnedThisMonth.toLocaleString()}円
                          </div>
                          <div className="text-[10px] text-emerald-800/80 mt-0.5">
                            {month === 12 ? 1 : month + 1}月の給料日に口座へ振込
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 1. 年収の壁メーター（103万・130万・カスタム目標） */}
                {!isViewingShared && (
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-stone-200/80 space-y-3 text-xs">
                    <div className="flex justify-between items-center">
                      <h2 className="text-sm font-bold text-slate-800">🎓 {year}年 扶養・年収の壁メーター</h2>
                      <span className="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200">
                        累計 +{annualIncomeStats.totalYearIncome.toLocaleString()}円
                      </span>
                    </div>

                    {/* 103万円の壁 */}
                    <div className="space-y-1">
                      <div className="flex justify-between text-[11px]">
                        <span className="font-bold text-slate-700">103万円の壁（所得税・扶養基準）</span>
                        <span className={`font-bold ${annualIncomeStats.rem103 < 0 ? 'text-rose-600' : 'text-slate-700'}`}>
                          {annualIncomeStats.rem103 >= 0
                            ? `あと ${annualIncomeStats.rem103.toLocaleString()}円 (${annualIncomeStats.pct103}%)`
                            : `${Math.abs(annualIncomeStats.rem103).toLocaleString()}円 超過`}
                        </span>
                      </div>
                      <div className="w-full h-2.5 bg-stone-200/80 rounded-full overflow-hidden">
                        <div
                          className={`h-full rounded-full transition-all duration-300 ${
                            annualIncomeStats.pct103 >= 100 ? 'bg-rose-600' : annualIncomeStats.pct103 >= 85 ? 'bg-amber-500' : 'bg-emerald-600'
                          }`}
                          style={{ width: `${annualIncomeStats.pct103}%` }}
                        />
                      </div>
                    </div>

                    {/* 130万円の壁 */}
                    <div className="space-y-1">
                      <div className="flex justify-between text-[11px]">
                        <span className="font-bold text-slate-700">130万円の壁（社会保険扶養基準）</span>
                        <span className={`font-bold ${annualIncomeStats.rem130 < 0 ? 'text-rose-600' : 'text-slate-600'}`}>
                          {annualIncomeStats.rem130 >= 0
                            ? `あと ${annualIncomeStats.rem130.toLocaleString()}円 (${annualIncomeStats.pct130}%)`
                            : `${Math.abs(annualIncomeStats.rem130).toLocaleString()}円 超過`}
                        </span>
                      </div>
                      <div className="w-full h-2 bg-stone-200/80 rounded-full overflow-hidden">
                        <div
                          className={`h-full rounded-full transition-all duration-300 ${
                            annualIncomeStats.pct130 >= 100 ? 'bg-rose-600' : 'bg-sky-600'
                          }`}
                          style={{ width: `${annualIncomeStats.pct130}%` }}
                        />
                      </div>
                    </div>

                    <div className="text-[10px] text-slate-400 flex justify-between pt-0.5">
                      <span>バイト稼働集計: {annualIncomeStats.shiftEarnedYear.toLocaleString()}円</span>
                      <span>その他収入: {annualIncomeStats.otherIncomeYear.toLocaleString()}円</span>
                    </div>
                  </div>
                )}

                {/* 2. バイト給与・実際の振込額との照合 */}
                {!isViewingShared && (jobEarnedBreakdown.length > 0 || incomingPaydaysThisMonth.length > 0) && (
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-stone-200/80 space-y-3 text-xs">
                    <h2 className="text-sm font-bold text-slate-800">💼 バイト給与＆実際の振込額照合</h2>

                    {/* 今月振り込まれる給料の照合 */}
                    {incomingPaydaysThisMonth.length > 0 && (
                      <div className="space-y-2">
                        <div className="text-[11px] font-bold text-emerald-900">{month}月振込予定の給料（実際の入金額を入力して照合）</div>
                        {incomingPaydaysThisMonth.map(p => {
                          const diff = p.actualAmount !== null ? p.actualAmount - p.calculatedAmount : null;
                          return (
                            <div key={p.id} className="bg-emerald-50/80 border border-emerald-200 p-3 rounded-xl space-y-2">
                              <div className="flex justify-between items-center">
                                <div>
                                  <div className="font-bold text-emerald-950">{p.title}（{p.date.slice(5)}）</div>
                                  <div className="text-[10px] text-emerald-800">計算上の給与見込: <b>{p.calculatedAmount.toLocaleString()}円</b></div>
                                </div>
                                {diff !== null && (
                                  <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${
                                    diff === 0
                                      ? 'bg-emerald-700 text-white'
                                      : diff > 0
                                      ? 'bg-sky-100 text-sky-800'
                                      : 'bg-rose-100 text-rose-800'
                                  }`}>
                                    {diff === 0 ? '一致 ±0円' : `差額 ${diff > 0 ? '+' : ''}${diff.toLocaleString()}円`}
                                  </span>
                                )}
                              </div>
                              <div className="flex items-center space-x-2">
                                <span className="text-[10px] font-bold text-slate-600 shrink-0">実際の振込額:</span>
                                <input
                                  type="number"
                                  placeholder={String(p.calculatedAmount)}
                                  value={p.actualAmount !== null ? p.actualAmount : ''}
                                  onChange={e => {
                                    const val = e.target.value;
                                    setPaydayActuals(prev => {
                                      const next = { ...prev };
                                      if (val === '') delete next[p.paydayKey];
                                      else next[p.paydayKey] = Number(val);
                                      return next;
                                    });
                                  }}
                                  className="flex-1 p-1.5 border border-emerald-300 rounded-lg bg-white font-bold text-right text-slate-800"
                                />
                                <span className="text-[11px] font-bold">円</span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {/* 今月稼働分の勤務先別内訳 */}
                    {jobEarnedBreakdown.length > 0 && (
                      <div className="space-y-1.5">
                        <div className="text-[11px] font-bold text-slate-500">{month}月稼働分の勤務先別内訳（翌月振込）</div>
                        {jobEarnedBreakdown.map(jb => (
                          <div key={jb.id} className="flex justify-between items-center text-xs bg-stone-50 p-2.5 rounded-xl border border-stone-200/60">
                            <div>
                              <div className="flex items-center space-x-2">
                                <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: jb.color }} />
                                <span className="font-bold text-slate-700">{jb.name}</span>
                                <span className="text-slate-400 text-[10px]">({jb.count}回 / {jb.totalHours}h)</span>
                              </div>
                              <div className="text-[10px] text-slate-500 ml-4 mt-0.5">
                                振込予定日: <b>{jb.paydayStr}</b>（翌月{jb.payDay === 31 ? '末日' : `${jb.payDay}日`}）
                              </div>
                            </div>
                            <span className="font-bold text-emerald-700">+{jb.totalPay.toLocaleString()}円</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* 支出予算バー ＆ 6. カテゴリごとの予算進捗 */}
                {!isViewingShared && (
                  <div className={`p-4 rounded-2xl shadow-sm border space-y-3 transition ${
                    isOverBudget
                      ? 'bg-rose-50/70 border-rose-300'
                      : isNearBudget
                      ? 'bg-amber-50/70 border-amber-300'
                      : 'bg-white border-stone-200/80'
                  }`}>
                    <div className="flex justify-between items-center">
                      <div className="flex items-center space-x-1.5">
                        <h2 className="text-sm font-bold text-slate-800">{month}月の支出予算バー</h2>
                        {isOverBudget && (
                          <span className="bg-rose-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                            予算オーバー
                          </span>
                        )}
                      </div>
                      <button
                        onClick={jumpToBudgetSettings}
                        className="text-[11px] text-slate-600 hover:text-slate-900 bg-stone-100 px-2.5 py-1 rounded-lg font-bold"
                      >
                        予算上限を設定
                      </button>
                    </div>

                    {monthlyBudget > 0 && (
                      <div className="space-y-1">
                        <div className="flex justify-between items-baseline text-xs">
                          <span className="font-bold text-slate-800">
                            全体: {monthlyStats.expense.toLocaleString()} / {monthlyBudget.toLocaleString()}円 ({budgetPercent}%)
                          </span>
                          <span className="text-[10px] text-slate-500">確定: {monthlyStats.confirmedExpense.toLocaleString()}円</span>
                        </div>
                        <div className="w-full h-2.5 bg-stone-200/80 rounded-full overflow-hidden">
                          <div
                            className={`h-full rounded-full transition-all duration-300 ${
                              isOverBudget ? 'bg-rose-600' : isNearBudget ? 'bg-amber-500' : 'bg-emerald-700'
                            }`}
                            style={{ width: `${budgetPercent}%` }}
                          />
                        </div>
                      </div>
                    )}

                    {/* 6. カテゴリ別予算上限プログレス */}
                    {categoryExpenseBreakdown.some(c => c.budget > 0) && (
                      <div className="pt-2 border-t border-stone-200/70 space-y-2">
                        <div className="text-[11px] font-bold text-slate-600">カテゴリ別 予算消化状況</div>
                        {categoryExpenseBreakdown.filter(c => c.budget > 0).map(cat => {
                          const pct = Math.min(100, Math.round((cat.amount / cat.budget) * 100));
                          const over = cat.amount > cat.budget;
                          return (
                            <div key={cat.name} className="space-y-0.5 text-[11px]">
                              <div className="flex justify-between">
                                <span className="font-bold text-slate-700">{cat.name}</span>
                                <span className={over ? 'text-rose-600 font-bold' : 'text-slate-600'}>
                                  {cat.amount.toLocaleString()} / {cat.budget.toLocaleString()}円 ({pct}%)
                                </span>
                              </div>
                              <div className="w-full h-1.5 bg-stone-200/80 rounded-full overflow-hidden">
                                <div
                                  className="h-full rounded-full"
                                  style={{
                                    width: `${pct}%`,
                                    backgroundColor: over ? '#E11D48' : cat.color,
                                  }}
                                />
                              </div>
                            </div>
                          );
                        })}
                      </div>
