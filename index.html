<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>予定＆家計簿</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>
  <style>
    body { user-select: none; -webkit-user-select: none; }
    input, textarea, select { user-select: auto; -webkit-user-select: auto; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex justify-center">
  <div id="root" class="w-full max-w-md bg-gray-50 min-h-screen flex flex-col shadow-xl"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const Lucide = window.lucideReact || {};
    const { 
      Calendar: CalendarIcon, Plus, ChevronLeft, ChevronRight, Briefcase, 
      DollarSign, Clock, Tag, FileText, CheckCircle2, Circle, Smartphone 
    } = Lucide;

    function App() {
      const [currentDate, setCurrentDate] = useState(new Date());
      const [viewMode, setViewMode] = useState('month');
      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      
      const [jobs, setJobs] = useState(() => {
        const saved = localStorage.getItem('app_jobs');
        return saved ? JSON.parse(saved) : [
          { id: '1', name: 'メインバイト', hourlyWage: 1100, color: '#3B82F6' },
          { id: '2', name: 'サブバイト', hourlyWage: 1200, color: '#10B981' }
        ];
      });

      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('app_events');
        return saved ? JSON.parse(saved) : [];
      });

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [newEvent, setNewEvent] = useState({
        title: '', date: new Date().toISOString().split('T')[0],
        startTime: '09:00', endTime: '17:00', color: '#3B82F6',
        amount: 0, isExpense: true, isShift: false, jobId: '', memo: '', completed: false
      });

      const [newJob, setNewJob] = useState({ name: '', hourlyWage: 1000, color: '#EC4899' });

      useEffect(() => { localStorage.setItem('app_jobs', JSON.stringify(jobs)); }, [jobs]);
      useEffect(() => { localStorage.setItem('app_events', JSON.stringify(events)); }, [events]);

      const getDaysInMonth = (date) => {
        const year = date.getFullYear();
        const month = date.getMonth();
        const days = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();
        return { days, firstDay };
      };

      const calculateShiftPay = (startTime, endTime, hourlyWage) => {
        if (!startTime || !endTime || !hourlyWage) return 0;
        const [startH, startM] = startTime.split(':').map(Number);
        const [endH, endM] = endTime.split(':').map(Number);
        let hours = (endH + endM / 60) - (startH + startM / 60);
        if (hours < 0) hours += 24;
        return Math.round(hours * hourlyWage);
      };

      const handleAddEvent = (e) => {
        e.preventDefault();
        let calculatedAmount = Number(newEvent.amount);
        let title = newEvent.title;
        let isExpense = newEvent.isExpense;

        if (newEvent.isShift && newEvent.jobId) {
          const selectedJob = jobs.find(j => j.id === newEvent.jobId);
          if (selectedJob) {
            calculatedAmount = calculateShiftPay(newEvent.startTime, newEvent.endTime, selectedJob.hourlyWage);
            if (!title) title = `${selectedJob.name} Shift`;
            isExpense = false;
          }
        }

        const item = {
          ...newEvent,
          id: Date.now().toString(),
          title: title || '無題の予定',
          amount: calculatedAmount,
          isExpense
        };

        setEvents([...events, item]);
        setIsModalOpen(false);
        setNewEvent({
          title: '', date: selectedDate, startTime: '09:00', endTime: '17:00',
          color: '#3B82F6', amount: 0, isExpense: true, isShift: false, jobId: '', memo: '', completed: false
        });
      };

      const toggleComplete = (id) => {
        setEvents(events.map(ev => ev.id === id ? { ...ev, completed: !ev.completed } : ev));
      };

      const deleteEvent = (id) => {
        setEvents(events.filter(ev => ev.id !== id));
      };

      const addJob = () => {
        if (!newJob.name) return;
        setJobs([...jobs, { ...newJob, id: Date.now().toString() }]);
        setNewJob({ name: '', hourlyWage: 1000, color: '#EC4899' });
      };

      const deleteJob = (id) => {
        setJobs(jobs.filter(j => j.id !== id));
      };

      const monthData = getDaysInMonth(currentDate);
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;

      const monthlyStats = events.reduce((acc, ev) => {
        const evDate = new Date(ev.date);
        if (evDate.getFullYear() === year && evDate.getMonth() + 1 === month) {
          if (ev.isExpense) acc.expense += ev.amount;
          else acc.income += ev.amount;
        }
        return acc;
      }, { income: 0, expense: 0 });

      const dayEvents = events.filter(e => e.date === selectedDate);
      const dayStats = dayEvents.reduce((acc, ev) => {
        if (ev.isExpense) acc.expense += ev.amount;
        else acc.income += ev.amount;
        return acc;
      }, { income: 0, expense: 0 });

      return (
        <div className="flex-1 flex flex-col pb-20 relative">
          <header className="bg-indigo-600 text-white p-4 sticky top-0 z-10 shadow-md">
            <div className="flex justify-between items-center mb-2">
              <div className="flex items-center space-x-2">
                <CalendarIcon className="w-6 h-6" />
                <h1 className="text-xl font-bold">{year}年 {month}月</h1>
              </div>
              <div className="flex space-x-1">
                <button onClick={() => setCurrentDate(new Date(year, month - 2, 1))} className="p-1.5 hover:bg-indigo-700 rounded-full">
                  <ChevronLeft className="w-5 h-5" />
                </button>
                <button onClick={() => setCurrentDate(new Date())} className="px-2 py-1 text-xs bg-indigo-700 rounded font-medium">今月</button>
                <button onClick={() => setCurrentDate(new Date(year, month, 1))} className="p-1.5 hover:bg-indigo-700 rounded-full">
                  <ChevronRight className="w-5 h-5" />
                </button>
              </div>
            </div>

            <div className="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-indigo-500/50 text-center text-xs">
              <div className="bg-indigo-700/50 p-2 rounded">
                <div className="text-indigo-200">予想収入</div>
                <div className="text-sm font-bold text-green-300">+{monthlyStats.income.toLocaleString()}円</div>
              </div>
              <div className="bg-indigo-700/50 p-2 rounded">
                <div className="text-indigo-200">予定支出</div>
                <div className="text-sm font-bold text-red-300">-{monthlyStats.expense.toLocaleString()}円</div>
              </div>
              <div className="bg-indigo-700/50 p-2 rounded">
                <div className="text-indigo-200">収支差引</div>
                <div className={`text-sm font-bold ${monthlyStats.income - monthlyStats.expense >= 0 ? 'text-white' : 'text-red-300'}`}>
                  {(monthlyStats.income - monthlyStats.expense).toLocaleString()}円
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 p-3">
            {viewMode === 'month' && (
              <div className="bg-white rounded-xl shadow p-3">
                <div className="grid grid-cols-7 gap-1 mb-2 text-center text-xs font-bold text-gray-500">
                  <span className="text-red-500">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span className="text-blue-500">土</span>
                </div>
                <div className="grid grid-cols-7 gap-1">
                  {Array.from({ length: monthData.firstDay }).map((_, i) => (
                    <div key={`empty-${i}`} className="h-14 bg-gray-50/50 rounded" />
                  ))}
                  {Array.from({ length: monthData.days }).map((_, i) => {
                    const dayNum = i + 1;
                    const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                    const isSelected = dateStr === selectedDate;
                    const isToday = dateStr === new Date().toISOString().split('T')[0];
                    const currentDayEvents = events.filter(e => e.date === dateStr);

                    return (
                      <div
                        key={dayNum}
                        onClick={() => { setSelectedDate(dateStr); setViewMode('day'); }}
                        className={`h-14 p-1 border rounded-lg flex flex-col justify-between cursor-pointer transition ${
                          isSelected ? 'border-indigo-600 bg-indigo-50/50 ring-2 ring-indigo-500/20' : 'border-gray-100 hover:bg-gray-50'
                        } ${isToday ? 'bg-indigo-50/30 font-bold' : ''}`}
                      >
                        <div className="flex justify-between items-center">
                          <span className={`text-xs ${isToday ? 'bg-indigo-600 text-white rounded-full w-5 h-5 flex items-center justify-center' : ''}`}>
                            {dayNum}
                          </span>
                          {currentDayEvents.length > 0 && (
                            <span className="w-1.5 h-1.5 rounded-full bg-indigo-500" />
                          )}
                        </div>
                        <div className="space-y-0.5 overflow-hidden">
                          {currentDayEvents.slice(0, 2).map((ev) => (
                            <div key={ev.id} className="text-[9px] truncate px-1 rounded text-white font-medium" style={{ backgroundColor: ev.color || '#3B82F6' }}>
                              {ev.title}
                            </div>
                          ))}
                          {currentDayEvents.length > 2 && (
                            <div className="text-[8px] text-gray-400 text-right font-medium">+ {currentDayEvents.length - 2}件</div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {viewMode === 'day' && (
              <div className="space-y-3">
                <div className="bg-white p-4 rounded-xl shadow flex justify-between items-center">
                  <div>
                    <h2 className="text-lg font-bold text-gray-800">{selectedDate} の予定・収支</h2>
                    <div className="text-xs text-gray-500 mt-0.5">
                      収入: <span className="text-green-600 font-bold">+{dayStats.income.toLocaleString()}円</span> / 
                      支出: <span className="text-red-600 font-bold">-{dayStats.expense.toLocaleString()}円</span>
                    </div>
                  </div>
                  <button onClick={() => setViewMode('month')} className="text-xs bg-gray-100 px-3 py-1.5 rounded-lg text-gray-600 hover:bg-gray-200">
                    月一覧に戻る
                  </button>
                </div>

                <div className="space-y-2">
                  {dayEvents.length === 0 ? (
                    <div className="text-center py-12 bg-white rounded-xl shadow-sm text-gray-400 text-sm">
                      予定や支出は登録されていません
                    </div>
                  ) : (
                    dayEvents.map(ev => (
                      <div key={ev.id} className={`bg-white p-3.5 rounded-xl shadow-sm border-l-4 flex items-center justify-between ${ev.completed ? 'opacity-60' : ''}`} style={{ borderLeftColor: ev.color }}>
                        <div className="flex items-center space-x-3 flex-1">
                          <button onClick={() => toggleComplete(ev.id)} className="text-gray-400 hover:text-indigo-600">
                            {ev.completed ? <CheckCircle2 className="w-5 h-5 text-indigo-600" /> : <Circle className="w-5 h-5" />}
                          </button>
                          <div>
                            <div className={`font-bold text-sm ${ev.completed ? 'line-through text-gray-400' : 'text-gray-800'}`}>
                              {ev.title}
                            </div>
                            <div className="flex items-center space-x-2 text-xs text-gray-500 mt-1">
                              {ev.startTime && <span className="flex items-center"><Clock className="w-3 h-3 mr-1"/>{ev.startTime} - {ev.endTime}</span>}
                              {ev.memo && <span className="text-gray-400 truncate max-w-[120px]">{ev.memo}</span>}
                            </div>
                          </div>
                        </div>
                        <div className="flex items-center space-x-3">
                          {ev.amount > 0 && (
                            <span className={`text-sm font-bold ${ev.isExpense ? 'text-red-500' : 'text-green-600'}`}>
                              {ev.isExpense ? '-' : '+'}{ev.amount.toLocaleString()}円
                            </span>
                          )}
                          <button onClick={() => deleteEvent(ev.id)} className="text-gray-300 hover:text-red-500 text-xs">削除</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {viewMode === 'settings' && (
              <div className="space-y-4">
                <div className="bg-white p-4 rounded-xl shadow">
                  <h2 className="text-md font-bold mb-3 flex items-center"><Briefcase className="w-4 h-4 mr-2 text-indigo-600"/>バイト先・勤務先設定</h2>
                  <div className="space-y-3 mb-4">
                    {jobs.map(j => (
                      <div key={j.id} className="flex justify-between items-center p-2.5 bg-gray-50 rounded-lg">
                        <div className="flex items-center space-x-2">
                          <span className="w-3 h-3 rounded-full" style={{ backgroundColor: j.color }} />
                          <span className="font-bold text-sm">{j.name}</span>
                          <span className="text-xs text-gray-500">（時給: {j.hourlyWage}円）</span>
                        </div>
                        <button onClick={() => deleteJob(j.id)} className="text-xs text-red-500">削除</button>
                      </div>
                    ))}
                  </div>

                  <div className="border-t pt-3 space-y-2">
                    <div className="text-xs font-bold text-gray-600">新しい勤務先を追加</div>
                    <input type="text" placeholder="勤務先名" value={newJob.name} onChange={e => setNewJob({ ...newJob, name: e.target.value })} className="w-full text-xs p-2 border rounded" />
                    <div className="flex space-x-2">
                      <input type="number" placeholder="時給" value={newJob.hourlyWage} onChange={e => setNewJob({ ...newJob, hourlyWage: Number(e.target.value) })} className="flex-1 text-xs p-2 border rounded" />
                      <input type="color" value={newJob.color} onChange={e => setNewJob({ ...newJob, color: e.target.value })} className="w-10 h-8 p-0 border rounded" />
                    </div>
                    <button onClick={addJob} className="w-full bg-indigo-600 text-white text-xs py-2 rounded-lg font-bold">追加</button>
                  </div>
                </div>
              </div>
            )}
          </main>

          <button
            onClick={() => setIsModalOpen(true)}
            className="fixed bottom-20 right-5 w-14 h-14 bg-indigo-600 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-indigo-700 z-20"
          >
            <Plus className="w-8 h-8" />
          </button>

          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 grid grid-cols-3 z-10">
            <button onClick={() => setViewMode('month')} className={`py-3 flex flex-col items-center text-xs ${viewMode === 'month' ? 'text-indigo-600 font-bold' : 'text-gray-400'}`}>
              <CalendarIcon className="w-5 h-5 mb-0.5" />月表示
            </button>
            <button onClick={() => setViewMode('day')} className={`py-3 flex flex-col items-center text-xs ${viewMode === 'day' ? 'text-indigo-600 font-bold' : 'text-gray-400'}`}>
              <Clock className="w-5 h-5 mb-0.5" />日詳細
            </button>
            <button onClick={() => setViewMode('settings')} className={`py-3 flex flex-col items-center text-xs ${viewMode === 'settings' ? 'text-indigo-600 font-bold' : 'text-gray-400'}`}>
              <Briefcase className="w-5 h-5 mb-0.5" />設定
            </button>
          </nav>

          {isModalOpen && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center">
              <div className="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-gray-800">予定・収支の追加</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400">✕</button>
                </div>

                <form onSubmit={handleAddEvent} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-gray-500 mb-1">日付</label>
                    <input type="date" value={newEvent.date} onChange={e => setNewEvent({ ...newEvent, date: e.target.value })} className="w-full p-2 border rounded" required />
                  </div>

                  <div className="flex items-center space-x-2 bg-indigo-50 p-2 rounded">
                    <input type="checkbox" id="isShift" checked={newEvent.isShift} onChange={e => setNewEvent({ ...newEvent, isShift: e.target.checked })} />
                    <label htmlFor="isShift" className="font-bold text-indigo-900 cursor-pointer">アルバイトのシフトを追加する</label>
                  </div>

                  {newEvent.isShift ? (
                    <div>
                      <label className="block text-gray-500 mb-1">勤務先を選択</label>
                      <select value={newEvent.jobId} onChange={e => setNewEvent({ ...newEvent, jobId: e.target.value })} className="w-full p-2 border rounded" required>
                        <option value="">選択してください</option>
                        {jobs.map(j => <option key={j.id} value={j.id}>{j.name} （時給:{j.hourlyWage}円）</option>)}
                      </select>
                    </div>
                  ) : (
                    <div>
                      <label className="block text-gray-500 mb-1">タイトル</label>
                      <input type="text" placeholder="例：飲み会、買い物" value={newEvent.title} onChange={e => setNewEvent({ ...newEvent, title: e.target.value })} className="w-full p-2 border rounded" required />
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-gray-500 mb-1">開始時間</label>
                      <input type="time" value={newEvent.startTime} onChange={e => setNewEvent({ ...newEvent, startTime: e.target.value })} className="w-full p-2 border rounded" />
                    </div>
                    <div>
                      <label className="block text-gray-500 mb-1">終了時間</label>
                      <input type="time" value={newEvent.endTime} onChange={e => setNewEvent({ ...newEvent, endTime: e.target.value })} className="w-full p-2 border rounded" />
                    </div>
                  </div>

                  {!newEvent.isShift && (
                    <div className="space-y-2 border-t pt-2">
                      <div className="flex items-center justify-between">
                        <label className="text-gray-500">金額設定</label>
                        <div className="flex space-x-2">
                          <label className="flex items-center space-x-1 cursor-pointer">
                            <input type="radio" name="exp" checked={newEvent.isExpense} onChange={() => setNewEvent({ ...newEvent, isExpense: true })} />
                            <span>支出</span>
                          </label>
                          <label className="flex items-center space-x-1 cursor-pointer">
                            <input type="radio" name="exp" checked={!newEvent.isExpense} onChange={() => setNewEvent({ ...newEvent, isExpense: false })} />
                            <span>収入</span>
                          </label>
                        </div>
                      </div>
                      <input type="number" placeholder="金額（0で金額なし）" value={newEvent.amount || ''} onChange={e => setNewEvent({ ...newEvent, amount: Number(e.target.value) })} className="w-full p-2 border rounded" />
                    </div>
                  )}

                  <div>
                    <label className="block text-gray-500 mb-1">メモ・買い物リスト</label>
                    <textarea placeholder="メモを残せます" value={newEvent.memo} onChange={e => setNewEvent({ ...newEvent, memo: e.target.value })} className="w-full p-2 border rounded h-16" />
                  </div>

                  <button type="submit" className="w-full bg-indigo-600 text-white p-3 rounded-xl font-bold hover:bg-indigo-700 text-sm">
                    登録する
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
