    const WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

    function getLocalDateStr(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function parseDateLocal(dateStr) {
      if (!dateStr || typeof dateStr !== 'string') return new Date();
      const parts = dateStr.split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return new Date();
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function formatPaydayDate(workYear, workMonth, payDay) {
      const nextYear = workMonth === 12 ? workYear + 1 : workYear;
      const nextMonth = workMonth === 12 ? 1 : workMonth + 1;
      const maxDay = new Date(nextYear, nextMonth, 0).getDate();
      const clampedDay = Math.min(Number(payDay) || 25, maxDay);
      return `${nextYear}-${String(nextMonth).padStart(2, '0')}-${String(clampedDay).padStart(2, '0')}`;
    }

    function calcShiftDetails(startTime, endTime, job) {
      if (!job || !startTime || !endTime) {
        return { workHours: 0, nightHours: 0, breakMins: 0, transport: 0, pay: 0 };
      }
      const [sh, sm] = startTime.split(':').map(Number);
      const [eh, em] = endTime.split(':').map(Number);
      if ([sh, sm, eh, em].some(isNaN)) {
        return { workHours: 0, nightHours: 0, breakMins: 0, transport: 0, pay: 0 };
      }
      const startMins = sh * 60 + sm;
      let endMins = eh * 60 + em;
      if (endMins <= startMins) endMins += 1440;
      const totalMins = endMins - startMins;
      if (totalMins <= 0) {
        return { workHours: 0, nightHours: 0, breakMins: 0, transport: 0, pay: 0 };
      }

      const breakMins = job.autoBreak ? (totalMins > 480 ? 60 : totalMins > 360 ? 45 : 0) : 0;
      const netMins = Math.max(0, totalMins - breakMins);

      let rawNightMins = 0;
      for (let m = startMins; m < endMins; m++) {
        const mod = m % 1440;
        if (mod >= 1320 || mod < 300) rawNightMins++;
      }
      const nightMins = totalMins > 0 ? Math.round(rawNightMins * (netMins / totalMins)) : 0;

      const hourly = Number(job.hourlyWage) || 0;
      const transport = Number(job.transportFee) || 0;
      const basePay = (netMins / 60) * hourly;
      const nightExtra = job.nightBonus !== false ? (nightMins / 60) * hourly * 0.25 : 0;
      const pay = Math.round(basePay + nightExtra + transport);

      return {
        workHours: Math.round((netMins / 60) * 100) / 100,
        nightHours: Math.round((nightMins / 60) * 100) / 100,
        breakMins,
        transport,
        pay,
      };
    }

    function sanitizeEvent(ev, idx = 0) {
      if (!ev || typeof ev !== 'object') return null;
      const safeDate = typeof ev.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(ev.date)
        ? ev.date
        : getLocalDateStr();
      const safeEnd = typeof ev.endDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(ev.endDate)
        ? ev.endDate
        : safeDate;
      return {
        id: ev.id || `ev_san_${Date.now()}_${idx}`,
        title: String(ev.title || '無題の予定'),
        date: safeDate,
        endDate: safeEnd < safeDate ? safeDate : safeEnd,
        isAllDay: Boolean(ev.isAllDay),
        startTime: ev.startTime || '',
        endTime: ev.endTime || '',
        color: ev.color || '#3E7B67',
        amount: Number(ev.amount) || 0,
        isExpense: ev.isExpense !== false,
        isShift: Boolean(ev.isShift),
        jobId: ev.jobId || '',
        shiftMeta: ev.shiftMeta || null,
        completed: Boolean(ev.completed),
        memo: ev.memo || '',
        subItems: Array.isArray(ev.subItems) ? ev.subItems : [],
        reminder: ev.reminder || 'none',
        isPinned: Boolean(ev.isPinned),
        groupId: ev.groupId || null,
        isSharedImport: Boolean(ev.isSharedImport),
        sharedBadge: ev.sharedBadge || '',
      };
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMessage: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMessage: error?.message || String(error) };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="max-w-md mx-auto min-h-screen bg-white p-6 flex flex-col justify-center space-y-4 text-xs">
              <div className="text-base font-bold text-rose-600">画面表示エラーが発生しました</div>
              <div className="bg-rose-50 border border-rose-200 p-3 rounded-xl font-mono text-rose-900 break-all">
                {this.state.errorMessage}
              </div>
              <button
                onClick={() => window.location.reload()}
                className="w-full bg-slate-800 text-white py-3 rounded-xl font-bold"
              >
                再読み込みする
              </button>
              <button
                onClick={() => {
                  if (confirm('保存データを初期化して復旧しますか？')) {
                    localStorage.removeItem(STORAGE_KEY);
                    window.location.reload();
                  }
                }}
                className="w-full bg-stone-100 text-slate-700 py-2.5 rounded-xl font-bold"
              >
                保存データを初期化して復旧
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function CategoryDonutChart({ breakdown, totalExpense, darkMode }) {
      if (!breakdown || breakdown.length === 0 || totalExpense <= 0) {
        return (
          <div className="text-center py-6 text-xs text-slate-400">
            今月の支出データはまだありません
          </div>
        );
      }

      const size = 140;
      const stroke = 22;
      const radius = (size - stroke) / 2;
      const circumference = 2 * Math.PI * radius;
      let cumulativePct = 0;

      return (
        <div className="flex items-center justify-between gap-4 pt-1">
          <div className="relative shrink-0" style={{ width: size, height: size }}>
            <svg width={size} height={size} className="-rotate-90">
              {breakdown.map((item) => {
                const dash = (item.pct / 100) * circumference;
                const offset = -((cumulativePct / 100) * circumference);
                cumulativePct += item.pct;
                return (
                  <circle
                    key={item.name}
                    cx={size / 2}
                    cy={size / 2}
                    r={radius}
                    fill="transparent"
                    stroke={item.color}
                    strokeWidth={stroke}
                    strokeDasharray={`${dash} ${circumference}`}
                    strokeDashoffset={offset}
                  />
                );
              })}
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
              <span className="text-[9px] text-slate-400 font-bold">支出合計</span>
              <span className={`text-xs font-bold ${darkMode ? 'text-slate-100' : 'text-slate-800'}`}>
                {totalExpense.toLocaleString()}円
              </span>
            </div>
          </div>

          <div className="flex-1 space-y-1.5 text-xs">
            {breakdown.map((item) => (
              <div key={item.name} className="flex items-center justify-between">
                <div className="flex items-center space-x-1.5 truncate">
                  <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: item.color }} />
                  <span className="font-bold text-slate-700 truncate">{item.name}</span>
                </div>
                <div className="text-right shrink-0 ml-2">
                  <span className="font-bold text-slate-800">{item.amount.toLocaleString()}円</span>
                  <span className="text-[10px] text-slate-400 ml-1">({item.pct}%)</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const todayStr = useMemo(() => getLocalDateStr(new Date()), []);

      const initialData = useMemo(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch {
          return {};
        }
      }, []);

      const [currentDate, setCurrentDate] = useState(() => new Date());
      const [selectedDate, setSelectedDate] = useState(() => todayStr);
      const [viewMode, setViewMode] = useState('month');
      const [slideKey, setSlideKey] = useState(0);
      const [slideAnimClass, setSlideAnimClass] = useState('');
      const touchStartXRef = useRef(null);

      const [events, setEvents] = useState(() =>
        Array.isArray(initialData.events)
          ? initialData.events.map((e, i) => sanitizeEvent(e, i)).filter(Boolean)
          : []
      );
      const [jobs, setJobs] = useState(() => (Array.isArray(initialData.jobs) ? initialData.jobs : []));
      const [monthlyBudget, setMonthlyBudget] = useState(() =>
        typeof initialData.monthlyBudget === 'number' ? initialData.monthlyBudget : 50000
      );
      const [categoryBudgets, setCategoryBudgets] = useState(() =>
        initialData.categoryBudgets && typeof initialData.categoryBudgets === 'object'
          ? initialData.categoryBudgets
          : {}
      );
      const [baseBalance, setBaseBalance] = useState(() =>
        typeof initialData.baseBalance === 'number' ? initialData.baseBalance : 0
      );
      const [templates, setTemplates] = useState(() =>
        Array.isArray(initialData.templates)
          ? initialData.templates
          : [
              { id: 'tpl_def_1', title: 'ランチ・学食', amount: 650, color: '#C28540', isExpense: true },

      const [newSub, setNewSub] = useState({ name: '', amount: 0, dayOfMonth: 1, color: '#5B6270' });
      const [newJob, setNewJob] = useState({
        name: '',

        transportFee: 0,

      const isStandalone = useMemo(() => {
        if (typeof window === 'undefined') return false;
        return (
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone === true
        );
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              events,
              jobs,
              monthlyBudget,
              categoryBudgets,
              baseBalance,
              templates,
              subscriptions,
              paydayActuals,
              cycleConfig,
              cycleLogs,
              hiddenShiftKeys,
              pinnedShiftKeys,
              darkMode,
            })
          );
        } catch (err) {
          console.error('Storage save failed:', err);
        }
      }, [
        events,
        jobs,
        monthlyBudget,
        categoryBudgets,
        baseBalance,
        templates,
        subscriptions,
        paydayActuals,
        cycleConfig,
        cycleLogs,
        hiddenShiftKeys,
        pinnedShiftKeys,
        darkMode,
      ]);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const shareParam = params.get('share');
        if (shareParam) {
          try {
            const decoded = JSON.parse(decodeURIComponent(escape(atob(shareParam))));
            if (Array.isArray(decoded)) {
              const cleaned = decoded.map((e, i) => sanitizeEvent(e, i)).filter(Boolean);
              setSharedEvents(cleaned);
              setSelectedImportIds(cleaned.map((e) => e.id));
              setIsViewingShared(true);
            }
          } catch (err) {
            console.error('Share link parse failed:', err);
          }
        }

        const addExp = Number(params.get('add_expense'));
        if (addExp > 0) {
          const rawTitle = params.get('title') || 'クイック支出';
          const method = params.get('method');
          const finalTitle = method ? `[${method}] ${rawTitle}` : rawTitle;
          const ev = sanitizeEvent({
            id: `url_exp_${Date.now()}`,
            title: finalTitle,
            date: todayStr,
            endDate: todayStr,
            isAllDay: true,
            color: '#C28540',
            amount: addExp,
            isExpense: true,
            completed: true,
            memo: 'URLショートカット自動登録',
          });
          if (ev) {
            setEvents((prev) => [ev, ...prev]);
            setToastMsg(`「${finalTitle}」(${addExp.toLocaleString()}円)を自動登録しました`);
          }
          window.history.replaceState({}, '', window.location.pathname);
        }

        const handleBeforeInstall = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstall);
        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
      }, [todayStr]);

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      const monthPrefix = `${year}-${String(month).padStart(2, '0')}`;

      const prevMonthDate = new Date(year, month - 2, 1);
      const prevYear = prevMonthDate.getFullYear();
      const prevMonth = prevMonthDate.getMonth() + 1;
      const prevMonthPrefix = `${prevYear}-${String(prevMonth).padStart(2, '0')}`;

      const autoPaydayEvents = useMemo(() => {
        const grouped = {};
        events.forEach((ev) => {
          if (!ev || !ev.isShift || !ev.jobId || typeof ev.date !== 'string') return;
          const [wy, wm] = ev.date.split('-').map(Number);
          if (!wy || !wm) return;
          const key = `${ev.jobId}_${wy}_${wm}`;
          if (!grouped[key]) {
            grouped[key] = { jobId: ev.jobId, workYear: wy, workMonth: wm, total: 0 };
          }
          grouped[key].total += Number(ev.amount) || 0;
        });

        return Object.entries(grouped).map(([key, item]) => {
          const job = jobs.find((j) => j.id === item.jobId);
          const jobName = job ? job.name : 'バイト';
          const payDay = job ? job.payDay || 25 : 25;
          const paydayDateStr = formatPaydayDate(item.workYear, item.workMonth, payDay);
          const hasActual = Object.prototype.hasOwnProperty.call(paydayActuals, key);
          const actualAmount = hasActual ? Number(paydayActuals[key]) : null;
          const finalAmount = actualAmount !== null ? actualAmount : item.total;

          return {
            id: `auto_payday_${key}`,
            paydayKey: key,
            title: `${jobName} 給料日（${item.workMonth}月分）`,
            date: paydayDateStr,
            endDate: paydayDateStr,
            isAllDay: true,
            startTime: '',
            endTime: '',
            color: job?.color || '#2E7D5B',
            amount: finalAmount,
            calculatedAmount: item.total,
            actualAmount,
            isExpense: false,
            isShift: false,
            isAutoPayday: true,
            completed: paydayDateStr <= todayStr,
            memo: '',
            subItems: [],
            reminder: 'none',
            isPinned: false,
            groupId: null,
          };
        });
      }, [events, jobs, paydayActuals, todayStr]);

      const activeEvents = useMemo(() => {
        if (isViewingShared && Array.isArray(sharedEvents)) return sharedEvents;
        return [...events, ...autoPaydayEvents];
      }, [isViewingShared, sharedEvents, events, autoPaydayEvents]);

      const calendarDays = useMemo(() => {
        const firstDayOfWeek = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const cells = [];
        for (let i = 0; i < firstDayOfWeek; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          cells.push(`${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
        }
        while (cells.length % 7 !== 0) cells.push(null);
        return cells;
      }, [year, month]);

      const weekDaysList = useMemo(() => {
        const base = parseDateLocal(selectedDate);
        const dow = base.getDay();
        const sunday = new Date(base.getFullYear(), base.getMonth(), base.getDate() - dow);
        return Array.from({ length: 7 }, (_, i) => {
          const d = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate() + i);

            const d1 = parseDateLocal(sorted[i - 1].startDate);

            const diffDays = Math.round((d2 - d1) / 86400000);

          if (diffs.length > 0) {

        if (cycleConfig.enabled && sorted.length > 0) {
          const lastStart = parseDateLocal(sorted[sorted.length - 1].startDate);

              lastStart.getDate() + effectiveCycleDays * k

            const predEnd = new Date(
              predStart.getFullYear(),
              predStart.getMonth(),
              predStart.getDate() + periodLen - 1
            );
            predictedRanges.push({
              start: getLocalDateStr(predStart),
              end: getLocalDateStr(predEnd),
            });
          }

        return { effectiveCycleDays, predictedRanges };

          events.forEach((ev) => {

            if (ev.date !== nowStr) return;

        const dStart = (ev.date || todayStr).replace(/-/g, '');
        const dEndBase = parseDateLocal(ev.endDate || ev.date || todayStr);
        const dEndNext = new Date(dEndBase.getFullYear(), dEndBase.getMonth(), dEndBase.getDate() + 1);
        const dEnd = getLocalDateStr(dEndNext).replace(/-/g, '');

        let dtStartLine = `DTSTART;VALUE=DATE:${dStart}`;
        let dtEndLine = `DTEND;VALUE=DATE:${dEnd}`;
        if (!ev.isAllDay && ev.startTime) {
          const st = ev.startTime.replace(':', '') + '00';
          const et = (ev.endTime || ev.startTime).replace(':', '') + '00';
          dtStartLine = `DTSTART:${dStart}T${st}`;

        const icsContent = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//CalBudgetApp//JP',
          'BEGIN:VEVENT',
          `UID:${ev.id}@calbudget.local`,

          `SUMMARY:${(ev.title || '').replace(/\n/g, ' ')}`,

        lines.forEach((line, idx) => {
          const dateMatch = line.match(/(20\d{2})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/) || line.match(/(\d{1,2})[\/\-月](\d{1,2})日?/);
          const amountMatch = line.match(/([0-9,]{2,})\s*円/) || line.match(/,\s*([0-9]{2,})\s*$/) || line.match(/￥\s*([0-9,]+)/);

          if (amountMatch) {
            let parsedDate = todayStr;
            if (dateMatch) {
              if (dateMatch.length === 4) {
                parsedDate = `${dateMatch[1]}-${String(dateMatch[2]).padStart(2, '0')}-${String(dateMatch[3]).padStart(2, '0')}`;
              } else if (dateMatch.length === 3) {
                parsedDate = `${currentYear}-${String(dateMatch[1]).padStart(2, '0')}-${String(dateMatch[2]).padStart(2, '0')}`;
              }
            }
            const amount = Number(amountMatch[1].replace(/,/g, ''));
            let cleanedTitle = line
              .replace(/(20\d{2})[\/\-年](\d{1,2})[\/\-月](\d{1,2})日?/g, '')
              .replace(/(\d{1,2})[\/\-月](\d{1,2})日?/g, '')
              .replace(/([0-9,]{2,})\s*円/g, '')
              .replace(/￥\s*([0-9,]+)/g, '')
              .replace(/,/g, ' ')
              .trim();

            results.push({
              id: `stmt_${Date.now()}_${idx}`,
              date: parsedDate,
              amount,
              title: finalTitle,
              selected: !dup,
              isDuplicate: Boolean(dup),
              duplicateReason: dup ? `同日・同額「${dup.title}」が登録済` : '',

                            <select value={repeatOption} onChange={e => setRepeatOption(e.target.value)} className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50">
                              <option value="none">今回のみ</option>
                              <option value="weekly_4">毎週（4週間グループ）</option>
                              <option value="monthly_3">毎月（3ヶ月グループ）</option>
                            </select>
                          </div>
                        )}
                      </div>

                      <div>
                        <label className="block text-slate-500 mb-1">カラーラベル</label>
                        <div className="flex space-x-1.5 overflow-x-auto no-scrollbar py-0.5">
                          {COLOR_PALETTE.map(c => (
                            <button
                              type="button"
                              key={c.color}
                              onClick={() => setNewEvent({ ...newEvent, color: c.color })}
                              className={`px-2.5 py-1 rounded-lg text-[10px] font-bold text-white whitespace-nowrap transition ${newEvent.color === c.color ? 'ring-2 ring-offset-1 ring-slate-700' : 'opacity-65 hover:opacity-100'}`}
                              style={{ backgroundColor: c.color }}
                            >
                              {c.name}
                            </button>
                          ))}
                        </div>
                      </div>

                      {!showScheduleAmount ? (
                        <button
                          type="button"
                          onClick={() => setShowScheduleAmount(true)}
                          className="text-[11px] text-slate-500 hover:text-slate-800 font-bold underline"
                        >
                          ＋ この予定に費用・金額も紐づける
                        </button>
                      ) : (
                        <div className="bg-stone-50 p-2.5 rounded-xl border border-stone-200/80 space-y-2">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-slate-600">紐づけ金額</span>
                            <div className="flex space-x-3">
                              <label className="flex items-center space-x-1">
                                <input type="radio" name="sched_exp" checked={newEvent.isExpense} onChange={() => setNewEvent({ ...newEvent, isExpense: true })} />
                                <span className="text-rose-600 font-bold">支出</span>
                              </label>
                              <label className="flex items-center space-x-1">
                                <input type="radio" name="sched_exp" checked={!newEvent.isExpense} onChange={() => setNewEvent({ ...newEvent, isExpense: false })} />
                                <span className="text-emerald-700 font-bold">収入</span>
                              </label>
                            </div>
                          </div>
                          <input
                            type="number"
                            placeholder="金額（円）"
                            value={newEvent.amount || ''}
                            onChange={e => setNewEvent({ ...newEvent, amount: Number(e.target.value) })}
                            className="w-full p-2 border border-stone-200 rounded-lg bg-white font-bold"
                          />
                        </div>
                      )}

                      <div>
                        <label className="block text-slate-500 mb-1">メモ</label>
                        <textarea placeholder="持ち物や場所のメモ" value={newEvent.memo} onChange={e => setNewEvent({ ...newEvent, memo: e.target.value })} className="w-full p-2 border border-stone-200 rounded-xl h-14 bg-stone-50" />
                      </div>
                    </>
                  )}

                  {modalTab === 'finance' && (
                    <>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          type="button"
                          onClick={() => setNewEvent({ ...newEvent, isExpense: true })}
                          className={`py-2.5 rounded-xl font-bold border transition ${
                            newEvent.isExpense ? 'bg-rose-600 border-rose-600 text-white' : 'bg-stone-50 border-stone-200 text-slate-600'
                          }`}
                        >
                          支出（使ったお金）
                        </button>
                        <button
                          type="button"
                          onClick={() => setNewEvent({ ...newEvent, isExpense: false })}
                          className={`py-2.5 rounded-xl font-bold border transition ${
                            !newEvent.isExpense ? 'bg-emerald-700 border-emerald-700 text-white' : 'bg-stone-50 border-stone-200 text-slate-600'
                          }`}
                        >
                          収入（入ったお金）
                        </button>
                      </div>

                      <div>
                        <label className="block text-slate-500 font-bold mb-1">金額 (円)</label>
                        <input
                          type="number"
                          placeholder="0"
                          value={newEvent.amount || ''}
                          onChange={e => setNewEvent({ ...newEvent, amount: Number(e.target.value) })}
                          className="w-full p-3 border border-stone-200 rounded-xl font-bold text-lg bg-stone-50 text-right"
                          required
                        />
                      </div>

                      <div className="grid grid-cols-3 gap-2">
                        <div className="col-span-2">
                          <label className="block text-slate-500 mb-1">項目・店名</label>
                          <input
                            type="text"
                            placeholder="例：スーパー、電車代、お小遣い"
                            value={newEvent.title}
                            onChange={e => setNewEvent({ ...newEvent, title: e.target.value })}
                            className="w-full p-2.5 border border-stone-200 rounded-xl bg-stone-50 font-bold"
                          />
                        </div>
                        <div>
                          <label className="block text-slate-500 mb-1">日付</label>
                          <input
                            type="date"
                            value={newEvent.date}
                            onChange={e => setNewEvent({ ...newEvent, date: e.target.value, endDate: e.target.value })}
                            className="w-full p-2.5 border border-stone-200 rounded-xl bg-stone-50"
                            required
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-slate-500 mb-1">カテゴリ（円グラフ・カテゴリ予算に自動反映）</label>
                        <div className="flex space-x-1.5 overflow-x-auto no-scrollbar py-0.5">
                          {COLOR_PALETTE.map(c => (
                            <button
                              type="button"
                              key={c.color}
                              onClick={() => setNewEvent({ ...newEvent, color: c.color })}
                              className={`px-2.5 py-1 rounded-lg text-[10px] font-bold text-white whitespace-nowrap transition ${newEvent.color === c.color ? 'ring-2 ring-offset-1 ring-slate-700' : 'opacity-65 hover:opacity-100'}`}
                              style={{ backgroundColor: c.color }}
                            >
                              {c.name}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div>
                        <button
                          type="button"
                          onClick={() => setShowSubItemsPanel(!showSubItemsPanel)}
                          className="text-[11px] text-slate-500 hover:text-slate-800 font-bold"
                        >
                          {showSubItemsPanel ? '▼ 内訳入力を閉じる' : '▶ レシート内訳を追加して自動合計する'}
                        </button>
                        {showSubItemsPanel && (
                          <div className="mt-1.5 bg-stone-50 p-2.5 rounded-xl border border-stone-200/70 space-y-2">
                            <div className="flex space-x-1.5">
                              <input type="text" placeholder="品目" value={subItemInput.name} onChange={e => setSubItemInput({ ...subItemInput, name: e.target.value })} className="flex-1 p-1.5 border border-stone-200 rounded-lg bg-white" />
                              <input type="number" placeholder="金額" value={subItemInput.price} onChange={e => setSubItemInput({ ...subItemInput, price: e.target.value })} className="w-20 p-1.5 border border-stone-200 rounded-lg bg-white" />
                              <button type="button" onClick={handleAddSubItem} className="bg-slate-700 text-white px-3 rounded-lg font-bold">追加</button>
                            </div>
                            {newEvent.subItems.length > 0 && (
                              <div className="space-y-1 pt-1">
                                {newEvent.subItems.map(sub => (
                                  <div key={sub.id} className="flex justify-between items-center text-[11px] bg-white px-2.5 py-1 rounded-lg border border-stone-200/70">
                                    <span>{sub.name}</span>
                                    <div className="flex items-center space-x-2">
                                      <span className="font-bold">{Number(sub.price).toLocaleString()}円</span>
                                      <button type="button" onClick={() => handleRemoveSubItem(sub.id)} className="text-rose-500">✕</button>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        )}
                      </div>

                      {!editingId && (
                        <div>
                          <label className="block text-slate-500 mb-1">固定費の繰り返し登録</label>
                          <select value={repeatOption} onChange={e => setRepeatOption(e.target.value)} className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50">
                            <option value="none">今回のみ（1回）</option>
                            <option value="monthly_3">毎月同じ日に登録（3ヶ月グループ）</option>
                          </select>
                        </div>
                      )}
                    </>
                  )}

                  {modalTab === 'shift' && (
                    jobs.length === 0 ? (
                      <div className="bg-amber-50/80 border border-amber-200 p-4 rounded-xl text-amber-900 space-y-2.5 text-center">
                        <div className="font-bold">勤務先がまだ登録されていません</div>
                        <div className="text-[11px]">設定タブから時給・交通費・翌月振込日を登録するとシフト計算が使えます。</div>
                        <button
                          type="button"
                          onClick={() => { setIsModalOpen(false); setViewMode('settings'); }}
                          className="bg-amber-700 text-white px-4 py-2 rounded-xl font-bold"
                        >
                          設定画面へ移動する
                        </button>
                      </div>
                    ) : (
                      <>
                        {shiftHistoryPatterns.length > 0 && (
                          <div className="bg-emerald-50/70 border border-emerald-200/80 p-2.5 rounded-xl space-y-1.5">
                            <div className="flex justify-between items-center">
                              <span className="text-[10px] font-bold text-emerald-900">⚡ 過去のシフト履歴から時間を自動セット</span>
                              <span className="text-[9px] text-emerald-700">✕で履歴削除</span>
                            </div>
                            <div className="flex space-x-1.5 overflow-x-auto no-scrollbar pb-0.5">
                              {shiftHistoryPatterns.map(pat => (
                                <div
                                  key={pat.key}
                                  onClick={() => applyShiftHistoryToForm(pat)}
                                  className={`px-2.5 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap flex items-center space-x-1.5 border cursor-pointer transition ${
                                    newEvent.jobId === pat.jobId && newEvent.startTime === pat.startTime && newEvent.endTime === pat.endTime
                                      ? 'bg-emerald-700 text-white border-emerald-700'
                                      : 'bg-white hover:bg-emerald-100/70 text-slate-700 border-emerald-200'
                                  }`}
                                >
                                  <span>{pat.jobName}</span>
                                  <span>{pat.startTime}-{pat.endTime}</span>
                                  <button
                                    type="button"
                                    onClick={(e) => removeShiftHistoryPattern(e, pat.key)}
                                    className="opacity-65 hover:opacity-100 pl-0.5"
                                  >
                                    ✕
                                  </button>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}

                        <div>
                          <label className="block text-slate-500 font-bold mb-1">勤務先を選択</label>
                          <select
                            value={newEvent.jobId}
                            onChange={e => setNewEvent({ ...newEvent, jobId: e.target.value })}
                            className="w-full p-2.5 border border-stone-200 rounded-xl bg-stone-50 font-bold"
                            required
                          >
                            <option value="">選択してください</option>
                            {jobs.map(j => (
                              <option key={j.id} value={j.id}>
                                {j.name} （時給:{j.hourlyWage}円 / 翌月{j.payDay === 31 ? '末日' : `${j.payDay || 25}日`}払）
                              </option>
                            ))}
                          </select>
                        </div>

                        <div className="grid grid-cols-3 gap-2">
                          <div>
                            <label className="block text-slate-500 mb-1">勤務日</label>
                            <input
                              type="date"
                              value={newEvent.date}
                              onChange={e => setNewEvent({ ...newEvent, date: e.target.value, endDate: e.target.value })}
                              disabled={!editingId && repeatOption === 'weekday_month'}
                              className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50 disabled:opacity-40"
                              required
                            />
                          </div>
                          <div>
                            <label className="block text-slate-500 mb-1">出勤</label>
                            <input type="time" value={newEvent.startTime} onChange={e => setNewEvent({ ...newEvent, startTime: e.target.value })} className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50" />
                          </div>
                          <div>
                            <label className="block text-slate-500 mb-1">退勤</label>
                            <input type="time" value={newEvent.endTime} onChange={e => setNewEvent({ ...newEvent, endTime: e.target.value })} className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50" />
                          </div>
                        </div>

                        {shiftPreviewDetails && (
                          <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl flex justify-between items-center">
                            <div>
                              <div className="text-[10px] font-bold text-emerald-900">1回あたりの自動計算給与</div>
                              <div className="text-[10px] text-emerald-700 mt-0.5">
                                実働 {shiftPreviewDetails.workHours}h
                                {shiftPreviewDetails.breakMins > 0 ? `（休憩${shiftPreviewDetails.breakMins}分控除）` : ''}
                                {shiftPreviewDetails.transport > 0 ? ` +交通費${shiftPreviewDetails.transport}円` : ''}
                              </div>
                            </div>
                            <div className="text-base font-bold text-emerald-800">
                              +{Number(shiftPreviewDetails.pay).toLocaleString()}円
                            </div>
                          </div>
                        )}

                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="block text-slate-500 mb-1">🔔 出勤リマインド</label>
                            <select
                              value={newEvent.reminder || 'none'}
                              onChange={e => setNewEvent({ ...newEvent, reminder: e.target.value })}
                              className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50"
                            >
                              {REMINDER_OPTIONS.map(opt => (
                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                              ))}
                            </select>
                          </div>
                          {!editingId && (
                            <div>
                              <label className="block text-slate-500 mb-1">シフト登録方法</label>
                              <select value={repeatOption} onChange={e => setRepeatOption(e.target.value)} className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50 font-bold">
                                <option value="none">1日のみ登録</option>
                                <option value="weekday_month">曜日指定で1ヶ月分一括</option>
                                <option value="weekly_4">毎週同じ曜日（4週グループ）</option>
                              </select>
                            </div>
                          )}
                        </div>

                        {!editingId && repeatOption === 'weekday_month' && (
                          <div className="bg-stone-50 p-3 rounded-xl border border-stone-200/80 space-y-2.5">
                            <div className="flex items-center justify-between">
                              <span className="font-bold text-slate-700">対象月と曜日を選択</span>
                              <div className="flex space-x-1">
                                <button
                                  type="button"
                                  onClick={() => setBulkTargetMonth('current')}
                                  className={`px-2 py-0.5 rounded text-[10px] font-bold border ${
                                    bulkTargetMonth === 'current' ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 border-stone-200'
                                  }`}
                                >
                                  {month}月
                                </button>
                                <button
                                  type="button"
                                  onClick={() => setBulkTargetMonth('next')}
                                  className={`px-2 py-0.5 rounded text-[10px] font-bold border ${
                                    bulkTargetMonth === 'next' ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 border-stone-200'
                                  }`}
                                >
                                  {month === 12 ? 1 : month + 1}月
                                </button>
                              </div>
                            </div>

                            <div className="grid grid-cols-7 gap-1">
                              {WEEKDAY_LABELS.map((label, idx) => {
                                const active = selectedWeekdays.includes(idx);
                                return (
                                  <button
                                    key={label}
                                    type="button"
                                    onClick={() => toggleWeekdayChoice(idx)}
                                    className={`py-2 rounded-lg font-bold text-xs border transition ${
                                      active
                                        ? 'bg-emerald-700 text-white border-emerald-700'
                                        : 'bg-white text-slate-600 border-stone-200'
                                    }`}
                                  >
                                    {label}
                                  </button>
                                );
                              })}
                            </div>

                            <div className="flex justify-between items-center text-[11px] pt-1 border-t border-stone-200/70">
                              <span className="text-slate-600">該当日数: <b>{bulkWeekdayDates.length}日分</b></span>
                              {shiftPreviewDetails && (
                                <span className="font-bold text-emerald-700">
                                  合計見込: +{(shiftPreviewDetails.pay * bulkWeekdayDates.length).toLocaleString()}円
                                </span>
                              )}
                            </div>
                          </div>
                        )}

                        <div>
                          <label className="block text-slate-500 mb-1">メモ（任意）</label>
                          <input type="text" placeholder="例：早番、ヘルプ出勤" value={newEvent.memo} onChange={e => setNewEvent({ ...newEvent, memo: e.target.value })} className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50" />
                        </div>
                      </>
                    )
                  )}

                  {!(modalTab === 'shift' && jobs.length === 0) && (
                    <button type="submit" className="w-full bg-slate-800 hover:bg-slate-700 text-white p-3 rounded-xl font-bold text-sm transition">
                      {editingId
                        ? (newEvent.groupId && editGroupScope === 'group' ? 'グループ全体を一括更新する' : '変更を保存する')
                        : modalTab === 'shift' && repeatOption === 'weekday_month'
                        ? `${bulkWeekdayDates.length}日分のシフトを一括登録する`
                        : '登録する'}
                    </button>
                  )}
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
