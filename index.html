<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>予定＆家計簿 Pro</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { user-select: none; -webkit-user-select: none; }
    input, textarea, select { user-select: auto; -webkit-user-select: auto; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex justify-center">
  <div id="root" class="w-full max-w-md bg-gray-50 min-h-screen flex flex-col shadow-xl"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const COLOR_PALETTE = [
      { name: '仕事・学業', color: '#3B82F6' },
      { name: '遊び・交際', color: '#EC4899' },
      { name: '食費・買物', color: '#F59E0B' },
      { name: 'バイト・収入', color: '#10B981' },
      { name: '固定費・重要', color: '#8B5CF6' },
      { name: 'その他', color: '#6B7280' }
    ];

    const encodeShareData = (obj) => {
      const json = JSON.stringify(obj);
      const bytes = new TextEncoder().encode(json);
      let binString = '';
      bytes.forEach((b) => { binString += String.fromCharCode(b); });
      return btoa(binString).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    };

    const decodeShareData = (str) => {
      try {
        let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) base64 += '=';
        const binString = atob(base64);
        const bytes = new Uint8Array(binString.length);
        for (let i = 0; i < binString.length; i++) bytes[i] = binString.charCodeAt(i);
        const json = new TextDecoder().decode(bytes);
        return JSON.parse(json);
      } catch (e) {
        return null;
      }
    };

    // 日付文字列の加算・減算ヘルパー (YYYY-MM-DD)
    const shiftDateStr = (dateStr, diffDays) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + diffDays);
      const ny = dt.getFullYear();
      const nm = String(dt.getMonth() + 1).padStart(2, '0');
      const nd = String(dt.getDate()).padStart(2, '0');
      return `${ny}-${nm}-${nd}`;
    };

    // イベントが指定日(dateStr)に該当するかを判定（複数日・日またぎ対応）
    const isEventOnDate = (ev, dateStr) => {
      const start = ev.date;
      const end = ev.endDate && ev.endDate >= start ? ev.endDate : start;
      return dateStr >= start && dateStr <= end;
    };

    function App() {
      const todayStr = new Date().toISOString().split('T')[0];
      const [currentDate, setCurrentDate] = useState(new Date());
      const [viewMode, setViewMode] = useState('month');
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [financeFilter, setFinanceFilter] = useState('all');

      const [sharedEvents, setSharedEvents] = useState(null);
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [shareOptions, setShareOptions] = useState({
        scope: 'month',
        hideMoney: true,
        hideMemo: true,
        maskTitle: false
      });
      const [generatedShareUrl, setGeneratedShareUrl] = useState('');

      const [jobs, setJobs] = useState(() => {
        const saved = localStorage.getItem('app_jobs_v3');
        return saved ? JSON.parse(saved) : [];
      });

      const [myEvents, setMyEvents] = useState(() => {
        const saved = localStorage.getItem('app_events_v3');
        return saved ? JSON.parse(saved) : [];
      });

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const shareParam = params.get('s');
        if (shareParam) {
          const decoded = decodeShareData(shareParam);
          if (decoded && Array.isArray(decoded.events)) {
            setSharedEvents(decoded.events);
            if (decoded.targetDate) {
              setCurrentDate(new Date(decoded.targetDate));
              setSelectedDate(decoded.targetDate);
            }
          }
        }
      }, []);

      const isViewingShared = sharedEvents !== null;
      const events = isViewingShared ? sharedEvents : myEvents;
      const setEvents = (updater) => {
        if (isViewingShared) return;
        setMyEvents(updater);
      };

      // 追加・編集モーダル用ステート
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingId, setEditingId] = useState(null); // nullなら新規作成、IDがあれば編集モード
      const [subItemInput, setSubItemInput] = useState({ name: '', price: '' });
      const [repeatOption, setRepeatOption] = useState('none');
      
      const [newEvent, setNewEvent] = useState({
        title: '', date: todayStr, endDate: todayStr,
        startTime: '09:00', endTime: '17:00', color: '#3B82F6',
        amount: 0, isExpense: true, isShift: false, jobId: '',
        subItems: [], memo: '', completed: false
      });

      const [newJob, setNewJob] = useState({ name: '', hourlyWage: 1100, transportFee: 0, autoBreak: true, color: '#10B981' });
      const [backupText, setBackupText] = useState('');

      useEffect(() => { localStorage.setItem('app_jobs_v3', JSON.stringify(jobs)); }, [jobs]);
      useEffect(() => { localStorage.setItem('app_events_v3', JSON.stringify(myEvents)); }, [myEvents]);

      // 前日・翌日移動（月が変わったらヘッダーの年月も自動追従）
      const handleMoveDay = (diff) => {
        const nextStr = shiftDateStr(selectedDate, diff);
        setSelectedDate(nextStr);
        const [ny, nm] = nextStr.split('-').map(Number);
        if (ny !== currentDate.getFullYear() || nm !== currentDate.getMonth() + 1) {
          setCurrentDate(new Date(ny, nm - 1, 1));
        }
      };

      // 新規作成モーダルを開く
      const openCreateModal = () => {
        setEditingId(null);
        setRepeatOption('none');
        setSubItemInput({ name: '', price: '' });
        setNewEvent({
          title: '', date: selectedDate, endDate: selectedDate,
          startTime: '09:00', endTime: '17:00', color: '#3B82F6',
          amount: 0, isExpense: true, isShift: false, jobId: '',
          subItems: [], memo: '', completed: false
        });
        setIsModalOpen(true);
      };

      // 編集モーダルを開く
      const openEditModal = (ev) => {
        if (isViewingShared) return;
        setEditingId(ev.id);
        setRepeatOption('none');
        setSubItemInput({ name: '', price: '' });
        setNewEvent({
          ...ev,
          endDate: ev.endDate || ev.date,
          subItems: ev.subItems || [],
          jobId: ev.shiftMeta?.jobId || ev.jobId || ''
        });
        setIsModalOpen(true);
      };

      const createShareLink = () => {
        const y = currentDate.getFullYear();
        const m = currentDate.getMonth() + 1;
        const monthPrefix = `${y}-${String(m).padStart(2, '0')}`;

        const targetList = myEvents.filter(ev => {
          if (shareOptions.scope === 'day') return isEventOnDate(ev, selectedDate);
          const startM = ev.date.slice(0, 7);
          const endM = (ev.endDate || ev.date).slice(0, 7);
          return monthPrefix >= startM && monthPrefix <= endM;
        });

        const sanitized = targetList.map(ev => ({
          id: ev.id,
          date: ev.date,
          endDate: ev.endDate || ev.date,
          startTime: ev.startTime,
          endTime: ev.endTime,
          color: ev.color,
          title: shareOptions.maskTitle ? (ev.isShift ? 'バイト' : '予定あり') : ev.title,
          amount: shareOptions.hideMoney ? 0 : ev.amount,
          isExpense: ev.isExpense,
          isShift: ev.isShift,
          memo: shareOptions.hideMemo ? '' : ev.memo,
          subItems: (shareOptions.hideMoney || shareOptions.hideMemo) ? [] : ev.subItems,
          completed: ev.completed
        }));

        const payload = {
          targetDate: shareOptions.scope === 'day' ? selectedDate : `${monthPrefix}-01`,
          events: sanitized
        };

        const encoded = encodeShareData(payload);
        const baseUrl = window.location.origin + window.location.pathname;
        const fullUrl = `${baseUrl}?s=${encoded}`;
        setGeneratedShareUrl(fullUrl);
      };

      const copyShareUrl = () => {
        if (!generatedShareUrl) return;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(generatedShareUrl);
          alert('共有URLをコピーしました！LINEやDMに貼り付けて送れます。');
        }
      };

      const importSharedToMine = () => {
        if (!sharedEvents) return;
        if (window.confirm(`共有された ${sharedEvents.length} 件の予定を自分のカレンダーに追加しますか？`)) {
          const imported = sharedEvents.map((ev, i) => ({
            ...ev,
            id: `imported_${Date.now()}_${i}`
          }));
          setMyEvents([...myEvents, ...imported]);
          exitShareMode();
          alert('自分のカレンダーに取り込みました！');
        }
      };

      const exitShareMode = () => {
        setSharedEvents(null);
        window.history.replaceState({}, document.title, window.location.pathname);
      };

      const getDaysInMonth = (date) => {
        const year = date.getFullYear();
        const month = date.getMonth();
        const days = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();
        return { days, firstDay };
      };

      const calculateShiftDetails = (startTime, endTime, job) => {
        if (!startTime || !endTime || !job) return { pay: 0, workHours: 0, breakMins: 0, transport: 0 };
        const [startH, startM] = startTime.split(':').map(Number);
        const [endH, endM] = endTime.split(':').map(Number);
        let totalHours = (endH + endM / 60) - (startH + startM / 60);
        if (totalHours < 0) totalHours += 24;

        let breakMins = 0;
        if (job.autoBreak) {
          if (totalHours > 8) breakMins = 60;
          else if (totalHours > 6) breakMins = 45;
        }
        const workHours = Math.max(0, totalHours - (breakMins / 60));
        const wagePay = Math.round(workHours * job.hourlyWage);
        const transport = Number(job.transportFee || 0);
        return {
          pay: wagePay + transport,
          wagePay,
          workHours: Math.round(workHours * 100) / 100,
          breakMins,
          transport
        };
      };

      const handleAddSubItem = () => {
        if (!subItemInput.name || !subItemInput.price) return;
        const updatedSub = [...newEvent.subItems, { id: Date.now(), name: subItemInput.name, price: Number(subItemInput.price) }];
        const sum = updatedSub.reduce((acc, item) => acc + item.price, 0);
        setNewEvent({ ...newEvent, subItems: updatedSub, amount: sum });
        setSubItemInput({ name: '', price: '' });
      };

      const handleRemoveSubItem = (id) => {
        const updatedSub = newEvent.subItems.filter(item => item.id !== id);
        const sum = updatedSub.reduce((acc, item) => acc + item.price, 0);
        setNewEvent({ ...newEvent, subItems: updatedSub, amount: sum });
      };

      // 新規登録＆編集保存の共通処理
      const handleSaveEvent = (e) => {
        e.preventDefault();
        let calculatedAmount = Number(newEvent.amount);
        let title = newEvent.title;
        let isExpense = newEvent.isExpense;
        let color = newEvent.color;
        let shiftMeta = null;

        const validEndDate = newEvent.endDate && newEvent.endDate >= newEvent.date ? newEvent.endDate : newEvent.date;

        if (newEvent.isShift) {
          const selectedJob = jobs.find(j => j.id === newEvent.jobId);
          if (!selectedJob) {
            alert('勤務先を選択してください。未登録の場合は設定タブから追加できます。');
            return;
          }
          const details = calculateShiftDetails(newEvent.startTime, newEvent.endTime, selectedJob);
          calculatedAmount = details.pay;
          if (!title) title = `${selectedJob.name}`;
          isExpense = false;
          color = selectedJob.color;
          shiftMeta = { jobId: selectedJob.id, jobName: selectedJob.name, workHours: details.workHours, transport: details.transport, breakMins: details.breakMins };
        }

        // 編集モードの場合
        if (editingId) {
          const updatedEvents = myEvents.map(ev => {
            if (ev.id !== editingId) return ev;
            return {
              ...newEvent,
              id: editingId,
              endDate: validEndDate,
              title: title || '無題の予定',
              amount: calculatedAmount,
              isExpense,
              color,
              shiftMeta
            };
          });
          setEvents(updatedEvents);
          setIsModalOpen(false);
          setEditingId(null);
          return;
        }

        // 新規登録モード（繰り返し対応）
        const spanDays = Math.round((new Date(validEndDate) - new Date(newEvent.date)) / (1000 * 60 * 60 * 24));
        const targetStartDates = [newEvent.date];
        const baseDate = new Date(newEvent.date);

        if (repeatOption === 'weekly_4') {
          for (let i = 1; i <= 3; i++) {
            const d = new Date(baseDate);
            d.setDate(baseDate.getDate() + i * 7);
            targetStartDates.push(d.toISOString().split('T')[0]);
          }
        } else if (repeatOption === 'monthly_3') {
          for (let i = 1; i <= 2; i++) {
            const d = new Date(baseDate);
            d.setMonth(baseDate.getMonth() + i);
            targetStartDates.push(d.toISOString().split('T')[0]);
          }
        }

        const createdItems = targetStartDates.map((dStr, idx) => ({
          ...newEvent,
          id: `${Date.now()}_${idx}`,
          date: dStr,
          endDate: shiftDateStr(dStr, spanDays),
          title: title || '無題の予定',
          amount: calculatedAmount,
          isExpense,
          color,
          shiftMeta
        }));

        setEvents([...myEvents, ...createdItems]);
        setIsModalOpen(false);
        setRepeatOption('none');
        setSubItemInput({ name: '', price: '' });
      };

      const toggleComplete = (id) => {
        if (isViewingShared) return;
        setEvents(myEvents.map(ev => ev.id === id ? { ...ev, completed: !ev.completed } : ev));
      };

      const deleteEvent = (id) => {
        if (isViewingShared) return;
        if (window.confirm('この予定を削除しますか？')) {
          setEvents(myEvents.filter(ev => ev.id !== id));
        }
      };

      const addJob = () => {
        if (!newJob.name) return;
        setJobs([...jobs, { ...newJob, id: Date.now().toString() }]);
        setNewJob({ name: '', hourlyWage: 1100, transportFee: 0, autoBreak: true, color: '#10B981' });
      };

      const deleteJob = (id) => {
        setJobs(jobs.filter(j => j.id !== id));
      };

      const exportBackup = () => {
        const data = JSON.stringify({ jobs, events: myEvents });
        setBackupText(data);
        if (navigator.clipboard) {
          navigator.clipboard.writeText(data);
          alert('バックアップデータをクリップボードにコピーしました！');
        }
      };

      const importBackup = () => {
        try {
          const parsed = JSON.parse(backupText);
          if (parsed.jobs && parsed.events) {
            setJobs(parsed.jobs);
            setMyEvents(parsed.events);
            alert('データを復元しました！');
            setBackupText('');
          } else {
            alert('データ形式が正しくありません。');
          }
        } catch (err) {
          alert('読み込みに失敗しました。');
        }
      };

      const monthData = getDaysInMonth(currentDate);
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;

      // 開始日が当月のイベント（金額集計・収支一覧用）
      const monthlyFinanceEvents = events.filter(ev => {
        const evDate = new Date(ev.date);
        return evDate.getFullYear() === year && evDate.getMonth() + 1 === month;
      }).sort((a, b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime));

      const monthlyStats = monthlyFinanceEvents.reduce((acc, ev) => {
        if (ev.isExpense) {
          acc.expense += ev.amount;
          if (ev.completed) acc.confirmedExpense += ev.amount;
        } else {
          acc.income += ev.amount;
          if (ev.completed) acc.confirmedIncome += ev.amount;
        }
        return acc;
      }, { income: 0, expense: 0, confirmedIncome: 0, confirmedExpense: 0 });

      const jobBreakdown = jobs.map(job => {
        const jobShifts = monthlyFinanceEvents.filter(ev => ev.isShift && ev.shiftMeta?.jobId === job.id);
        const totalPay = jobShifts.reduce((sum, ev) => sum + ev.amount, 0);
        const totalHours = jobShifts.reduce((sum, ev) => sum + (ev.shiftMeta?.workHours || 0), 0);
        return { ...job, count: jobShifts.length, totalPay, totalHours: Math.round(totalHours * 10) / 10 };
      }).filter(j => j.count > 0);

      // 選択日に該当するイベント（複数日・日またぎ予定も含む）
      const dayEvents = events
        .filter(e => isEventOnDate(e, selectedDate))
        .sort((a, b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime));

      // 日別の収支合計（金額は開始日ベースで計算）
      const dayStats = dayEvents.reduce((acc, ev) => {
        if (ev.date !== selectedDate) return acc;
        if (ev.isExpense) acc.expense += ev.amount;
        else acc.income += ev.amount;
        return acc;
      }, { income: 0, expense: 0 });

      const filteredFinanceList = monthlyFinanceEvents.filter(ev => {
        if (ev.amount <= 0) return false;
        if (financeFilter === 'income') return !ev.isExpense;
        if (financeFilter === 'expense') return ev.isExpense;
        return true;
      });

      return (
        <div className="flex-1 flex flex-col pb-20 relative font-sans">
          {isViewingShared && (
            <div className="bg-amber-500 text-white p-2.5 text-xs flex flex-col space-y-1.5 shadow-md z-20">
              <div className="font-bold flex items-center justify-between">
                <span>👀 共有された予定を閲覧中（読み取り専用）</span>
              </div>
              <div className="flex space-x-2">
                <button onClick={importSharedToMine} className="flex-1 bg-white text-amber-700 font-bold py-1 rounded shadow-sm">
                  自分の予定に取り込む
                </button>
                <button onClick={exitShareMode} className="flex-1 bg-amber-700 text-white font-bold py-1 rounded">
                  閲覧を終了する
                </button>
              </div>
            </div>
          )}

          <header className={`${isViewingShared ? 'bg-amber-600' : 'bg-indigo-600'} text-white p-4 sticky top-0 z-10 shadow-md`}>
            <div className="flex justify-between items-center mb-2">
              <div className="flex items-center space-x-2">
                <h1 className="text-xl font-bold">📅 {year}年 {month}月</h1>
                {!isViewingShared && (
                  <button
                    onClick={() => { setGeneratedShareUrl(''); setIsShareModalOpen(true); }}
                    className="bg-white/20 hover:bg-white/30 text-white text-[11px] px-2.5 py-1 rounded-full font-bold flex items-center space-x-1"
                  >
                    <span>🔗 共有</span>
                  </button>
                )}
              </div>
              <div className="flex space-x-1">
                <button onClick={() => setCurrentDate(new Date(year, month - 2, 1))} className="px-2.5 py-1 bg-black/20 hover:bg-black/30 rounded text-xs">◀</button>
                <button onClick={() => setCurrentDate(new Date())} className="px-2.5 py-1 bg-black/20 hover:bg-black/30 rounded text-xs font-bold">今月</button>
                <button onClick={() => setCurrentDate(new Date(year, month, 1))} className="px-2.5 py-1 bg-black/20 hover:bg-black/30 rounded text-xs">▶</button>
              </div>
            </div>

            <div className="grid grid-cols-3 gap-2 mt-2 pt-2 border-t border-white/20 text-center text-xs">
              <div className="bg-black/15 p-2 rounded">
                <div className="text-white/80 text-[10px]">見込収入</div>
                <div className="text-sm font-bold text-green-300">+{monthlyStats.income.toLocaleString()}円</div>
              </div>
              <div className="bg-black/15 p-2 rounded">
                <div className="text-white/80 text-[10px]">予定支出</div>
                <div className="text-sm font-bold text-red-300">-{monthlyStats.expense.toLocaleString()}円</div>
              </div>
              <div className="bg-black/15 p-2 rounded">
                <div className="text-white/80 text-[10px]">月末着地見込</div>
                <div className={`text-sm font-bold ${monthlyStats.income - monthlyStats.expense >= 0 ? 'text-white' : 'text-red-300'}`}>
                  {(monthlyStats.income - monthlyStats.expense).toLocaleString()}円
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 p-3">
            {/* 1. 月表示 */}
            {viewMode === 'month' && (
              <div className="bg-white rounded-xl shadow p-2.5">
                <div className="grid grid-cols-7 gap-1 mb-2 text-center text-xs font-bold text-gray-500">
                  <span className="text-red-500">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span className="text-blue-500">土</span>
                </div>
                <div className="grid grid-cols-7 gap-1">
                  {Array.from({ length: monthData.firstDay }).map((_, i) => (
                    <div key={`empty-${i}`} className="h-16 bg-gray-50/50 rounded" />
                  ))}
                  {Array.from({ length: monthData.days }).map((_, i) => {
                    const dayNum = i + 1;
                    const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                    const isSelected = dateStr === selectedDate;
                    const isToday = dateStr === todayStr;
                    const currentDayEvents = events.filter(e => isEventOnDate(e, dateStr));
                    const dayNet = currentDayEvents.reduce((sum, e) => {
                      if (e.date !== dateStr) return sum;
                      return sum + (e.isExpense ? -e.amount : e.amount);
                    }, 0);

                    return (
                      <div
                        key={dayNum}
                        onClick={() => { setSelectedDate(dateStr); setViewMode('day'); }}
                        className={`h-16 p-1 border rounded-lg flex flex-col justify-between cursor-pointer transition ${
                          isSelected ? 'border-indigo-600 bg-indigo-50/50 ring-2 ring-indigo-500/20' : 'border-gray-100 hover:bg-gray-50'
                        } ${isToday ? 'bg-indigo-50/30 font-bold' : ''}`}
                      >
                        <div className="flex justify-between items-center">
                          <span className={`text-[11px] ${isToday ? 'bg-indigo-600 text-white rounded-full w-4 h-4 flex items-center justify-center' : ''}`}>
                            {dayNum}
                          </span>
                          {dayNet !== 0 && (
                            <span className={`text-[8px] font-bold ${dayNet > 0 ? 'text-green-600' : 'text-red-500'}`}>
                              {dayNet > 0 ? `+${Math.round(dayNet/1000)}k` : `-${Math.round(Math.abs(dayNet)/1000)}k`}
                            </span>
                          )}
                        </div>
                        <div className="space-y-0.5 overflow-hidden">
                          {currentDayEvents.slice(0, 2).map((ev) => {
                            const isMultiDay = ev.endDate && ev.endDate > ev.date;
                            return (
                              <div key={ev.id} className="text-[8px] truncate px-1 rounded text-white font-medium" style={{ backgroundColor: ev.color || '#3B82F6' }}>

                      <div>
                        <label className="block text-gray-500 mb-1">タイトル</label>
                        <input type="text" placeholder="例：大学講義、1泊2日旅行、家賃引き落とし" value={newEvent.title} onChange={e => setNewEvent({ ...newEvent, title: e.target.value })} className="w-full p-2 border rounded" required />
                      </div>

                      <div>
                        <label className="block text-gray-500 mb-1">カテゴリ色分け</label>
                        <div className="flex space-x-2 overflow-x-auto no-scrollbar py-1">
                          {COLOR_PALETTE.map(c => (
                            <button
                              type="button"
                              key={c.color}
                              onClick={() => setNewEvent({ ...newEvent, color: c.color })}
                              className={`px-2.5 py-1 rounded-full text-[10px] font-bold text-white whitespace-nowrap flex items-center space-x-1 ${newEvent.color === c.color ? 'ring-2 ring-offset-1 ring-gray-800' : 'opacity-75'}`}
                              style={{ backgroundColor: c.color }}
                            >
                              <span>{c.name}</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    </>
                  )}

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-gray-500 mb-1">開始時間</label>
                      <input type="time" value={newEvent.startTime} onChange={e => setNewEvent({ ...newEvent, startTime: e.target.value })} className="w-full p-2 border rounded" />
                    </div>
                    <div>
                      <label className="block text-gray-500 mb-1">終了時間</label>
                      <input type="time" value={newEvent.endTime} onChange={e => setNewEvent({ ...newEvent, endTime: e.target.value })} className="w-full p-2 border rounded" />
                    </div>
                  </div>

                  {!newEvent.isShift && (
                    <div className="space-y-2 border-t pt-2">
                      <div className="flex items-center justify-between">
                        <label className="text-gray-500 font-bold">金額・予算試算</label>
                        <div className="flex space-x-3">
                          <label className="flex items-center space-x-1 cursor-pointer">
                            <input type="radio" name="exp" checked={newEvent.isExpense} onChange={() => setNewEvent({ ...newEvent, isExpense: true })} />
                            <span className="text-red-600 font-bold">支出</span>
                          </label>
                          <label className="flex items-center space-x-1 cursor-pointer">
                            <input type="radio" name="exp" checked={!newEvent.isExpense} onChange={() => setNewEvent({ ...newEvent, isExpense: false })} />
                            <span className="text-green-600 font-bold">収入</span>
                          </label>
                        </div>
                      </div>
                      <input type="number" placeholder="合計金額（0で金額なし）" value={newEvent.amount || ''} onChange={e => setNewEvent({ ...newEvent, amount: Number(e.target.value) })} className="w-full p-2 border rounded font-bold" />

                      <div className="bg-gray-50 p-2.5 rounded-lg space-y-2">
                        <div className="text-[10px] font-bold text-gray-500">内訳を追加して自動合計する（任意）</div>
                        <div className="flex space-x-1.5">
                          <input type="text" placeholder="項目（例：交通費）" value={subItemInput.name} onChange={e => setSubItemInput({ ...subItemInput, name: e.target.value })} className="flex-1 p-1.5 border rounded bg-white" />
                          <input type="number" placeholder="金額" value={subItemInput.price} onChange={e => setSubItemInput({ ...subItemInput, price: e.target.value })} className="w-20 p-1.5 border rounded bg-white" />
                          <button type="button" onClick={handleAddSubItem} className="bg-gray-700 text-white px-2.5 rounded font-bold">追加</button>
                        </div>
                        {newEvent.subItems.length > 0 && (
                          <div className="space-y-1 pt-1">
                            {newEvent.subItems.map(sub => (
                              <div key={sub.id} className="flex justify-between items-center text-[11px] bg-white px-2 py-1 rounded border">
                                <span>{sub.name}</span>
                                <div className="flex items-center space-x-2">
                                  <span className="font-bold">{sub.price.toLocaleString()}円</span>
                                  <button type="button" onClick={() => handleRemoveSubItem(sub.id)} className="text-red-400">✕</button>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block text-gray-500 mb-1">メモ・持ち物リスト</label>
                    <textarea placeholder="メモを残せます" value={newEvent.memo} onChange={e => setNewEvent({ ...newEvent, memo: e.target.value })} className="w-full p-2 border rounded h-14" />
                  </div>

                  <button type="submit" className="w-full bg-indigo-600 text-white p-3 rounded-xl font-bold hover:bg-indigo-700 text-sm">
                    {editingId ? '変更を保存する' : '登録する'}
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
