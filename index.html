  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231E293B'/%3E%3Crect x='34' y='44' width='112' height='98' rx='18' fill='%23F8FAFC'/%3E%3Crect x='34' y='44' width='112' height='28' rx='12' fill='%234A8B71'/%3E%3Ccircle cx='66' cy='96' r='8' fill='%231E293B'/%3E%3Ccircle cx='90' cy='96' r='8' fill='%231E293B'/%3E%3Ccircle cx='114' cy='96' r='8' fill='%23C28540'/%3E%3Ccircle cx='66' cy='120' r='8' fill='%2394A3B8'/%3E%3Ccircle cx='90' cy='120' r='8' fill='%2394A3B8'/%3E%3C/svg%3E">

<body class="bg-stone-200/70 min-h-screen text-slate-800 flex justify-center">
  <div id="root" class="w-full max-w-md bg-stone-50 min-h-screen flex flex-col shadow-xl border-x border-stone-200/80"></div>

  <script>
    window.onerror = function(msg, url, line) {
      var root = document.getElementById('root');
      if (root && !root.innerHTML) {
        root.innerHTML = '<div style="padding:20px;color:#B91C1C;font-size:12px;">エラーが発生しました: ' + msg + ' (Line: ' + line + ')</div>';
      }
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function() {});
      });
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const COLOR_PALETTE = [
      { name: '仕事・学業', color: '#476C9B' },
      { name: '遊び・交際', color: '#B85D7A' },
      { name: '食費・買物', color: '#C28540' },
      { name: '交通・移動', color: '#3E7B67' },
      { name: 'バイト・収入', color: '#4A8B71' },
      { name: '固定費・重要', color: '#78689E' },
      { name: 'その他', color: '#64748B' }
    ];

    // デフォルトのワンタップ定型文は1件のみ
    const DEFAULT_TEMPLATES = [
      { id: 'tpl_1', title: 'ランチ・食費', amount: 600, isExpense: true, color: '#C28540', memo: '' }
    ];

    const IMPORT_COLOR_PRESETS = [
      { name: 'セージグリーン', color: '#3E7B67' },
      { name: 'ダスティローズ', color: '#A8556F' },
      { name: 'テラコッタ', color: '#B56547' },
      { name: 'スレートブルー', color: '#486B8A' },
      { name: 'モーブパープル', color: '#735E8C' },
      { name: '元の色のまま', color: 'ORIGINAL' }
    ];

    const getCategoryNameByColor = (colorHex) => {
      if (!colorHex) return 'その他';
      const found = COLOR_PALETTE.find(c => c.color.toLowerCase() === colorHex.toLowerCase());
      return found ? found.name : 'その他';
    };

    // 対象年月(YYYY, MM)の翌月振込日(YYYY-MM-DD)を算出（payDay=31なら末日扱い）
    const getNextMonthPayDate = (workYear, workMonth, payDay) => {
      const nextMonthIndex = workMonth; // workMonthは1〜12なのでDateの月インデックスとしては翌月になる
      const targetYear = workYear + Math.floor(nextMonthIndex / 12);
      const targetMonth = (nextMonthIndex % 12) + 1;
      const lastDayOfTargetMonth = new Date(targetYear, targetMonth, 0).getDate();
      const validDay = Math.min(Math.max(1, Number(payDay) || 25), lastDayOfTargetMonth);
      return `${targetYear}-${String(targetMonth).padStart(2, '0')}-${String(validDay).padStart(2, '0')}`;
    };

    const getJapaneseHolidayName = (dateStr) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const dow = dt.getDay();

      const checkBasicHoliday = (year, month, day) => {
        const w = new Date(year, month - 1, day).getDay();
        const nthMonday = Math.floor((day - 1) / 7) + 1;

        if (month === 1 && day === 1) return '元日';
        if (month === 1 && w === 1 && nthMonday === 2) return '成人の日';
        if (month === 2 && day === 11) return '建国記念の日';
        if (month === 2 && day === 23) return '天皇誕生日';
        const vernal = Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
        if (month === 3 && day === vernal) return '春分の日';
        if (month === 4 && day === 29) return '昭和の日';
        if (month === 5 && day === 3) return '憲法記念日';
        if (month === 5 && day === 4) return 'みどりの日';
        if (month === 5 && day === 5) return 'こどもの日';
        if (month === 7 && w === 1 && nthMonday === 3) return '海の日';
        if (month === 8 && day === 11) return '山の日';
        if (month === 9 && w === 1 && nthMonday === 3) return '敬老の日';
        const autumnal = Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
        if (month === 9 && day === autumnal) return '秋分の日';
        if (month === 10 && w === 1 && nthMonday === 2) return 'スポーツの日';
        if (month === 11 && day === 3) return '文化の日';
        if (month === 11 && day === 23) return '勤労感謝の日';
        return null;
      };

      const direct = checkBasicHoliday(y, m, d);
      if (direct) return direct;

      if (dow !== 0) {
        let checkDt = new Date(y, m - 1, d - 1);
        while (true) {
          const h = checkBasicHoliday(checkDt.getFullYear(), checkDt.getMonth() + 1, checkDt.getDate());
          if (!h) break;
          if (checkDt.getDay() === 0) return '振替休日';
          checkDt.setDate(checkDt.getDate() - 1);
        }
      }
      return null;
    };

    const encodeShareData = (obj) => {
      const json = JSON.stringify(obj);
      const bytes = new TextEncoder().encode(json);
      let binString = '';
      bytes.forEach((b) => { binString += String.fromCharCode(b); });
      return btoa(binString).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    };

    const decodeShareData = (str) => {
      try {
        let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) base64 += '=';
        const binString = atob(base64);
        const bytes = new Uint8Array(binString.length);
        for (let i = 0; i < binString.length; i++) bytes[i] = binString.charCodeAt(i);
        const json = new TextDecoder().decode(bytes);
        return JSON.parse(json);
      } catch (e) {
        return null;
      }
    };

    const shiftDateStr = (dateStr, diffDays) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + diffDays);
      const ny = dt.getFullYear();
      const nm = String(dt.getMonth() + 1).padStart(2, '0');
      const nd = String(dt.getDate()).padStart(2, '0');
      return `${ny}-${nm}-${nd}`;
    };

    const isEventOnDate = (ev, dateStr) => {
      const start = ev.date;
      const end = ev.endDate && ev.endDate >= start ? ev.endDate : start;
      return dateStr >= start && dateStr <= end;
    };

    const checkDuplicateEvent = (candidate, existingEvents) => {
      const cleanCandTitle = (candidate.title || '').replace(/^\[.*?\]\s*/, '').trim().toLowerCase();
      return existingEvents.find(ev => {
        if (!ev.isExpense || ev.amount !== candidate.amount) return false;
        const sameDate = ev.date === candidate.date;
        const cleanEvTitle = (ev.title || '').replace(/^\[.*?\]\s*/, '').trim().toLowerCase();
        const similarTitle = cleanCandTitle && cleanEvTitle && (cleanEvTitle.includes(cleanCandTitle) || cleanCandTitle.includes(cleanEvTitle));
        return sameDate && (similarTitle || ev.amount === candidate.amount);
      });
    };

    const parseStatementText = (rawText, defaultDateStr, existingEvents = []) => {
      const text = rawText.trim();
      if (!text) return [];
      const rawResults = [];
      const defaultYear = Number(defaultDateStr.split('-')[0]);

      const normalizeDate = (rawDate) => {
        if (!rawDate) return defaultDateStr;
        const cleaned = rawDate.replace(/[年月]/g, '-').replace(/日/g, '').replace(/\//g, '-').trim();
        const parts = cleaned.split('-').map(p => p.trim()).filter(Boolean);
        if (parts.length === 3) {
          const y = parts[0].length === 2 ? `20${parts[0]}` : parts[0];
          return `${y}-${String(parts[1]).padStart(2, '0')}-${String(parts[2]).padStart(2, '0')}`;
        }
        if (parts.length === 2) {
          return `${defaultYear}-${String(parts[0]).padStart(2, '0')}-${String(parts[1]).padStart(2, '0')}`;
        }
        return defaultDateStr;
      };

      const mailDateMatch = text.match(/(?:利用日|ご利用日|利用日時|日時)[：:\s]*(\d{4}[\/\-年]\d{1,2}[\/\-月]\d{1,2}日?|\d{1,2}[\/\-月]\d{1,2}日?)/);
      const mailAmountMatch = text.match(/(?:利用金額|ご利用金額|お支払い金額|決済金額|金額)[：:\s]*[¥￥]?\s*([0-9,]+)\s*円?/);
      const mailMerchantMatch = text.match(/(?:利用先|ご利用先|利用店名|ご利用店名|加盟店|店舗名)[：:\s]*([^\r\n]+)/);

      if (mailAmountMatch && (mailDateMatch || mailMerchantMatch)) {
        const amount = Number(mailAmountMatch[1].replace(/,/g, ''));
        if (amount > 0) {
          const date = normalizeDate(mailDateMatch ? mailDateMatch[1] : null);
          const merchant = mailMerchantMatch ? mailMerchantMatch[1].trim() : 'カード利用';
          rawResults.push({
            id: `stmt_${Date.now()}_0`,
            date,
            title: merchant,
            amount
          });
        }
      } else {
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        lines.forEach((line, idx) => {
          if (/^(利用日|日付|年月日|合計|小計)/.test(line)) return;

          const cols = line.includes(',')
            ? line.split(',').map(c => c.replace(/^["']|["']$/g, '').trim())
            : line.split(/\s+/);

          let foundDate = null;
          let foundAmount = null;
          const textCandidates = [];

          cols.forEach(col => {
            if (!foundDate && /^(\d{2,4}[\/\-年]\d{1,2}[\/\-月]\d{1,2}日?|\d{1,2}[\/\-月]\d{1,2}日?)$/.test(col)) {
              foundDate = normalizeDate(col);
              return;
            }
            const cleanNum = col.replace(/[¥￥円,、\s]/g, '');
            if (foundAmount === null && /^-?\d+$/.test(cleanNum)) {
              const num = Math.abs(Number(cleanNum));
              if (num > 0 && num < 10000000) {
                foundAmount = num;
                return;
              }
            }
            if (col && !/^(1回|一括|ﾘﾎﾞ|分割|本人|家族)$/.test(col)) {
              textCandidates.push(col);
            }
          });

          if (!foundAmount) {
            const inlineAmt = line.match(/([0-9,]+)\s*円/);
            if (inlineAmt) foundAmount = Number(inlineAmt[1].replace(/,/g, ''));
          }
          if (!foundDate) {
            const inlineDt = line.match(/(\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}|\d{1,2}[\/\-]\d{1,2})/);
            if (inlineDt) foundDate = normalizeDate(inlineDt[1]);
          }

          if (foundAmount && foundAmount > 0) {
            const title = textCandidates.join(' ').trim() || '明細利用';
            rawResults.push({
              id: `stmt_${Date.now()}_${idx}`,
              date: foundDate || defaultDateStr,
              title,
              amount: foundAmount
            });
          }
        });
      }

      const seenInBatch = [];
      return rawResults.map(item => {
        const dupInHistory = checkDuplicateEvent(item, existingEvents);
        const dupInBatch = seenInBatch.find(b => b.date === item.date && b.amount === item.amount && b.title === item.title);
        seenInBatch.push(item);

        const isDuplicate = Boolean(dupInHistory || dupInBatch);
        const duplicateReason = dupInHistory
          ? `登録済「${dupInHistory.title}」と重複の可能性`
          : dupInBatch
          ? '貼り付けデータ内で重複'
          : '';

        return {
          ...item,
          isDuplicate,
          duplicateReason,
          selected: !isDuplicate
        };
      });
    };

    const downloadICS = (ev) => {
      const startClean = ev.date.replace(/-/g, '');
      const endClean = (ev.endDate || ev.date).replace(/-/g, '');
      let dtStartLine = '';
      let dtEndLine = '';

      if (ev.isAllDay) {
        const nextDayAfterEnd = shiftDateStr(ev.endDate || ev.date, 1).replace(/-/g, '');
        dtStartLine = `DTSTART;VALUE=DATE:${startClean}`;
        dtEndLine = `DTEND;VALUE=DATE:${nextDayAfterEnd}`;
      } else {
        const sTime = (ev.startTime || '09:00').replace(':', '') + '00';
        const eTime = (ev.endTime || '10:00').replace(':', '') + '00';
        dtStartLine = `DTSTART:${startClean}T${sTime}`;
        dtEndLine = `DTEND:${endClean}T${eTime}`;
      }

      const descParts = [];
      if (ev.amount > 0) descParts.push(`金額: ${ev.isExpense ? '-' : '+'}${ev.amount.toLocaleString()}円`);
      if (ev.memo) descParts.push(ev.memo);
      const desc = descParts.join(' / ');
      const crlf = String.fromCharCode(13, 10);

      const icsContent = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//ScheduleKakeibo//JP',
        'BEGIN:VEVENT',
        `UID:${ev.id}@schedule-kakeibo`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
        dtStartLine,
        dtEndLine,
        `SUMMARY:${ev.title}`,
        `DESCRIPTION:${desc}`,
        'END:VEVENT',
        'END:VCALENDAR'
      ].join(crlf);

      const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${ev.title}.ics`;
      a.click();
      URL.revokeObjectURL(url);
    };

    function CategoryDonutChart({ breakdown, totalExpense }) {
      if (totalExpense <= 0 || breakdown.length === 0) {
        return (
          <div className="text-center py-6 text-xs text-slate-400 bg-stone-50 rounded-xl border border-stone-200/60">
            当月の支出データが登録されるとカテゴリ別グラフが表示されます
          </div>
        );
      }

      const size = 132;
      const strokeWidth = 22;
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      let cumulativePercent = 0;

      return (
        <div className="flex items-center space-x-4 pt-1">
          <div className="relative flex-shrink-0" style={{ width: size, height: size }}>
            <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="-rotate-90">
              <circle
                cx={size / 2}
                cy={size / 2}
                r={radius}
                fill="transparent"
                stroke="#F5F5F4"
                strokeWidth={strokeWidth}
              />
              {breakdown.map((item) => {
                const percent = item.amount / totalExpense;
                const dashLength = percent * circumference;
                const dashOffset = -cumulativePercent * circumference;
                cumulativePercent += percent;
                return (
                  <circle
                    key={item.name}
                    cx={size / 2}
                    cy={size / 2}
                    r={radius}
                    fill="transparent"
                    stroke={item.color}
                    strokeWidth={strokeWidth}
                    strokeDasharray={`${dashLength} ${circumference}`}
                    strokeDashoffset={dashOffset}
                    strokeLinecap="butt"
                  />
                );
              })}
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
              <span className="text-[9px] text-slate-400 font-bold">支出合計</span>
              <span className="text-xs font-bold text-slate-800">{totalExpense.toLocaleString()}円</span>
            </div>
          </div>

          <div className="flex-1 space-y-2">
            {breakdown.map(item => (
              <div key={item.name} className="space-y-0.5">
                <div className="flex justify-between items-center text-[11px]">
                  <div className="flex items-center space-x-1.5">
                    <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: item.color }} />
                    <span className="font-bold text-slate-700 truncate max-w-[90px]">{item.name}</span>
                  </div>
                  <div className="text-right">
                    <span className="font-bold text-slate-800">{item.amount.toLocaleString()}円</span>
                    <span className="text-[9px] text-slate-400 ml-1">({item.percent}%)</span>
                  </div>
                </div>
                <div className="w-full h-1.5 bg-stone-100 rounded-full overflow-hidden">
                  <div
                    className="h-full rounded-full transition-all duration-300"
                    style={{ width: `${item.percent}%`, backgroundColor: item.color }}
                  />
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const todayStr = new Date().toISOString().split('T')[0];
      const [currentDate, setCurrentDate] = useState(new Date());
      const [viewMode, setViewMode] = useState('month');
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [financeFilter, setFinanceFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      const touchStartX = useRef(null);
      const touchStartY = useRef(null);

      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [isStandalone, setIsStandalone] = useState(false);

      const [sharedEvents, setSharedEvents] = useState(null);
      const [isImportModalOpen, setIsImportModalOpen] = useState(false);
      const [selectedImportIds, setSelectedImportIds] = useState([]);
      const [importCustomColor, setImportCustomColor] = useState('#3E7B67');
      const [importBadgeLabel, setImportBadgeLabel] = useState('共有');
      const [importIncludeMoney, setImportIncludeMoney] = useState(false);

      const [isStatementModalOpen, setIsStatementModalOpen] = useState(false);
      const [statementRawText, setStatementRawText] = useState('');
      const [parsedStatements, setParsedStatements] = useState([]);
      const [statementMethodLabel, setStatementMethodLabel] = useState('クレカ');

      const [isQuickMenuOpen, setIsQuickMenuOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState('');

      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [shareOptions, setShareOptions] = useState({
        scope: 'month',
        hideMoney: true,
        hideMemo: true,
        maskTitle: false
      });
      const [generatedShareUrl, setGeneratedShareUrl] = useState('');

      const [baseBalance, setBaseBalance] = useState(() => {
        const saved = localStorage.getItem('app_base_balance');
        return saved !== null ? Number(saved) : 0;
      });

      const [monthlyBudget, setMonthlyBudget] = useState(() => {
        const saved = localStorage.getItem('app_monthly_budget');
        return saved !== null ? Number(saved) : 50000;
      });

      const [templates, setTemplates] = useState(() => {
        const saved = localStorage.getItem('app_templates_v1');
        return saved ? JSON.parse(saved) : DEFAULT_TEMPLATES;
      });

      const [newTemplate, setNewTemplate] = useState({
        title: '', amount: 500, isExpense: true, color: '#C28540', memo: ''
      });

      const [jobs, setJobs] = useState(() => {
        const saved = localStorage.getItem('app_jobs_v4');
        return saved ? JSON.parse(saved) : [];
      });

      const [myEvents, setMyEvents] = useState(() => {
        const saved = localStorage.getItem('app_events_v4');
        return saved ? JSON.parse(saved) : [];
      });

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [subItemInput, setSubItemInput] = useState({ name: '', price: '' });
      const [repeatOption, setRepeatOption] = useState('none');
      
      const [newEvent, setNewEvent] = useState({
        title: '', date: todayStr, endDate: todayStr, isAllDay: false,
        startTime: '09:00', endTime: '17:00', color: '#476C9B',
        amount: 0, isExpense: true, isShift: false, jobId: '',
        subItems: [], memo: '', completed: false
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => {
          setToastMessage(prev => (prev === msg ? '' : prev));
        }, 4000);
      };

      useEffect(() => {
        const standaloneCheck = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        setIsStandalone(standaloneCheck);

        const handleBeforeInstall = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstall);
        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
      }, []);

      const handleInstallPWA = async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          setDeferredPrompt(null);
          showToast('ホーム画面にアプリを追加しました！');
        }
      };

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);

        const shareParam = params.get('s');
        if (shareParam) {
          const decoded = decodeShareData(shareParam);
          if (decoded && Array.isArray(decoded.events)) {
            setSharedEvents(decoded.events);
            setSelectedImportIds(decoded.events.map(ev => ev.id));
            if (decoded.targetDate) {
              setCurrentDate(new Date(decoded.targetDate));
              setSelectedDate(decoded.targetDate);
            }
          }
          return;
        }

        const addExpenseParam = params.get('add_expense') || params.get('amount');
        const titleParam = params.get('title') || params.get('merchant');
        const dateParam = params.get('date') || todayStr;
        const methodParam = params.get('method') || '';
        const autoSaveParam = params.get('auto');

        if (addExpenseParam !== null || titleParam !== null) {
          const cleanAmount = addExpenseParam ? Math.abs(Number(String(addExpenseParam).replace(/[^0-9.-]/g, ''))) : 0;

      const calculateShiftDetails = (startTime, endTime, job) => {
        if (!startTime || !endTime || !job) return { pay: 0, workHours: 0, nightHours: 0, breakMins: 0, transport: 0 };
        const [startH, startM] = startTime.split(':').map(Number);
        const [endH, endM] = endTime.split(':').map(Number);
        let startMins = startH * 60 + startM;
        let endMins = endH * 60 + endM;
        if (endMins <= startMins) endMins += 24 * 60;

        const totalMins = endMins - startMins;
        const totalHours = totalMins / 60;

        let nightMins = 0;
        if (job.nightBonus) {
          const overlap = (a1, a2, b1, b2) => Math.max(0, Math.min(a2, b2) - Math.max(a1, b1));
          nightMins += overlap(startMins, endMins, 0, 5 * 60);
          nightMins += overlap(startMins, endMins, 22 * 60, 29 * 60);
        }

        let breakMins = 0;
        if (job.autoBreak) {
          if (totalHours > 8) breakMins = 60;
          else if (totalHours > 6) breakMins = 45;
        }

        const effectiveTotalMins = Math.max(0, totalMins - breakMins);
        const effectiveNightMins = Math.min(nightMins, effectiveTotalMins);
        const effectiveNormalMins = effectiveTotalMins - effectiveNightMins;

        const normalPay = (effectiveNormalMins / 60) * job.hourlyWage;
        const nightPay = (effectiveNightMins / 60) * job.hourlyWage * 1.25;
        const wagePay = Math.round(normalPay + nightPay);
        const transport = Number(job.transportFee || 0);

        return {
          pay: wagePay + transport,
          wagePay,
          workHours: Math.round((effectiveTotalMins / 60) * 100) / 100,
          nightHours: Math.round((effectiveNightMins / 60) * 100) / 100,
          breakMins,
          transport
        };
      };

      const getDaysInMonth = (date) => {

        const days = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();

      };

      const monthData = getDaysInMonth(currentDate);
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;

      const monthlyFinanceEvents = events.filter(ev => {
        const evDate = new Date(ev.date);
        return evDate.getFullYear() === year && evDate.getMonth() + 1 === month;
      }).sort((a, b) => a.date.localeCompare(b.date) || (a.isAllDay ? -1 : 1) || a.startTime.localeCompare(b.startTime));

      // 表示中の月（year年month月）の集計：
      // - earnedThisMonth: 今月働いて稼いだ金額（振込は翌月）
      // - paydayThisMonth: 今月口座に振り込まれる先月分の給料
      // - expenseThisMonth: 今月使った（使う予定の）支出
      const monthlyStats = monthlyFinanceEvents.reduce((acc, ev) => {
        if (ev.isExpense) {
          acc.expense += ev.amount;
          if (ev.completed) acc.confirmedExpense += ev.amount;
        } else if (ev.isShift) {
          acc.earnedThisMonth += ev.amount;
        } else {
          // 翌月給料日イベントや臨時収入（実際に当月口座に入るお金）
          acc.cashInflow += ev.amount;
          if (ev.isAutoPayday) acc.paydayThisMonth += ev.amount;
          if (ev.completed) acc.confirmedCashInflow += ev.amount;
        }
        return acc;
      }, {
        earnedThisMonth: 0,
        paydayThisMonth: 0,
        cashInflow: 0,
        confirmedCashInflow: 0,
        expense: 0,
        confirmedExpense: 0
      });

      // 口座内金額（現在の実残高）計算：
      // バイトシフト自体は勤務日には口座に入らず、自動生成された「翌月給料日(isAutoPayday)」がtodayStr以前になった時点で口座に反映
      const accountStats = useMemo(() => {
        let confirmedNet = 0;
        let projectedNet = 0;

        myEvents.forEach(ev => {
          if (ev.isShift) return; // シフトは給料日イベント側で口座反映するため除外
          const diff = ev.isExpense ? -ev.amount : ev.amount;
          if (ev.completed) confirmedNet += diff;
          projectedNet += diff;
        });

        autoPaydayEvents.forEach(pd => {
          if (pd.date <= todayStr) confirmedNet += pd.amount;
          projectedNet += pd.amount;
        });

        return {
          currentAccountBalance: baseBalance + confirmedNet,
          projectedAccountBalance: baseBalance + projectedNet
        };
      }, [myEvents, autoPaydayEvents, baseBalance, todayStr]);

      // カテゴリ別支出集計
      const categoryExpenseBreakdown = (() => {
        const map = {};
        monthlyFinanceEvents.forEach(ev => {
          if (!ev.isExpense || ev.amount <= 0) return;
          const catName = getCategoryNameByColor(ev.color);
          if (!map[catName]) {
            const matched = COLOR_PALETTE.find(c => c.name === catName);
            map[catName] = { name: catName, color: matched ? matched.color : '#64748B', amount: 0 };
          }
          map[catName].amount += ev.amount;
        });
        const list = Object.values(map).sort((a, b) => b.amount - a.amount);
        return list.map(item => ({
          ...item,
          percent: monthlyStats.expense > 0 ? Math.round((item.amount / monthlyStats.expense) * 100) : 0
        }));
      })();

      // 今月使える金額（今月の予算残高）
      const usableRemainingThisMonth = monthlyBudget - monthlyStats.expense;

      const isOverBudget = monthlyBudget > 0 && monthlyStats.expense > monthlyBudget;
      const isNearBudget = monthlyBudget > 0 && !isOverBudget && budgetPercent >= 80;

        const jobShifts = monthlyFinanceEvents.filter(ev => ev.isShift && (ev.shiftMeta?.jobId === job.id || ev.jobId === job.id));
        const totalPay = jobShifts.reduce((sum, ev) => sum + ev.amount, 0);
        const totalHours = jobShifts.reduce((sum, ev) => sum + (ev.shiftMeta?.workHours || 0), 0);
        const paydayStr = getNextMonthPayDate(year, month, job.payDay || 25);
        return { ...job, count: jobShifts.length, totalPay, totalHours: Math.round(totalHours * 10) / 10, paydayStr };

        if (financeFilter === 'expense') return ev.isExpense;
        return true;

                  ) : (

          )}

          {/* 予定・収支 登録＆編集モーダル */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center">
              <div className="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-center border-b border-stone-100 pb-2.5">
                  <h3 className="font-bold text-slate-800">
                    {editingId ? '予定・収支の編集' : '予定・収支の追加'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
                </div>

                {!editingId && templates.length > 0 && (
                  <div className="space-y-1">
                    <div className="text-[10px] font-bold text-slate-400">⚡ 定型文から入力をセット:</div>
                    <div className="flex space-x-1.5 overflow-x-auto no-scrollbar pb-1">
                      {templates.map(tpl => (
                        <button
                          key={tpl.id}
                          type="button"
                          onClick={() => applyTemplateToForm(tpl)}
                          className="px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-slate-200 text-slate-700 text-[10px] font-bold whitespace-nowrap flex items-center space-x-1 border border-stone-200/70"
                        >
                          <span className="w-2 h-2 rounded-full" style={{ backgroundColor: tpl.color }} />
                          <span>{tpl.title} ({tpl.amount}円)</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                <form onSubmit={handleSaveEvent} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-500 mb-1">開始日</label>
                      <input
                        type="date"
                        value={newEvent.date}
                        onChange={e => {
                          const nextStart = e.target.value;
                          const nextEnd = !newEvent.endDate || newEvent.endDate < nextStart ? nextStart : newEvent.endDate;
                          setNewEvent({ ...newEvent, date: nextStart, endDate: nextEnd });
                        }}
                        className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-slate-500 mb-1">終了日（日またぎ可）</label>
                      <input
                        type="date"
                        value={newEvent.endDate || newEvent.date}
                        min={newEvent.date}
                        onChange={e => setNewEvent({ ...newEvent, endDate: e.target.value })}
                        className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50"
                        required
                      />
                    </div>
                  </div>

                  {!editingId && (
                    <div>
                      <label className="block text-slate-500 mb-1">繰り返し一括登録</label>
                      <select value={repeatOption} onChange={e => setRepeatOption(e.target.value)} className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50">
                        <option value="none">今回のみ（1回）</option>
                        <option value="weekly_4">毎週（4週間分）</option>
                        <option value="monthly_3">毎月（3ヶ月分）</option>
                      </select>
                    </div>
                  )}

                  <div className="flex items-center space-x-2 bg-stone-100/80 p-2.5 rounded-xl border border-stone-200/70">
                    <input
                      type="checkbox"
                      id="isShift"
                      className="accent-slate-800"
                      checked={newEvent.isShift}
                      onChange={e => setNewEvent({ ...newEvent, isShift: e.target.checked, isAllDay: false })}
                    />
                    <label htmlFor="isShift" className="font-bold text-slate-800 cursor-pointer">アルバイトのシフトとして登録（翌月給料日に自動反映）</label>
                  </div>

                  {newEvent.isShift ? (
                    jobs.length === 0 ? (
                      <div className="bg-amber-50/80 border border-amber-200 p-3 rounded-xl text-amber-900 space-y-2">
                        <div>勤務先がまだ登録されていません。先に設定タブから勤務先（時給・振込日）を登録してください。</div>
                        <button
                          type="button"
                          onClick={() => { setIsModalOpen(false); setViewMode('settings'); }}
                          className="bg-amber-700 text-white px-3 py-1.5 rounded-lg font-bold"
                        >
                          設定画面へ移動する
                        </button>
                      </div>
                    ) : (
                      <div>
                        <label className="block text-slate-500 mb-1">勤務先を選択</label>
                        <select value={newEvent.jobId} onChange={e => setNewEvent({ ...newEvent, jobId: e.target.value })} className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50" required>
                          <option value="">選択してください</option>
                          {jobs.map(j => (
                            <option key={j.id} value={j.id}>
                              {j.name} （時給:{j.hourlyWage}円 / 翌月{j.payDay === 31 ? '末日' : `${j.payDay || 25}日`}払）
                            </option>
                          ))}
                        </select>
                      </div>
                    )
                  ) : (
                    <>
                      <div>
                        <label className="block text-slate-500 mb-1">タイトル</label>
                        <input type="text" placeholder="例：大学講義、1泊2日旅行、家賃引き落とし" value={newEvent.title} onChange={e => setNewEvent({ ...newEvent, title: e.target.value })} className="w-full p-2.5 border border-stone-200 rounded-xl bg-stone-50" required />
                      </div>

                      <div>
                        <label className="block text-slate-500 mb-1">カテゴリ色分け（収支グラフに自動連動）</label>
                        <div className="flex space-x-1.5 overflow-x-auto no-scrollbar py-1">
                          {COLOR_PALETTE.map(c => (
                            <button
                              type="button"
                              key={c.color}
                              onClick={() => setNewEvent({ ...newEvent, color: c.color })}
                              className={`px-2.5 py-1 rounded-lg text-[10px] font-bold text-white whitespace-nowrap flex items-center space-x-1 transition ${newEvent.color === c.color ? 'ring-2 ring-offset-1 ring-slate-700' : 'opacity-70 hover:opacity-100'}`}
                              style={{ backgroundColor: c.color }}
                            >
                              <span>{c.name}</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    </>
                  )}

                  {!newEvent.isShift && (
                    <div className="flex items-center space-x-2">
                      <input
                        type="checkbox"
                        id="isAllDay"
                        className="accent-slate-800"
                        checked={newEvent.isAllDay}
                        onChange={e => setNewEvent({ ...newEvent, isAllDay: e.target.checked })}
                      />
                      <label htmlFor="isAllDay" className="text-slate-700 font-bold cursor-pointer">終日（時間指定なし）</label>
                    </div>
                  )}

                  {!newEvent.isAllDay && (
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-slate-500 mb-1">開始時間</label>
                        <input type="time" value={newEvent.startTime} onChange={e => setNewEvent({ ...newEvent, startTime: e.target.value })} className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50" />
                      </div>
                      <div>
                        <label className="block text-slate-500 mb-1">終了時間</label>
                        <input type="time" value={newEvent.endTime} onChange={e => setNewEvent({ ...newEvent, endTime: e.target.value })} className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50" />
                      </div>
                    </div>
                  )}

                  {!newEvent.isShift && (
                    <div className="space-y-2 border-t border-stone-100 pt-2.5">
                      <div className="flex items-center justify-between">
                        <label className="text-slate-600 font-bold">金額・予算試算</label>
                        <div className="flex space-x-3">
                          <label className="flex items-center space-x-1 cursor-pointer">
                            <input type="radio" name="exp" className="accent-rose-600" checked={newEvent.isExpense} onChange={() => setNewEvent({ ...newEvent, isExpense: true })} />
                            <span className="text-rose-600 font-bold">支出</span>
                          </label>
                          <label className="flex items-center space-x-1 cursor-pointer">
                            <input type="radio" name="exp" className="accent-emerald-700" checked={!newEvent.isExpense} onChange={() => setNewEvent({ ...newEvent, isExpense: false })} />
                            <span className="text-emerald-700 font-bold">収入</span>
                          </label>
                        </div>
                      </div>
                      <input type="number" placeholder="合計金額（0で金額なし）" value={newEvent.amount || ''} onChange={e => setNewEvent({ ...newEvent, amount: Number(e.target.value) })} className="w-full p-2.5 border border-stone-200 rounded-xl font-bold bg-stone-50" />

                      <div className="bg-stone-50 p-2.5 rounded-xl border border-stone-200/70 space-y-2">
                        <div className="text-[10px] font-bold text-slate-500">内訳を追加して自動合計する（任意）</div>
                        <div className="flex space-x-1.5">
                          <input type="text" placeholder="項目（例：交通費）" value={subItemInput.name} onChange={e => setSubItemInput({ ...subItemInput, name: e.target.value })} className="flex-1 p-1.5 border border-stone-200 rounded-lg bg-white" />
                          <input type="number" placeholder="金額" value={subItemInput.price} onChange={e => setSubItemInput({ ...subItemInput, price: e.target.value })} className="w-20 p-1.5 border border-stone-200 rounded-lg bg-white" />
                          <button type="button" onClick={handleAddSubItem} className="bg-slate-700 text-white px-3 rounded-lg font-bold">追加</button>
                        </div>
                        {newEvent.subItems.length > 0 && (
                          <div className="space-y-1 pt-1">
                            {newEvent.subItems.map(sub => (
                              <div key={sub.id} className="flex justify-between items-center text-[11px] bg-white px-2.5 py-1 rounded-lg border border-stone-200/70">
                                <span>{sub.name}</span>
                                <div className="flex items-center space-x-2">
                                  <span className="font-bold">{sub.price.toLocaleString()}円</span>
                                  <button type="button" onClick={() => handleRemoveSubItem(sub.id)} className="text-rose-500">✕</button>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block text-slate-500 mb-1">メモ・持ち物リスト</label>
                    <textarea placeholder="メモを残せます" value={newEvent.memo} onChange={e => setNewEvent({ ...newEvent, memo: e.target.value })} className="w-full p-2.5 border border-stone-200 rounded-xl h-14 bg-stone-50" />
                  </div>

                  <button type="submit" className="w-full bg-slate-800 hover:bg-slate-700 text-white p-3 rounded-xl font-bold text-sm transition">
                    {editingId ? '変更を保存する' : '登録する'}
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
