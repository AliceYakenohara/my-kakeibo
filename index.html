<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>スマート予定＆家計簿カレンダー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #F5F5F4;
      color: #1E293B;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      overscroll-behavior-y: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    body.dark-mode {
      background-color: #020617;
      color: #F1F5F9;
    }
    .dark-theme .bg-white {
      background-color: #0F172A !important;
    }
    .dark-theme .bg-white\/95 {
      background-color: rgba(15, 23, 42, 0.95) !important;
    }
    .dark-theme .bg-stone-50,
    .dark-theme .bg-stone-50\/40,
    .dark-theme .bg-stone-50\/70 {
      background-color: #1E293B !important;
    }
    .dark-theme .bg-stone-100 {
      background-color: #334155 !important;
    }
    .dark-theme .border-stone-100,
    .dark-theme .border-stone-200,
    .dark-theme .border-stone-200\/60,
    .dark-theme .border-stone-200\/70,
    .dark-theme .border-stone-200\/80 {
      border-color: #334155 !important;
    }
    .dark-theme .text-slate-800,
    .dark-theme .text-slate-900 {
      color: #F1F5F9 !important;
    }
    .dark-theme .text-slate-700,
    .dark-theme .text-slate-600 {
      color: #CBD5E1 !important;
    }
    .dark-theme .text-slate-500,
    .dark-theme .text-slate-400 {
      color: #94A3B8 !important;
    }
    .dark-theme input,
    .dark-theme select,
    .dark-theme textarea {
      color: #F1F5F9;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes slideInFromRight {
      0% { opacity: 0.25; transform: translateX(36px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInFromLeft {
      0% { opacity: 0.25; transform: translateX(-36px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    .animate-slide-next {
      animation: slideInFromRight 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .animate-slide-prev {
      animation: slideInFromLeft 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const COLOR_PALETTE = [
      { name: '食費・カフェ', color: '#C28540' },
      { name: '日用品・買物', color: '#3E7B67' },
      { name: '交通・バイク', color: '#3B6E8C' },
      { name: '交際・趣味', color: '#9E5874' },
      { name: '固定費・学業', color: '#5B6270' },
      { name: '収入・バイト', color: '#2E7D5B' },
    ];

    const IMPORT_COLOR_PRESETS = [
      { name: '元の色', color: 'ORIGINAL' },
      { name: 'セージ', color: '#3E7B67' },
      { name: 'ローズ', color: '#B85D6F' },
      { name: 'ブルー', color: '#3B6E8C' },
      { name: 'アンバー', color: '#C28540' },
    ];

    const REMINDER_OPTIONS = [
      { value: 'none', label: '通知なし' },
      { value: '0', label: '開始時刻' },
      { value: '10', label: '10分前' },
      { value: '30', label: '30分前' },
      { value: '60', label: '1時間前' },
      { value: '1440', label: '1日前' },
    ];

    const WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

    const formatDateStr = (dateObj) => {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const addDaysStr = (dateStr, days) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + days);
      return formatDateStr(dt);
    };

    const diffDays = (startStr, endStr) => {
      const [sy, sm, sd] = startStr.split('-').map(Number);
      const [ey, em, ed] = endStr.split('-').map(Number);
      const s = new Date(sy, sm - 1, sd);
      const e = new Date(ey, em - 1, ed);
      return Math.round((e - s) / (1000 * 60 * 60 * 24));
    };

    const getWeekDates = (baseDateStr) => {
      const [y, m, d] = baseDateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const dayOfWeek = dt.getDay();
      const sunday = new Date(y, m - 1, d - dayOfWeek);
      return Array.from({ length: 7 }, (_, i) => {
        const cur = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate() + i);
        return formatDateStr(cur);
      });
    };

    const getPaydayDateStr = (year, monthIndex0, payDay) => {
      let targetYear = year;
      let targetMonth = monthIndex0 + 1;
      if (targetMonth > 11) {
        targetMonth = 0;
        targetYear += 1;
      }
      const lastDay = new Date(targetYear, targetMonth + 1, 0).getDate();
      const actualDay = payDay === 31 ? lastDay : Math.min(payDay || 25, lastDay);
      return `${targetYear}-${String(targetMonth + 1).padStart(2, '0')}-${String(actualDay).padStart(2, '0')}`;
    };

    const calculateShiftDetails = (startTime, endTime, job) => {
      if (!startTime || !endTime || !job) return null;
      const [sh, sm] = startTime.split(':').map(Number);
      const [eh, em] = endTime.split(':').map(Number);
      let startMins = sh * 60 + sm;
      let endMins = eh * 60 + em;
      if (endMins <= startMins) endMins += 24 * 60;

      const totalMins = endMins - startMins;
      let breakMins = 0;
      if (job.autoBreak) {
        if (totalMins > 480) breakMins = 60;
        else if (totalMins > 360) breakMins = 45;
      }

      let nightMins = 0;
      if (job.nightBonus !== false) {
        for (let m = startMins; m < endMins; m++) {
          const mod = m % 1440;
          if (mod >= 1320 || mod < 300) nightMins++;
        }
      }

      const ratio = totalMins > 0 ? (totalMins - breakMins) / totalMins : 0;
      const effectiveTotalMins = totalMins - breakMins;
      const effectiveNightMins = Math.round(nightMins * ratio);
      const effectiveDayMins = Math.max(0, effectiveTotalMins - effectiveNightMins);

      const hourly = Number(job.hourlyWage) || 0;
      const transport = Number(job.transportFee) || 0;
      const basePay = (effectiveDayMins / 60) * hourly + (effectiveNightMins / 60) * hourly * 1.25;
      const pay = Math.round(basePay + transport);

      return {
        workHours: Number((effectiveTotalMins / 60).toFixed(2)),
        nightHours: Number((effectiveNightMins / 60).toFixed(2)),
        breakMins,
        transport,
        pay,
      };
    };

    const getCategoryNameByColor = (color) => {
      const found = COLOR_PALETTE.find(c => c.color.toLowerCase() === (color || '').toLowerCase());
      return found ? found.name : 'その他';
    };

    const parseCsvLine = (line) => {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    };

    function CategoryDonutChart({ breakdown, totalExpense, darkMode }) {
      if (totalExpense <= 0 || breakdown.length === 0) {
        return <div className="text-center py-6 text-xs text-slate-400">今月の支出データはまだありません</div>;
      }
      let cumulativePercent = 0;
      const gradientParts = breakdown.map(item => {
        const start = cumulativePercent;
        const pct = (item.amount / totalExpense) * 100;
        cumulativePercent += pct;
        return `${item.color} ${start.toFixed(1)}% ${cumulativePercent.toFixed(1)}%`;
      });

      return (
        <div className="flex items-center space-x-4 pt-1">
          <div
            className="w-24 h-24 rounded-full flex items-center justify-center shrink-0 relative shadow-inner"
            style={{ background: `conic-gradient(${gradientParts.join(', ')})` }}
          >
            <div className={`w-14 h-14 rounded-full flex flex-col items-center justify-center ${darkMode ? 'bg-slate-900' : 'bg-white'}`}>
              <span className="text-[9px] text-slate-400">支出合計</span>
              <span className="text-[11px] font-bold text-slate-800">{Math.round(totalExpense / 1000)}k</span>
            </div>
          </div>
          <div className="flex-1 space-y-1.5 text-xs">
            {breakdown.map(item => (
              <div key={item.name} className="flex justify-between items-center">
                <div className="flex items-center space-x-1.5">
                  <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: item.color }} />
                  <span className="text-slate-700 font-medium truncate max-w-[95px]">{item.name}</span>
                </div>
                <div className="text-right">
                  <span className="font-bold text-slate-800">{item.amount.toLocaleString()}円</span>
                  <span className="text-[10px] text-slate-400 ml-1">({Math.round((item.amount / totalExpense) * 100)}%)</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const todayStr = formatDateStr(new Date());

      const [viewMode, setViewMode] = useState('month'); // 'month' | 'week' | 'day' | 'finance' | 'search' | 'settings'
      const [currentDate, setCurrentDate] = useState(() => new Date());
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [slideAnimClass, setSlideAnimClass] = useState('');
      const [slideKey, setSlideKey] = useState(0);
      const [highlightBudgetCard, setHighlightBudgetCard] = useState(false);

      // ダークモード状態
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('cal_dark_v3') === 'true');

      const [events, setEvents] = useState(() => {
        try { return JSON.parse(localStorage.getItem('cal_events_v3')) || []; } catch { return []; }
      });
      const [jobs, setJobs] = useState(() => {
        try { return JSON.parse(localStorage.getItem('cal_jobs_v3')) || []; } catch { return []; }
      });
      const [monthlyBudget, setMonthlyBudget] = useState(() => {
        return Number(localStorage.getItem('cal_budget_v3')) || 50000;
      });
      // カテゴリ別予算上限 { [colorHex]: number }
      const [categoryBudgets, setCategoryBudgets] = useState(() => {
        try { return JSON.parse(localStorage.getItem('cal_cat_budgets_v3')) || {}; } catch { return {}; }
      });
      const [baseBalance, setBaseBalance] = useState(() => {
        return Number(localStorage.getItem('cal_base_balance_v3')) || 0;
      });
      // 実際の振込額照合記録 { [paydayKey]: number }
      const [paydayActuals, setPaydayActuals] = useState(() => {
        try { return JSON.parse(localStorage.getItem('cal_payday_actuals_v3')) || {}; } catch { return {}; }
      });
      // 年収の壁ターゲット設定（デフォルト103万円、130万円も並記表示）
      const [incomeWallTarget, setIncomeWallTarget] = useState(() => {
        return Number(localStorage.getItem('cal_income_wall_v3')) || 1030000;
      });

      const [templates, setTemplates] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('cal_templates_v3')) || [
            { id: 'tpl1', title: 'ランチ・学食', amount: 650, color: '#C28540', isExpense: true },
            { id: 'tpl2', title: 'コンビニ・カフェ', amount: 400, color: '#C28540', isExpense: true },
            { id: 'tpl3', title: '電車・バス代', amount: 440, color: '#3B6E8C', isExpense: true },
          ];
        } catch { return []; }
      });

      // シフト履歴の非表示（削除）・ピン固定状態
      const [hiddenShiftKeys, setHiddenShiftKeys] = useState(() => {
        try { return JSON.parse(localStorage.getItem('cal_hidden_shifts_v3')) || []; } catch { return []; }
      });
      const [pinnedShiftKeys, setPinnedShiftKeys] = useState(() => {
        try { return JSON.parse(localStorage.getItem('cal_pinned_shifts_v3')) || []; } catch { return []; }
      });

      // 生理周期オプション状態（ローカル専用・共有対象から完全除外）
      const [cycleConfig, setCycleConfig] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('cal_cycle_cfg_v3')) || {
            enabled: false,
            avgCycleDays: 28,
            avgPeriodDays: 5,
          };
        } catch {
          return { enabled: false, avgCycleDays: 28, avgPeriodDays: 5 };
        }
      });
      const [cycleLogs, setCycleLogs] = useState(() => {
        try { return JSON.parse(localStorage.getItem('cal_cycle_logs_v3')) || []; } catch { return []; }
      });
      const [cycleNoteInput, setCycleNoteInput] = useState('');

      // 通知権限と発火済み記録
      const [notifPermission, setNotifPermission] = useState(() => {
        return typeof Notification !== 'undefined' ? Notification.permission : 'denied';
      });
      const notifiedIdsRef = useRef(new Set());

      // 削除確認 & Undo 履歴
      const [deleteConfirmTarget, setDeleteConfirmTarget] = useState(null); // { ev, hasSeries }
      const [undoStack, setUndoStack] = useState([]); // [{ items: [], label: string }]

      // モーダル・UI状態
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [modalTab, setModalTab] = useState('schedule'); // 'schedule' | 'finance' | 'shift'
      const [editingId, setEditingId] = useState(null);
      const [editScope, setEditScope] = useState('single'); // 'single' | 'series'
      const [repeatOption, setRepeatOption] = useState('none');
      const [selectedWeekdays, setSelectedWeekdays] = useState([1, 3, 5]);
      const [bulkTargetMonth, setBulkTargetMonth] = useState('current');
      const [showScheduleAmount, setShowScheduleAmount] = useState(false);
      const [showSubItemsPanel, setShowSubItemsPanel] = useState(false);

      const [newEvent, setNewEvent] = useState({
        title: '',
        date: todayStr,
        endDate: todayStr,
        isAllDay: false,
        startTime: '10:00',
        endTime: '12:00',
        color: '#3E7B67',
        amount: 0,
        isExpense: true,
        isShift: false,
        isFixedCost: false,
        jobId: '',
        memo: '',
        subItems: [],
        reminder: 'none',
        isPinned: false,
        seriesId: null,
      });
      const [subItemInput, setSubItemInput] = useState({ name: '', price: '' });

      // 勤務先追加フォーム
      const [newJob, setNewJob] = useState({
        name: '',
        hourlyWage: 1200,
        transportFee: 0,
        payDay: 25,
        autoBreak: true,
        nightBonus: true,
        color: '#2E7D5B',
      });

      // 定型文追加フォーム
      const [newTemplate, setNewTemplate] = useState({
        title: '',
        amount: 0,
        color: '#C28540',
        isExpense: true,
      });
      const [isQuickMenuOpen, setIsQuickMenuOpen] = useState(false);

      // 収支フィルター & 検索
      const [financeFilter, setFinanceFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      // 明細貼付モーダル
      const [isStatementModalOpen, setIsStatementModalOpen] = useState(false);
      const [statementRawText, setStatementRawText] = useState('');
      const [statementMethodLabel, setStatementMethodLabel] = useState('クレカ');
      const [parsedStatements, setParsedStatements] = useState([]);

      // 共有リンク作成＆取り込み
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [shareOptions, setShareOptions] = useState({ scope: 'month', hideMoney: true, hideMemo: true, maskTitle: false });
      const [generatedShareUrl, setGeneratedShareUrl] = useState('');
      const [sharedEvents, setSharedEvents] = useState(null);
      const [isViewingShared, setIsViewingShared] = useState(false);
      const [isImportModalOpen, setIsImportModalOpen] = useState(false);
      const [selectedImportIds, setSelectedImportIds] = useState([]);
      const [importCustomColor, setImportCustomColor] = useState('#3E7B67');
      const [importBadgeLabel, setImportBadgeLabel] = useState('共有');
      const [importIncludeMoney, setImportIncludeMoney] = useState(false);

      // CSV & バックアップ & PWA
      const [backupText, setBackupText] = useState('');
      const [csvImportPreview, setCsvImportPreview] = useState([]);
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [isStandalone, setIsStandalone] = useState(false);
      const [toastState, setToastState] = useState({ msg: '', canUndo: false });
      const toastTimerRef = useRef(null);

      // スワイプ検知用
      const touchStartRef = useRef({ x: 0, y: 0 });

      const showToast = (msg, canUndo = false) => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setToastState({ msg, canUndo });
        toastTimerRef.current = setTimeout(() => {
          setToastState({ msg: '', canUndo: false });
        }, canUndo ? 5000 : 2800);
      };

      // ダークモード反映
      useEffect(() => {
        localStorage.setItem('cal_dark_v3', String(darkMode));
        if (darkMode) document.body.classList.add('dark-mode');
        else document.body.classList.remove('dark-mode');
      }, [darkMode]);

      // LocalStorage保存
      useEffect(() => { localStorage.setItem('cal_events_v3', JSON.stringify(events)); }, [events]);
      useEffect(() => { localStorage.setItem('cal_jobs_v3', JSON.stringify(jobs)); }, [jobs]);
      useEffect(() => { localStorage.setItem('cal_budget_v3', String(monthlyBudget)); }, [monthlyBudget]);
      useEffect(() => { localStorage.setItem('cal_cat_budgets_v3', JSON.stringify(categoryBudgets)); }, [categoryBudgets]);
      useEffect(() => { localStorage.setItem('cal_base_balance_v3', String(baseBalance)); }, [baseBalance]);
      useEffect(() => { localStorage.setItem('cal_payday_actuals_v3', JSON.stringify(paydayActuals)); }, [paydayActuals]);
      useEffect(() => { localStorage.setItem('cal_income_wall_v3', String(incomeWallTarget)); }, [incomeWallTarget]);
      useEffect(() => { localStorage.setItem('cal_templates_v3', JSON.stringify(templates)); }, [templates]);
      useEffect(() => { localStorage.setItem('cal_hidden_shifts_v3', JSON.stringify(hiddenShiftKeys)); }, [hiddenShiftKeys]);
      useEffect(() => { localStorage.setItem('cal_pinned_shifts_v3', JSON.stringify(pinnedShiftKeys)); }, [pinnedShiftKeys]);
      useEffect(() => { localStorage.setItem('cal_cycle_cfg_v3', JSON.stringify(cycleConfig)); }, [cycleConfig]);
      useEffect(() => { localStorage.setItem('cal_cycle_logs_v3', JSON.stringify(cycleLogs)); }, [cycleLogs]);

      // PWA検出 & URLパラメータ解析
      useEffect(() => {
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
          setIsStandalone(true);
        }
        const handleBeforeInstall = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstall);

        const params = new URLSearchParams(window.location.search);
        const shareData = params.get('share');
        if (shareData) {
          try {
            const decoded = JSON.parse(decodeURIComponent(escape(atob(shareData))));
            if (Array.isArray(decoded)) {
              const sanitized = decoded.map((item, idx) => ({
                id: item.id || `sh_view_${idx}`,
                title: String(item.title || '予定'),
                date: String(item.date || todayStr),
                endDate: String(item.endDate || item.date || todayStr),
                isAllDay: Boolean(item.isAllDay),
                startTime: String(item.startTime || ''),
                endTime: String(item.endTime || ''),
                color: String(item.color || '#3E7B67'),
                amount: Number(item.amount) || 0,
                isExpense: item.isExpense !== false,
                memo: String(item.memo || ''),
                subItems: Array.isArray(item.subItems) ? item.subItems : [],
              }));
              setSharedEvents(sanitized);
              setSelectedImportIds(sanitized.map(item => item.id));
              setIsViewingShared(true);
            }
          } catch (err) {
            console.error(err);
          }
        }

        const addExp = params.get('add_expense');
        if (addExp) {
          const amt = Number(addExp) || 0;
          const ttl = params.get('title') || 'クイック支出';
          const method = params.get('method');
          const fullTitle = method ? `[${method}] ${ttl}` : ttl;
          if (amt > 0) {
            const ev = {
              id: 'sc_' + Date.now(),
              title: fullTitle,
              date: todayStr,
              endDate: todayStr,
              isAllDay: true,
              startTime: '',
              endTime: '',
              color: '#C28540',
              amount: amt,
              isExpense: true,
              isShift: false,
              completed: true,
              memo: 'ショートカット自動記録',
              subItems: [],
              reminder: 'none',
              isPinned: false,
              seriesId: null,
            };
            setEvents(prev => [ev, ...prev]);
            showToast(`「${fullTitle}」(${amt.toLocaleString()}円)を記録しました`);
            window.history.replaceState({}, '', window.location.pathname);
          }
        }

        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
      }, []);

      // リマインド通知の定期チェック
      useEffect(() => {
        const checkReminders = () => {
          if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
          const now = new Date();
          events.forEach(ev => {
            if (!ev.reminder || ev.reminder === 'none' || ev.completed) return;
            const key = `${ev.id}_${ev.date}_${ev.startTime}_${ev.reminder}`;
            if (notifiedIdsRef.current.has(key)) return;

            const [y, m, d] = ev.date.split('-').map(Number);
            const [hh, mm] = (ev.isAllDay || !ev.startTime ? '09:00' : ev.startTime).split(':').map(Number);
            const targetTime = new Date(y, m - 1, d, hh, mm, 0);
            const remindAt = new Date(targetTime.getTime() - Number(ev.reminder) * 60 * 1000);
            const diffMs = now.getTime() - remindAt.getTime();

            if (diffMs >= 0 && diffMs < 60 * 1000) {
              notifiedIdsRef.current.add(key);
              new Notification(`リマインド: ${ev.title}`, {
                body: `${ev.date} ${ev.isAllDay ? '終日' : ev.startTime} の予定です`,
              });
            }
          });
        };

        checkReminders();
        const timer = setInterval(checkReminders, 30000);
        return () => clearInterval(timer);
      }, [events]);

      const requestNotificationPermission = async () => {
        if (typeof Notification === 'undefined') {
          showToast('このブラウザは通知に対応していません');
          return;
        }
        const res = await Notification.requestPermission();
        setNotifPermission(res);
        if (res === 'granted') showToast('リマインド通知を許可しました');
        else showToast('通知がブロックされています。ブラウザ設定をご確認ください');
      };

      const downloadICS = (ev) => {
        const dtStr = ev.date.replace(/-/g, '');
        const startT = (ev.startTime || '09:00').replace(':', '') + '00';
        const endT = (ev.endTime || '10:00').replace(':', '') + '00';
        const dtStart = ev.isAllDay ? `DTSTART;VALUE=DATE:${dtStr}` : `DTSTART:${dtStr}T${startT}`;
        const dtEnd = ev.isAllDay ? `DTEND;VALUE=DATE:${dtStr}` : `DTEND:${dtStr}T${endT}`;
        const triggerMins = ev.reminder && ev.reminder !== 'none' ? Number(ev.reminder) : 15;

        const icsContent = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//SmartScheduleBudget//JP',
          'BEGIN:VEVENT',
          `UID:${ev.id}@smartcal`,
          dtStart,
          dtEnd,
          `SUMMARY:${ev.title}`,
          `DESCRIPTION:${(ev.memo || '').replace(/\n/g, ' ')}`,
          'BEGIN:VALARM',
          'ACTION:DISPLAY',
          'DESCRIPTION:Reminder',
          `TRIGGER:-PT${triggerMins}M`,
          'END:VALARM',
          'END:VEVENT',
          'END:VCALENDAR',
        ].join('\r\n');

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${ev.title}.ics`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('標準カレンダー用(.ics)を出力しました');
      };

      // 過去のバイトシフト入力履歴からよく使うパターンを抽出
      const shiftHistoryPatterns = useMemo(() => {
        const map = {};
        events.forEach(ev => {
          if (!ev.isShift || !ev.jobId || !ev.startTime || !ev.endTime) return;
          const job = jobs.find(j => j.id === ev.jobId);
          if (!job) return;
          const key = `${ev.jobId}_${ev.startTime}_${ev.endTime}`;
          if (hiddenShiftKeys.includes(key)) return;

          if (!map[key]) {
            const calc = calculateShiftDetails(ev.startTime, ev.endTime, job);
            map[key] = {
              key,
              jobId: ev.jobId,
              jobName: job.name,
              color: job.color || '#2E7D5B',
              startTime: ev.startTime,
              endTime: ev.endTime,
              pay: calc ? calc.pay : 0,
              workHours: calc ? calc.workHours : 0,
              count: 0,
              lastDate: ev.date,
              isPinned: pinnedShiftKeys.includes(key),
            };
          }
          map[key].count += 1;
          if (ev.date > map[key].lastDate) map[key].lastDate = ev.date;
        });

        return Object.values(map)
          .sort((a, b) => {
            if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
            return b.count - a.count || b.lastDate.localeCompare(a.lastDate);
          })
          .slice(0, 10);
      }, [events, jobs, hiddenShiftKeys, pinnedShiftKeys]);

      const removeShiftHistoryPattern = (e, key) => {
        e.stopPropagation();
        setHiddenShiftKeys(prev => prev.includes(key) ? prev : [...prev, key]);
        setPinnedShiftKeys(prev => prev.filter(k => k !== key));
        showToast('シフト履歴候補から削除しました');
      };

      const togglePinShiftHistory = (e, key) => {
        e.stopPropagation();
        setPinnedShiftKeys(prev =>
          prev.includes(key) ? prev.filter(k => k !== key) : [...prev, key]
        );
      };

      const handleQuickShiftRegister = (pattern, targetDateOverride = null) => {
        const job = jobs.find(j => j.id === pattern.jobId);
        if (!job) return;
        const targetDate = targetDateOverride || (viewMode === 'day' || viewMode === 'week' ? selectedDate : todayStr);
        const calc = calculateShiftDetails(pattern.startTime, pattern.endTime, job);

        const ev = {
          id: 'sh_quick_' + Date.now(),
          title: `${job.name} バイト`,
          date: targetDate,
          endDate: targetDate,
          isAllDay: false,
          startTime: pattern.startTime,
          endTime: pattern.endTime,
          color: job.color || '#2E7D5B',
          amount: calc ? calc.pay : 0,
          isExpense: false,
          isShift: true,
          jobId: job.id,
          shiftMeta: calc,
          completed: false,
          memo: '',
          subItems: [],
          reminder: 'none',
          isPinned: false,
          seriesId: null,
        };
        setEvents(prev => [ev, ...prev]);
        setIsQuickMenuOpen(false);
        showToast(`${targetDate.slice(5)} に「${job.name} (${pattern.startTime}-${pattern.endTime})」を登録しました`);
      };

      const togglePinEvent = (id) => {
        setEvents(prev => prev.map(ev => ev.id === id ? { ...ev, isPinned: !ev.isPinned } : ev));
      };

      // 削除確認＆Undo処理
      const requestDeleteEvent = (ev) => {
        const seriesCount = ev.seriesId ? events.filter(item => item.seriesId === ev.seriesId).length : 0;
        setDeleteConfirmTarget({ ev, hasSeries: seriesCount > 1, seriesCount });
      };

      const executeDeleteEvent = (mode = 'single') => {
        if (!deleteConfirmTarget) return;
        const { ev } = deleteConfirmTarget;
        let removedItems = [];
        if (mode === 'series' && ev.seriesId) {
          removedItems = events.filter(item => item.seriesId === ev.seriesId);
          setEvents(prev => prev.filter(item => item.seriesId !== ev.seriesId));
        } else {
          removedItems = [ev];
          setEvents(prev => prev.filter(item => item.id !== ev.id));
        }
        setUndoStack(prev => [...prev, { items: removedItems, label: ev.title }]);
        setDeleteConfirmTarget(null);
        showToast(
          removedItems.length > 1
            ? `「${ev.title}」ほか${removedItems.length}件を削除しました`
            : `「${ev.title}」を削除しました`,
          true
        );
      };

      const handleUndoDelete = () => {
        if (undoStack.length === 0) return;
        const last = undoStack[undoStack.length - 1];
        setEvents(prev => [...last.items, ...prev]);
        setUndoStack(prev => prev.slice(0, -1));
        setToastState({ msg: `「${last.label}」を元に戻しました`, canUndo: false });
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => setToastState({ msg: '', canUndo: false }), 2500);
      };

      // 月・週・日のスライド付き移動
      const triggerSlide = (direction) => {
        setSlideAnimClass(direction === 'next' ? 'animate-slide-next' : 'animate-slide-prev');
        setSlideKey(prev => prev + 1);
      };

      const changeMonth = (delta) => {
        triggerSlide(delta > 0 ? 'next' : 'prev');
        setCurrentDate(prev => new Date(prev.getFullYear(), prev.getMonth() + delta, 1));
      };

      const changeSelectedWeek = (deltaWeeks) => {
        triggerSlide(deltaWeeks > 0 ? 'next' : 'prev');
        const nextStr = addDaysStr(selectedDate, deltaWeeks * 7);
        setSelectedDate(nextStr);
        const [y, m] = nextStr.split('-').map(Number);
        setCurrentDate(new Date(y, m - 1, 1));
      };

      const changeSelectedDay = (delta) => {
        triggerSlide(delta > 0 ? 'next' : 'prev');
        const nextStr = addDaysStr(selectedDate, delta);
        setSelectedDate(nextStr);
        const [y, m] = nextStr.split('-').map(Number);
        setCurrentDate(new Date(y, m - 1, 1));
      };

      const handleTouchStart = (e) => {
        if (e.touches && e.touches.length === 1) {
          touchStartRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
      };

      const handleTouchEnd = (e) => {
        if (!e.changedTouches || e.changedTouches.length === 0) return;
        const dx = e.changedTouches[0].clientX - touchStartRef.current.x;
        const dy = e.changedTouches[0].clientY - touchStartRef.current.y;
        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          if (viewMode === 'month') changeMonth(dx < 0 ? 1 : -1);
          else if (viewMode === 'week') changeSelectedWeek(dx < 0 ? 1 : -1);
          else if (viewMode === 'day') changeSelectedDay(dx < 0 ? 1 : -1);
        }
      };

      const jumpToBudgetSettings = () => {
        setViewMode('settings');
        setHighlightBudgetCard(true);
        setTimeout(() => {
          const el = document.getElementById('budget-settings-card');
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 80);
        setTimeout(() => setHighlightBudgetCard(false), 2200);
      };

      // 給料日イベントの自動生成（実際の振込額照合にも対応）
      const autoPaydayEvents = useMemo(() => {
        if (isViewingShared || jobs.length === 0) return [];
        const grouped = {};
        events.forEach(ev => {
          if (!ev.isShift || !ev.jobId) return;
          const job = jobs.find(j => j.id === ev.jobId);
          if (!job) return;
          const [y, m] = ev.date.split('-').map(Number);
          const paydayStr = getPaydayDateStr(y, m - 1, job.payDay || 25);
          const paydayKey = `${job.id}_${paydayStr}`;
          if (!grouped[paydayKey]) {
            const actualVal = paydayActuals[paydayKey];
            grouped[paydayKey] = {
              id: `payday_${paydayKey}`,
              paydayKey,
              jobName: job.name,
              title: `${job.name} 給料日`,
              date: paydayStr,
              endDate: paydayStr,
              isAllDay: true,
              startTime: '',
              endTime: '',
              color: job.color || '#2E7D5B',
              calculatedAmount: 0,
              actualAmount: typeof actualVal === 'number' ? actualVal : null,
              amount: 0,
              isExpense: false,
              isAutoPayday: true,
              completed: paydayStr <= todayStr,
              memo: `${m}月稼働分の自動集計給与`,
            };
          }
          grouped[paydayKey].calculatedAmount += Number(ev.amount) || 0;
        });

        return Object.values(grouped)
          .filter(p => p.calculatedAmount > 0)
          .map(p => ({
            ...p,
            amount: p.actualAmount !== null ? p.actualAmount : p.calculatedAmount,
          }));
      }, [events, jobs, isViewingShared, todayStr, paydayActuals]);

      const activeEvents = useMemo(() => {
        if (isViewingShared && sharedEvents) return sharedEvents;
        return [...events, ...autoPaydayEvents];
      }, [events, autoPaydayEvents, isViewingShared, sharedEvents]);

      // ピン止め中の予定・TODO一覧
      const pinnedEventsList = useMemo(() => {
        if (isViewingShared) return [];
        return events
          .filter(ev => ev.isPinned)
          .sort((a, b) => Number(a.completed) - Number(b.completed) || a.date.localeCompare(b.date));
      }, [events, isViewingShared]);

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      const monthPrefix = `${year}-${String(month).padStart(2, '0')}`;
      const yearPrefix = `${year}-`;

      // 前月の年・月プレフィックス
      const prevMonthObj = useMemo(() => new Date(year, month - 2, 1), [year, month]);
      const prevYear = prevMonthObj.getFullYear();
      const prevMonth = prevMonthObj.getMonth() + 1;
      const prevMonthPrefix = `${prevYear}-${String(prevMonth).padStart(2, '0')}`;

      // 月間集計（今月＋前月比較）
      const monthlyStats = useMemo(() => {
        let expense = 0;
        let confirmedExpense = 0;
        let earnedThisMonth = 0;
        let paydayThisMonth = 0;
        let prevExpense = 0;
        let prevEarned = 0;

        activeEvents.forEach(ev => {
          const amt = Number(ev.amount) || 0;
          if (ev.date.startsWith(monthPrefix)) {
            if (ev.isExpense) {
              expense += amt;
              if (ev.completed) confirmedExpense += amt;
            } else {
              if (ev.isShift) earnedThisMonth += amt;
              else if (ev.isAutoPayday) paydayThisMonth += amt;
              else earnedThisMonth += amt;
            }
          } else if (ev.date.startsWith(prevMonthPrefix)) {
            if (ev.isExpense) prevExpense += amt;
            else if (!ev.isAutoPayday) prevEarned += amt;
          }
        });

        return {
          expense,
          confirmedExpense,
          earnedThisMonth,
          paydayThisMonth,
          prevExpense,
          prevEarned,
          expenseDiff: expense - prevExpense,
          earnedDiff: earnedThisMonth - prevEarned,
        };
      }, [activeEvents, monthPrefix, prevMonthPrefix]);

      // 1. 年間収入集計（103万・130万の壁メーター用）
      const annualIncomeStats = useMemo(() => {
        let shiftEarnedYear = 0;
        let otherIncomeYear = 0;
        activeEvents.forEach(ev => {
          if (!ev.date.startsWith(yearPrefix) || ev.isExpense || ev.isAutoPayday) return;
          const amt = Number(ev.amount) || 0;
          if (ev.isShift) shiftEarnedYear += amt;
          else otherIncomeYear += amt;
        });
        const totalYearIncome = shiftEarnedYear + otherIncomeYear;
        const pct103 = Math.min(100, Math.round((totalYearIncome / 1030000) * 100));
        const pct130 = Math.min(100, Math.round((totalYearIncome / 1300000) * 100));
        const pctCustom = incomeWallTarget > 0 ? Math.min(100, Math.round((totalYearIncome / incomeWallTarget) * 100)) : 0;
        return {
          shiftEarnedYear,
          otherIncomeYear,
          totalYearIncome,
          rem103: 1030000 - totalYearIncome,
          rem130: 1300000 - totalYearIncome,
          remCustom: incomeWallTarget - totalYearIncome,
          pct103,
          pct130,
          pctCustom,
        };
      }, [activeEvents, yearPrefix, incomeWallTarget]);

      // 3. 年間・月別推移グラフ用（1月〜12月）
      const annualMonthlyTrend = useMemo(() => {
        const list = Array.from({ length: 12 }, (_, idx) => {
          const mNum = idx + 1;
          const prefix = `${year}-${String(mNum).padStart(2, '0')}`;
          let income = 0;
          let expense = 0;
          activeEvents.forEach(ev => {
            if (!ev.date.startsWith(prefix)) return;
            const amt = Number(ev.amount) || 0;
            if (ev.isExpense) expense += amt;
            else if (!ev.isAutoPayday) income += amt;
          });
          return { month: mNum, prefix, income, expense };
        });
        const maxVal = Math.max(1, ...list.map(d => Math.max(d.income, d.expense)));
        return { list, maxVal };
      }, [activeEvents, year]);

      // 4. 固定費・サブスク管理一覧（繰り返し登録された支出シリーズ or isFixedCostフラグ）
      const fixedCostSeriesList = useMemo(() => {
        const map = {};
        events.forEach(ev => {
          if (!ev.isExpense) return;
          if (!ev.seriesId && !ev.isFixedCost) return;
          const key = ev.seriesId || `single_${ev.id}`;
          if (!map[key]) {
            map[key] = {
              key,
              seriesId: ev.seriesId,
              title: ev.title,
              amount: Number(ev.amount) || 0,
              color: ev.color,
              count: 0,
              nextDate: null,
              sampleEvent: ev,
            };
          }
          map[key].count += 1;
          if (ev.date >= todayStr && (!map[key].nextDate || ev.date < map[key].nextDate)) {
            map[key].nextDate = ev.date;
          }
        });
        const items = Object.values(map).sort((a, b) => b.amount - a.amount);
        const monthlyTotal = items.reduce((sum, item) => sum + item.amount, 0);
        return { items, monthlyTotal };
      }, [events, todayStr]);

      // 口座内金額（今日までの確定反映＋見込）
      const accountStats = useMemo(() => {
        let currentAccountBalance = baseBalance;
        let projectedAccountBalance = baseBalance;

        activeEvents.forEach(ev => {
          if (ev.isShift) return;
          const amt = Number(ev.amount) || 0;
          if (amt <= 0) return;
          if (ev.isExpense) {
            projectedAccountBalance -= amt;
            if (ev.completed || ev.date <= todayStr) currentAccountBalance -= amt;
          } else {
            projectedAccountBalance += amt;
            if (ev.completed || ev.date <= todayStr) currentAccountBalance += amt;
          }
        });

        return { currentAccountBalance, projectedAccountBalance };
      }, [activeEvents, baseBalance, todayStr]);

      const usableRemainingThisMonth = monthlyBudget - monthlyStats.expense;
      const budgetPercent = monthlyBudget > 0 ? Math.min(100, Math.round((monthlyStats.expense / monthlyBudget) * 100)) : 0;
      const isOverBudget = monthlyBudget > 0 && monthlyStats.expense > monthlyBudget;
      const isNearBudget = monthlyBudget > 0 && !isOverBudget && budgetPercent >= 80;

      // カテゴリ別支出内訳（カテゴリ別予算上限との比較付き）
      const categoryExpenseBreakdown = useMemo(() => {
        const map = {};
        COLOR_PALETTE.forEach(c => {
          if (c.color !== '#2E7D5B') {
            map[c.name] = { name: c.name, color: c.color, amount: 0, budget: Number(categoryBudgets[c.color]) || 0 };
          }
        });
        activeEvents.forEach(ev => {
          if (!ev.date.startsWith(monthPrefix) || !ev.isExpense || !(ev.amount > 0)) return;
          const name = getCategoryNameByColor(ev.color);
          if (!map[name]) map[name] = { name, color: ev.color, amount: 0, budget: Number(categoryBudgets[ev.color]) || 0 };
          map[name].amount += Number(ev.amount);
        });
        return Object.values(map).filter(item => item.amount > 0 || item.budget > 0).sort((a, b) => b.amount - a.amount);
      }, [activeEvents, monthPrefix, categoryBudgets]);

      // 勤務先別稼働集計（実際の振込額との照合対応）
      const jobEarnedBreakdown = useMemo(() => {
        return jobs.map(j => {
          const matched = activeEvents.filter(ev => ev.date.startsWith(monthPrefix) && ev.isShift && ev.jobId === j.id);
          const totalPay = matched.reduce((sum, ev) => sum + (Number(ev.amount) || 0), 0);
          const totalHours = matched.reduce((sum, ev) => sum + (ev.shiftMeta?.workHours || 0), 0);
          const paydayStr = getPaydayDateStr(year, month - 1, j.payDay || 25);
          const paydayKey = `${j.id}_${paydayStr}`;
          const actualPaid = typeof paydayActuals[paydayKey] === 'number' ? paydayActuals[paydayKey] : null;
          return {
            ...j,
            count: matched.length,
            totalHours: Number(totalHours.toFixed(1)),
            totalPay,
            paydayStr,
            paydayKey,
            actualPaid,
            diffFromCalc: actualPaid !== null ? actualPaid - totalPay : null,
          };
        }).filter(item => item.count > 0);
      }, [jobs, activeEvents, monthPrefix, year, month, paydayActuals]);

      // 今月振り込まれる給料リスト（前月稼働分・振込照合用）
      const incomingPaydaysThisMonth = useMemo(() => {
        return autoPaydayEvents.filter(p => p.date.startsWith(monthPrefix));
      }, [autoPaydayEvents, monthPrefix]);

      // 生理周期の分析・予測計算
      const cycleAnalysis = useMemo(() => {
        const sorted = [...cycleLogs].sort((a, b) => a.startDate.localeCompare(b.startDate));
        let effectiveCycleDays = Number(cycleConfig.avgCycleDays) || 28;
        if (sorted.length >= 2) {
          let sumDiff = 0;
          let validCount = 0;
          for (let i = 1; i < sorted.length; i++) {
            const d = diffDays(sorted[i - 1].startDate, sorted[i].startDate);
            if (d >= 18 && d <= 50) {
              sumDiff += d;
              validCount++;
            }
          }
          if (validCount > 0) effectiveCycleDays = Math.round(sumDiff / validCount);
        }

        const latest = sorted[sorted.length - 1] || null;
        const periodDuration = Number(cycleConfig.avgPeriodDays) || 5;
        let predictedWindows = [];

        if (latest) {
          for (let k = 1; k <= 3; k++) {
            const predStart = addDaysStr(latest.startDate, effectiveCycleDays * k);
            const predEnd = addDaysStr(predStart, periodDuration - 1);
            predictedWindows.push({ start: predStart, end: predEnd });
          }
        }

        return { sorted, effectiveCycleDays, latest, periodDuration, predictedWindows };
      }, [cycleLogs, cycleConfig]);

      const getDateCycleStatus = (dateStr) => {
        if (!cycleConfig.enabled || isViewingShared) return null;
        for (const log of cycleAnalysis.sorted) {
          const end = log.endDate || addDaysStr(log.startDate, cycleAnalysis.periodDuration - 1);
          if (dateStr >= log.startDate && dateStr <= end) {
            return { type: 'actual', isStart: dateStr === log.startDate, log };
          }
        }
        for (const win of cycleAnalysis.predictedWindows) {
          if (dateStr >= win.start && dateStr <= win.end) {
            return { type: 'predicted', isStart: dateStr === win.start };
          }
        }
        return null;
      };

      const selectedDayCycleLog = useMemo(() => {
        return cycleAnalysis.sorted.find(l => {
          const end = l.endDate || addDaysStr(l.startDate, cycleAnalysis.periodDuration - 1);
          return selectedDate >= l.startDate && selectedDate <= end;
        }) || null;
      }, [cycleAnalysis, selectedDate]);

      useEffect(() => {
        setCycleNoteInput(selectedDayCycleLog?.note || '');
      }, [selectedDate, selectedDayCycleLog]);

      const handleStartCycleOnSelectedDate = () => {
        const exists = cycleLogs.some(l => l.startDate === selectedDate);
        if (exists) {
          showToast('この日はすでに開始日として記録されています');
          return;
        }
        const entry = {
          id: 'cyc_' + Date.now(),
          startDate: selectedDate,
          endDate: addDaysStr(selectedDate, (Number(cycleConfig.avgPeriodDays) || 5) - 1),
          note: cycleNoteInput,
        };
        setCycleLogs(prev => [...prev, entry]);
        showToast(`${selectedDate.slice(5)} を生理開始日として記録しました`);
      };

      const handleSetCycleEndOnSelectedDate = () => {
        if (!selectedDayCycleLog || selectedDate < selectedDayCycleLog.startDate) return;
        setCycleLogs(prev => prev.map(l => l.id === selectedDayCycleLog.id ? { ...l, endDate: selectedDate } : l));
        showToast(`${selectedDate.slice(5)} を終了日に更新しました`);
      };

      const handleSaveCycleNote = () => {
        if (!selectedDayCycleLog) return;
        setCycleLogs(prev => prev.map(l => l.id === selectedDayCycleLog.id ? { ...l, note: cycleNoteInput } : l));
        showToast('体調メモを保存しました');
      };

      // カレンダーグリッド生成（月表示）
      const calendarDays = useMemo(() => {
        const firstDayOfWeek = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const cells = [];
        for (let i = 0; i < firstDayOfWeek; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          cells.push(`${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
        }
        return cells;
      }, [year, month]);

      // 8. 週表示用7日間配列
      const weekDates = useMemo(() => getWeekDates(selectedDate), [selectedDate]);

      const getEventsForDate = (dateStr) => {
        return activeEvents.filter(ev => {
          const end = ev.endDate || ev.date;
          return dateStr >= ev.date && dateStr <= end;
        }).sort((a, b) => {
          if (Boolean(a.isPinned) !== Boolean(b.isPinned)) return a.isPinned ? -1 : 1;
          if (a.isAllDay && !b.isAllDay) return -1;
          if (!a.isAllDay && b.isAllDay) return 1;
          return (a.startTime || '').localeCompare(b.startTime || '');

        return activeEvents
          .filter(ev => ev.date.startsWith(monthPrefix) && (Number(ev.amount) > 0 || ev.isShift))
          .filter(ev => {

            return true;

          .sort((a, b) => b.date.localeCompare(a.date));

      const searchResults = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return [];
        return activeEvents.filter(ev => {
          const subStr = (ev.subItems || []).map(s => s.name).join(' ').toLowerCase();
          return (
            (ev.title || '').toLowerCase().includes(q) ||
            (ev.memo || '').toLowerCase().includes(q) ||
            (ev.sharedBadge || '').toLowerCase().includes(q) ||

      // 曜日一括登録のプレビュー日付リスト生成

        const tYear = baseDt.getFullYear();
        const tMonth = baseDt.getMonth();
        const daysInTarget = new Date(tYear, tMonth + 1, 0).getDate();
        const list = [];
        for (let d = 1; d <= daysInTarget; d++) {
          const dt = new Date(tYear, tMonth, d);
          if (selectedWeekdays.includes(dt.getDay())) {
            list.push(formatDateStr(dt));

        return list;
      }, [modalTab, repeatOption, selectedWeekdays, bulkTargetMonth, year, month]);

      const toggleWeekdayChoice = (dayIdx) => {
        setSelectedWeekdays(prev =>
          prev.includes(dayIdx) ? prev.filter(d => d !== dayIdx) : [...prev, dayIdx].sort()
        );

      // モーダル操作（予定 / 収支 / バイト 分離タブ）
      const openCreateModal = (initialTab = 'schedule') => {
        const targetDate = (viewMode === 'day' || viewMode === 'week') ? selectedDate : todayStr;

        setEditScope('single');

        setShowScheduleAmount(false);
        setShowSubItemsPanel(false);

        setNewEvent({
          title: '',
          date: targetDate,
          endDate: targetDate,

          isExpense: true,
          isShift: initialTab === 'shift',
          isFixedCost: false,

          memo: '',

      const openEditModal = (ev) => {

      const switchModalTab = (tab) => {

        } else if (tab === 'finance') {
          setNewEvent(prev => ({ ...prev, isShift: false, isAllDay: true, isExpense: true, color: '#C28540' }));

      const handleAddSubItem = () => {
        const price = Number(subItemInput.price);
        if (!subItemInput.name.trim() || price <= 0) return;
        const nextSubs = [...newEvent.subItems, { id: 'sub_' + Date.now(), name: subItemInput.name.trim(), price }];

        setNewEvent({ ...newEvent, subItems: nextSubs, amount: sum });
        setSubItemInput({ name: '', price: '' });

      const handleRemoveSubItem = (subId) => {

      const applyTemplateToForm = (tpl) => {

      const handleSaveEvent = (e) => {
        e.preventDefault();
        let finalTitle = newEvent.title.trim();
        let finalAmount = Number(newEvent.amount) || 0;
        let finalIsExpense = newEvent.isExpense;
        let finalColor = newEvent.color;
        let shiftMeta = null;

        if (modalTab === 'shift') {
          const job = jobs.find(j => j.id === newEvent.jobId);
          if (!job) return;
          const calc = calculateShiftDetails(newEvent.startTime, newEvent.endTime, job);
          finalTitle = `${job.name} バイト`;

          finalIsExpense = false;
          finalColor = job.color || '#2E7D5B';
          shiftMeta = calc;
        } else if (modalTab === 'finance') {
          if (!finalTitle) finalTitle = finalIsExpense ? '支出' : '収入';
        } else {
          if (!finalTitle) return;
          if (!showScheduleAmount) finalAmount = 0;
        }

        const basePayload = {
          ...newEvent,
          title: finalTitle,
          amount: finalAmount,
          isExpense: finalIsExpense,
          isShift: modalTab === 'shift',
          isFixedCost: modalTab === 'finance' && finalIsExpense && (newEvent.isFixedCost || repeatOption !== 'none'),
          color: finalColor,
          shiftMeta,
          completed: editingId ? newEvent.completed : (modalTab === 'finance' && newEvent.date <= todayStr),
        };

        if (editingId) {
          if (editScope === 'series' && newEvent.seriesId) {
            setEvents(prev => prev.map(ev => {
              if (ev.seriesId !== newEvent.seriesId) return ev;
              return {
                ...ev,
                title: basePayload.title,
                startTime: basePayload.startTime,
                endTime: basePayload.endTime,
                isAllDay: basePayload.isAllDay,
                color: basePayload.color,
                amount: basePayload.amount,
                isExpense: basePayload.isExpense,
                isFixedCost: basePayload.isFixedCost,
                jobId: basePayload.jobId,
                shiftMeta: basePayload.shiftMeta,
                memo: basePayload.memo,
                reminder: basePayload.reminder,
                isPinned: basePayload.isPinned,
              };
            }));
            showToast('繰り返しグループ全体を一括更新しました');
          } else {
            setEvents(prev => prev.map(ev => ev.id === editingId ? { ...basePayload, id: editingId } : ev));
            showToast('変更を保存しました');
          }
        } else if (modalTab === 'shift' && repeatOption === 'weekday_month') {
          if (bulkWeekdayDates.length === 0) {
            showToast('対象の曜日を1つ以上選択してください');
            return;
          }
          const newSeriesId = 'ser_' + Date.now();
          const itemsToAdd = bulkWeekdayDates.map((dtStr, idx) => ({
            ...basePayload,
            id: `ev_bulk_${Date.now()}_${idx}`,
            seriesId: newSeriesId,
            date: dtStr,
            endDate: dtStr,
          }));
          setEvents(prev => [...itemsToAdd, ...prev]);
          showToast(`${itemsToAdd.length}件のシフトを一括登録しました`);
        } else {
          const itemsToAdd = [];
          const spanDays = diffDays(basePayload.date, basePayload.endDate || basePayload.date);
          let count = 1;
          if (repeatOption === 'weekly_4') count = 4;
          if (repeatOption === 'monthly_3') count = 3;
          if (repeatOption === 'monthly_6') count = 6;
          if (repeatOption === 'monthly_12') count = 12;

          const newSeriesId = count > 1 ? 'ser_' + Date.now() : null;

          for (let i = 0; i < count; i++) {
            let targetDate = basePayload.date;
            if (repeatOption === 'weekly_4') {
              targetDate = addDaysStr(basePayload.date, i * 7);
            } else if (repeatOption.startsWith('monthly_')) {
              const [y, m, d] = basePayload.date.split('-').map(Number);
              const dt = new Date(y, m - 1 + i, d);
              targetDate = formatDateStr(dt);
            }
            itemsToAdd.push({
              ...basePayload,
              id: `ev_${Date.now()}_${i}`,
              seriesId: newSeriesId,
              date: targetDate,
              endDate: addDaysStr(targetDate, Math.max(0, spanDays)),
              completed: modalTab === 'finance' && targetDate <= todayStr,
            });
          }
          setEvents(prev => [...itemsToAdd, ...prev]);
          showToast(count > 1 ? `${count}件を繰り返しグループとして登録しました` : '登録しました');
        }

        setIsModalOpen(false);
      };

      const toggleComplete = (id) => {
        setEvents(prev => prev.map(ev => ev.id === id ? { ...ev, completed: !ev.completed } : ev));
      };

      // ワンタップ定型文即登録
      const handleQuickTemplateRegister = (tpl) => {
        const targetDate = (viewMode === 'day' || viewMode === 'week') ? selectedDate : todayStr;
        const ev = {
          id: 'tpl_ev_' + Date.now(),
          title: tpl.title,
          date: targetDate,
          endDate: targetDate,
          isAllDay: true,
          startTime: '',
          endTime: '',
          color: tpl.color,
          amount: Number(tpl.amount),
          isExpense: tpl.isExpense !== false,
          isShift: false,
          completed: targetDate <= todayStr,
          memo: 'ワンタップ定型登録',
          subItems: [],
          reminder: 'none',
          isPinned: false,
          seriesId: null,
        };
        setEvents(prev => [ev, ...prev]);
        setIsQuickMenuOpen(false);
        showToast(`「${tpl.title}」(${Number(tpl.amount).toLocaleString()}円)を登録しました`);
      };

      const addTemplate = () => {
        if (!newTemplate.title.trim() || Number(newTemplate.amount) <= 0) return;
        setTemplates(prev => [...prev, { ...newTemplate, id: 'tpl_' + Date.now(), amount: Number(newTemplate.amount) }]);
        setNewTemplate({ title: '', amount: 0, color: '#C28540', isExpense: true });
        showToast('定型文を追加しました');
      };

      const deleteTemplate = (id) => {
        setTemplates(prev => prev.filter(t => t.id !== id));
      };

      // 勤務先管理
      const addJob = () => {
        if (!newJob.name.trim()) return;
        setJobs(prev => [...prev, { ...newJob, id: 'job_' + Date.now() }]);
        setNewJob({
          name: '',
          hourlyWage: 1200,
          transportFee: 0,
          payDay: 25,
          autoBreak: true,
          nightBonus: true,
          color: '#2E7D5B',
        });
        showToast('勤務先を追加しました');
      };

      const deleteJob = (id) => {
        setJobs(prev => prev.filter(j => j.id !== id));
      };

      const updateJobPayDay = (id, payDayVal) => {
        setJobs(prev => prev.map(j => j.id === id ? { ...j, payDay: Number(payDayVal) } : j));
      };

      // 明細・メール一括解析
      const handleAnalyzeStatement = () => {
        const lines = statementRawText.split('\n').map(l => l.trim()).filter(Boolean);
        const results = [];
        const currentYear = new Date().getFullYear();

        lines.forEach((line, idx) => {
          const dateMatch = line.match(/(20\d{2})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/) || line.match(/(\d{1,2})[\/\-月](\d{1,2})日?/);
          const amountMatch = line.match(/([0-9,]{2,})\s*円/) || line.match(/,\s*([0-9]{2,})\s*$/) || line.match(/￥\s*([0-9,]+)/);

          if (amountMatch) {
            let parsedDate = todayStr;
            if (dateMatch) {
              if (dateMatch.length === 4) {
                parsedDate = `${dateMatch[1]}-${String(dateMatch[2]).padStart(2, '0')}-${String(dateMatch[3]).padStart(2, '0')}`;
              } else if (dateMatch.length === 3) {
                parsedDate = `${currentYear}-${String(dateMatch[1]).padStart(2, '0')}-${String(dateMatch[2]).padStart(2, '0')}`;
              }
            }
            const amount = Number(amountMatch[1].replace(/,/g, ''));
            let cleanedTitle = line
              .replace(/(20\d{2})[\/\-年](\d{1,2})[\/\-月](\d{1,2})日?/g, '')
              .replace(/(\d{1,2})[\/\-月](\d{1,2})日?/g, '')
              .replace(/([0-9,]{2,})\s*円/g, '')
              .replace(/￥\s*([0-9,]+)/g, '')
              .replace(/,/g, ' ')
              .trim();
            if (!cleanedTitle) cleanedTitle = 'カード・電子マネー利用';
            const finalTitle = statementMethodLabel.trim() ? `[${statementMethodLabel.trim()}] ${cleanedTitle}` : cleanedTitle;

            const dup = events.find(ev => ev.isExpense && ev.date === parsedDate && Number(ev.amount) === amount);
            results.push({
              id: `stmt_${Date.now()}_${idx}`,
              date: parsedDate,
              amount,
              title: finalTitle,
              selected: !dup,
              isDuplicate: Boolean(dup),
              duplicateReason: dup ? `同日・同額「${dup.title}」が登録済` : '',
            });
          }
        });

        setParsedStatements(results);
        if (results.length === 0) showToast('日付・金額のパターンを検出できませんでした');
      };

      const duplicateCountInModal = parsedStatements.filter(i => i.isDuplicate).length;

      const handleCommitStatements = () => {
        const chosen = parsedStatements.filter(i => i.selected);
        if (chosen.length === 0) return;
        const newItems = chosen.map((item, idx) => ({
          id: `imp_stmt_${Date.now()}_${idx}`,
          title: item.title,
          date: item.date,
          endDate: item.date,
          isAllDay: true,
          startTime: '',
          endTime: '',
          color: '#C28540',
          amount: Number(item.amount),
          isExpense: true,
          isShift: false,
          completed: true,
          memo: '明細自動取込',
          subItems: [],
          reminder: 'none',
          isPinned: false,
          seriesId: null,
        }));
        setEvents(prev => [...newItems, ...prev]);
        setIsStatementModalOpen(false);
        showToast(`${newItems.length}件の明細を支出登録しました`);
      };

      // 【セキュリティ改善済】共有リンク作成（非公開フィールドはシリアライズ対象から物理的に完全除外）
      const createShareLink = () => {
        const targetList = events
          .filter(ev => {
            if (shareOptions.scope === 'day') return ev.date === selectedDate;
            return ev.date.startsWith(monthPrefix);
          })
          .map((ev, idx) => {
            const safeItem = {
              id: `sh_${idx}_${ev.date}`,
              title: shareOptions.maskTitle ? (ev.isShift ? 'バイト' : '予定あり') : ev.title,
              date: ev.date,
              endDate: ev.endDate || ev.date,
              isAllDay: Boolean(ev.isAllDay),
              startTime: ev.isAllDay ? '' : (ev.startTime || ''),
              endTime: ev.isAllDay ? '' : (ev.endTime || ''),
              color: ev.color || '#3E7B67',
            };
            if (!shareOptions.hideMoney && Number(ev.amount) > 0) {
              safeItem.amount = Number(ev.amount);
              safeItem.isExpense = Boolean(ev.isExpense);
            }
            if (!shareOptions.hideMemo) {
              if (ev.memo) safeItem.memo = ev.memo;
              if (ev.subItems && ev.subItems.length > 0) safeItem.subItems = ev.subItems;
            }
            return safeItem;
          });

        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(targetList))));
        const url = `${window.location.origin}${window.location.pathname}?share=${encoded}`;
        setGeneratedShareUrl(url);
      };

      const copyShareUrl = () => {
        navigator.clipboard.writeText(generatedShareUrl);
        showToast('プライバシー保護済みの共有URLをコピーしました');
      };

      const toggleImportSelection = (id) => {
        setSelectedImportIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const toggleSelectAllImport = () => {
        if (!sharedEvents) return;
        if (selectedImportIds.length === sharedEvents.length) setSelectedImportIds([]);
        else setSelectedImportIds(sharedEvents.map(e => e.id));
      };

        const chosen = sharedEvents.filter(ev => selectedImportIds.includes(ev.id)).map((ev, idx) => ({
          ...ev,
          id: `shared_imp_${Date.now()}_${idx}`,
          color: importCustomColor === 'ORIGINAL' ? ev.color : importCustomColor,
          isSharedImport: true,
          sharedBadge: importBadgeLabel.trim() || '共有',

          isShift: false,
          isPinned: false,
          seriesId: null,
        }));
        setEvents(prev => [...chosen, ...prev]);
        setIsImportModalOpen(false);
        setIsViewingShared(false);
        setSharedEvents(null);
        window.history.replaceState({}, '', window.location.pathname);
        showToast(`${chosen.length}件の共有予定を取り込みました`);
      };

      // 5. CSV 書き出し＆取り込み
      const handleExportCSV = () => {
        const headers = ['日付', '終了日', '区分', 'カテゴリ', 'タイトル', '金額', '開始時刻', '終了時刻', '完了', 'メモ'];
        const rows = events.map(ev => [
          ev.date,
          ev.endDate || ev.date,
          ev.isShift ? 'バイト稼働' : ev.isExpense ? '支出' : '収入・予定',
          getCategoryNameByColor(ev.color),
          `"${(ev.title || '').replace(/"/g, '""')}"`,
          Number(ev.amount) || 0,
          ev.startTime || '',
          ev.endTime || '',
          ev.completed ? '1' : '0',
          `"${(ev.memo || '').replace(/"/g, '""')}"`,
        ].join(','));

        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `schedule_budget_${todayStr}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('CSVファイルをダウンロードしました');
      };

      const handleCsvFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const text = String(evt.target?.result || '');
          const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          const parsed = [];

          lines.forEach((line, idx) => {
            if (idx === 0 && (line.includes('日付') || line.toLowerCase().includes('date'))) return;
            const cols = parseCsvLine(line);
            if (cols.length < 2) return;

            let dateStr = '';
            let titleStr = '';
            let amountNum = 0;
            let isExp = true;
            let memoStr = '';

            // 独自エクスポート形式（10列）または汎用家計簿CSV（日付, 項目, 金額 等）に対応
            if (cols.length >= 6 && /^\d{4}-\d{2}-\d{2}$/.test(cols[0])) {
              dateStr = cols[0];
              isExp = cols[2] === '支出';
              titleStr = cols[4] || 'CSV取込';
              amountNum = Math.abs(Number(cols[5]) || 0);
              memoStr = cols[9] || '';
            } else {
              const rawDate = cols.find(c => /^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/.test(c));
              if (!rawDate) return;
              const [y, m, d] = rawDate.split(/[\/\-]/).map(Number);
              dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

              const rawAmtCol = cols.find(c => /^-?[0-9,]+$/.test(c.replace(/[円￥]/g, '')) && c !== rawDate);
              const signedAmt = rawAmtCol ? Number(rawAmtCol.replace(/[,円￥]/g, '')) : 0;
              isExp = signedAmt <= 0 || !line.includes('収入');
              amountNum = Math.abs(signedAmt);
              titleStr = cols.find(c => c !== rawDate && c !== rawAmtCol && c.length > 0) || 'CSV取込データ';
            }

            if (dateStr) {
              parsed.push({
                id: `csv_${Date.now()}_${idx}`,
                date: dateStr,
                endDate: dateStr,
                title: titleStr,
                amount: amountNum,
                isExpense: isExp,
                memo: memoStr,
              });
            }
          });

          setCsvImportPreview(parsed);
          if (parsed.length === 0) showToast('読み込めるCSV行が見つかりませんでした');
        };
        reader.readAsText(file, 'UTF-8');
        e.target.value = '';
      };

      const commitCsvImport = () => {
        if (csvImportPreview.length === 0) return;
        const added = csvImportPreview.map((item, idx) => ({
          id: `csv_ev_${Date.now()}_${idx}`,
          title: item.title,
          date: item.date,
          endDate: item.endDate,
          isAllDay: true,

                          <span className={darkMode ? 'text-emerald-400' : 'text-emerald-800'}>{pat.startTime}〜{pat.endTime}</span>

                            type="button"
                            onClick={(e) => togglePinShiftHistory(e, pat.key)}

                          </button>
                          <button
                            type="button"
                            onClick={(e) => removeShiftHistoryPattern(e, pat.key)}

                            ✕
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* オプション：生理周期の記録・メモカード */}
                {cycleConfig.enabled && !isViewingShared && (
                  <div className="bg-rose-50/80 border border-rose-200/90 p-3.5 rounded-2xl space-y-2.5 text-xs">
                    <div className="flex items-center justify-between">
                      <span className="font-bold text-rose-900">🌸 生理周期ログ・体調メモ（ローカル専用）</span>

                        <span className="bg-white text-rose-700 border border-rose-300 text-[10px] font-bold px-2 py-0.5 rounded-full">

                        </span>

                    </div>

                      <div className="space-y-2">
                        <div className="flex items-center justify-between text-[11px] text-rose-800">
