<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>予定＆家計簿 Ultimate</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { user-select: none; -webkit-user-select: none; }
    input, textarea, select { user-select: auto; -webkit-user-select: auto; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex justify-center">
  <div id="root" class="w-full max-w-md bg-gray-50 min-h-screen flex flex-col shadow-xl"></div>

  <script>
    window.onerror = function(msg, url, line) {
      var root = document.getElementById('root');
      if (root && !root.innerHTML) {
        root.innerHTML = '<div style="padding:20px;color:red;font-size:12px;">エラーが発生しました: ' + msg + ' (Line: ' + line + ')</div>';
      }
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const COLOR_PALETTE = [
      { name: '仕事・学業', color: '#3B82F6' },
      { name: '遊び・交際', color: '#EC4899' },
      { name: '食費・買物', color: '#F59E0B' },
      { name: 'バイト・収入', color: '#10B981' },
      { name: '固定費・重要', color: '#8B5CF6' },
      { name: 'その他', color: '#6B7280' }
    ];

    const getJapaneseHolidayName = (dateStr) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const dow = dt.getDay();

      const checkBasicHoliday = (year, month, day) => {
        const w = new Date(year, month - 1, day).getDay();
        const nthMonday = Math.floor((day - 1) / 7) + 1;

        if (month === 1 && day === 1) return '元日';
        if (month === 1 && w === 1 && nthMonday === 2) return '成人の日';
        if (month === 2 && day === 11) return '建国記念の日';
        if (month === 2 && day === 23) return '天皇誕生日';
        const vernal = Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
        if (month === 3 && day === vernal) return '春分の日';
        if (month === 4 && day === 29) return '昭和の日';
        if (month === 5 && day === 3) return '憲法記念日';
        if (month === 5 && day === 4) return 'みどりの日';
        if (month === 5 && day === 5) return 'こどもの日';
        if (month === 7 && w === 1 && nthMonday === 3) return '海の日';
        if (month === 8 && day === 11) return '山の日';
        if (month === 9 && w === 1 && nthMonday === 3) return '敬老の日';
        const autumnal = Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
        if (month === 9 && day === autumnal) return '秋分の日';
        if (month === 10 && w === 1 && nthMonday === 2) return 'スポーツの日';
        if (month === 11 && day === 3) return '文化の日';
        if (month === 11 && day === 23) return '勤労感謝の日';
        return null;
      };

      const direct = checkBasicHoliday(y, m, d);
      if (direct) return direct;

      if (dow !== 0) {
        let checkDt = new Date(y, m - 1, d - 1);
        while (true) {
          const h = checkBasicHoliday(checkDt.getFullYear(), checkDt.getMonth() + 1, checkDt.getDate());
          if (!h) break;
          if (checkDt.getDay() === 0) return '振替休日';
          checkDt.setDate(checkDt.getDate() - 1);
        }
      }
      return null;
    };

    const encodeShareData = (obj) => {
      const json = JSON.stringify(obj);
      const bytes = new TextEncoder().encode(json);
      let binString = '';
      bytes.forEach((b) => { binString += String.fromCharCode(b); });
      return btoa(binString).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    };

    const decodeShareData = (str) => {
      try {
        let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) base64 += '=';
        const binString = atob(base64);
        const bytes = new Uint8Array(binString.length);
        for (let i = 0; i < binString.length; i++) bytes[i] = binString.charCodeAt(i);
        const json = new TextDecoder().decode(bytes);
        return JSON.parse(json);
      } catch (e) {
        return null;
      }
    };

    const shiftDateStr = (dateStr, diffDays) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + diffDays);
      const ny = dt.getFullYear();
      const nm = String(dt.getMonth() + 1).padStart(2, '0');
      const nd = String(dt.getDate()).padStart(2, '0');
      return `${ny}-${nm}-${nd}`;
    };

    const isEventOnDate = (ev, dateStr) => {
      const start = ev.date;
      const end = ev.endDate && ev.endDate >= start ? ev.endDate : start;
      return dateStr >= start && dateStr <= end;
    };

    const downloadICS = (ev) => {
      const startClean = ev.date.replace(/-/g, '');
      const endClean = (ev.endDate || ev.date).replace(/-/g, '');
      let dtStartLine = '';
      let dtEndLine = '';

      if (ev.isAllDay) {
        const nextDayAfterEnd = shiftDateStr(ev.endDate || ev.date, 1).replace(/-/g, '');
        dtStartLine = `DTSTART;VALUE=DATE:${startClean}`;
        dtEndLine = `DTEND;VALUE=DATE:${nextDayAfterEnd}`;
      } else {
        const sTime = (ev.startTime || '09:00').replace(':', '') + '00';
        const eTime = (ev.endTime || '10:00').replace(':', '') + '00';
        dtStartLine = `DTSTART:${startClean}T${sTime}`;
        dtEndLine = `DTEND:${endClean}T${eTime}`;
      }

      const descParts = [];
      if (ev.amount > 0) {
        descParts.push(`金額: ${ev.isExpense ? '-' : '+'}${ev.amount.toLocaleString()}円`);
      }
      if (ev.memo) {
        descParts.push(ev.memo);
      }
      const desc = descParts.join(' / ');
      const crlf = String.fromCharCode(13, 10);

      const icsContent = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//ScheduleKakeibo//JP',
        'BEGIN:VEVENT',
        `UID:${ev.id}@schedule-kakeibo`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
        dtStartLine,
        dtEndLine,
        `SUMMARY:${ev.title}`,
        `DESCRIPTION:${desc}`,
        'END:VEVENT',
        'END:VCALENDAR'
      ].join(crlf);

      const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${ev.title}.ics`;
      a.click();
      URL.revokeObjectURL(url);
    };

    function App() {
      const todayStr = new Date().toISOString().split('T')[0];
      const [currentDate, setCurrentDate] = useState(new Date());
      const [viewMode, setViewMode] = useState('month');
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [financeFilter, setFinanceFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      const touchStartX = useRef(null);
      const touchStartY = useRef(null);

      const [sharedEvents, setSharedEvents] = useState(null);
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [shareOptions, setShareOptions] = useState({
        scope: 'month',
        hideMoney: true,
        hideMemo: true,
        maskTitle: false
      });
      const [generatedShareUrl, setGeneratedShareUrl] = useState('');

      const [baseBalance, setBaseBalance] = useState(() => {
        const saved = localStorage.getItem('app_base_balance');
        return saved !== null ? Number(saved) : 0;
      });

      const [jobs, setJobs] = useState(() => {
        const saved = localStorage.getItem('app_jobs_v4');
        return saved ? JSON.parse(saved) : [];
      });

      const [myEvents, setMyEvents] = useState(() => {
        const saved = localStorage.getItem('app_events_v4');
        return saved ? JSON.parse(saved) : [];
      });

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const shareParam = params.get('s');
        if (shareParam) {
          const decoded = decodeShareData(shareParam);
          if (decoded && Array.isArray(decoded.events)) {
            setSharedEvents(decoded.events);
            if (decoded.targetDate) {
              setCurrentDate(new Date(decoded.targetDate));
              setSelectedDate(decoded.targetDate);
            }
          }
        }
      }, []);

      const isViewingShared = sharedEvents !== null;
      const events = isViewingShared ? sharedEvents : myEvents;
      const setEvents = (updater) => {
        if (isViewingShared) return;
        setMyEvents(updater);
      };

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [subItemInput, setSubItemInput] = useState({ name: '', price: '' });
      const [repeatOption, setRepeatOption] = useState('none');
      
      const [newEvent, setNewEvent] = useState({
        title: '', date: todayStr, endDate: todayStr, isAllDay: false,
        startTime: '09:00', endTime: '17:00', color: '#3B82F6',
        amount: 0, isExpense: true, isShift: false, jobId: '',
        subItems: [], memo: '', completed: false
      });

      const [newJob, setNewJob] = useState({
        name: '', hourlyWage: 1100, transportFee: 0, autoBreak: true, nightBonus: true, color: '#10B981'
      });
      const [backupText, setBackupText] = useState('');

      useEffect(() => { localStorage.setItem('app_base_balance', String(baseBalance)); }, [baseBalance]);
      useEffect(() => { localStorage.setItem('app_jobs_v4', JSON.stringify(jobs)); }, [jobs]);
      useEffect(() => { localStorage.setItem('app_events_v4', JSON.stringify(myEvents)); }, [myEvents]);

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
      };

      const handleTouchEnd = (e) => {
        if (touchStartX.current === null || touchStartY.current === null) return;
        const diffX = e.changedTouches[0].clientX - touchStartX.current;
        const diffY = e.changedTouches[0].clientY - touchStartY.current;
        touchStartX.current = null;
        touchStartY.current = null;

        if (Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
          if (viewMode === 'month') {
            const y = currentDate.getFullYear();
            const m = currentDate.getMonth();
            setCurrentDate(new Date(y, diffX < 0 ? m + 1 : m - 1, 1));
          } else if (viewMode === 'day') {
            handleMoveDay(diffX < 0 ? 1 : -1);
          }
        }
      };

      const handleMoveDay = (diff) => {
        const nextStr = shiftDateStr(selectedDate, diff);
        setSelectedDate(nextStr);
        const [ny, nm] = nextStr.split('-').map(Number);
        if (ny !== currentDate.getFullYear() || nm !== currentDate.getMonth() + 1) {
          setCurrentDate(new Date(ny, nm - 1, 1));
        }
      };

      const openCreateModal = () => {
        setEditingId(null);
        setRepeatOption('none');
        setSubItemInput({ name: '', price: '' });
        setNewEvent({
          title: '', date: selectedDate, endDate: selectedDate, isAllDay: false,
          startTime: '09:00', endTime: '17:00', color: '#3B82F6',
          amount: 0, isExpense: true, isShift: false, jobId: '',
          subItems: [], memo: '', completed: false
        });
        setIsModalOpen(true);
      };

      const openEditModal = (ev) => {
        if (isViewingShared) return;
        setEditingId(ev.id);
        setRepeatOption('none');
        setSubItemInput({ name: '', price: '' });
        setNewEvent({
          ...ev,
          endDate: ev.endDate || ev.date,
          isAllDay: !!ev.isAllDay,
          subItems: ev.subItems || [],
          jobId: ev.shiftMeta?.jobId || ev.jobId || ''
        });
        setIsModalOpen(true);
      };

      const calculateShiftDetails = (startTime, endTime, job) => {
        if (!startTime || !endTime || !job) return { pay: 0, workHours: 0, nightHours: 0, breakMins: 0, transport: 0 };
        const [startH, startM] = startTime.split(':').map(Number);
        const [endH, endM] = endTime.split(':').map(Number);
        let startMins = startH * 60 + startM;
        let endMins = endH * 60 + endM;
        if (endMins <= startMins) endMins += 24 * 60;

        const totalMins = endMins - startMins;
        const totalHours = totalMins / 60;

        let nightMins = 0;
        if (job.nightBonus) {
          const overlap = (a1, a2, b1, b2) => Math.max(0, Math.min(a2, b2) - Math.max(a1, b1));
          nightMins += overlap(startMins, endMins, 0, 5 * 60);
          nightMins += overlap(startMins, endMins, 22 * 60, 29 * 60);
        }

        let breakMins = 0;
        if (job.autoBreak) {
          if (totalHours > 8) breakMins = 60;
          else if (totalHours > 6) breakMins = 45;
        }

        const effectiveTotalMins = Math.max(0, totalMins - breakMins);
        const effectiveNightMins = Math.min(nightMins, effectiveTotalMins);
        const effectiveNormalMins = effectiveTotalMins - effectiveNightMins;

        const normalPay = (effectiveNormalMins / 60) * job.hourlyWage;
        const nightPay = (effectiveNightMins / 60) * job.hourlyWage * 1.25;
        const wagePay = Math.round(normalPay + nightPay);
        const transport = Number(job.transportFee || 0);

        return {
          pay: wagePay + transport,
          wagePay,
          workHours: Math.round((effectiveTotalMins / 60) * 100) / 100,
          nightHours: Math.round((effectiveNightMins / 60) * 100) / 100,
          breakMins,
          transport
        };
      };

      const handleAddSubItem = () => {
        if (!subItemInput.name || !subItemInput.price) return;
        const updatedSub = [...newEvent.subItems, { id: Date.now(), name: subItemInput.name, price: Number(subItemInput.price) }];
        const sum = updatedSub.reduce((acc, item) => acc + item.price, 0);
        setNewEvent({ ...newEvent, subItems: updatedSub, amount: sum });
        setSubItemInput({ name: '', price: '' });
      };

      const handleRemoveSubItem = (id) => {
        const updatedSub = newEvent.subItems.filter(item => item.id !== id);
        const sum = updatedSub.reduce((acc, item) => acc + item.price, 0);
        setNewEvent({ ...newEvent, subItems: updatedSub, amount: sum });
      };

      const handleSaveEvent = (e) => {
        e.preventDefault();
        let calculatedAmount = Number(newEvent.amount);
        let title = newEvent.title;
        let isExpense = newEvent.isExpense;
        let color = newEvent.color;
        let shiftMeta = null;

        const validEndDate = newEvent.endDate && newEvent.endDate >= newEvent.date ? newEvent.endDate : newEvent.date;

        if (newEvent.isShift) {
          const selectedJob = jobs.find(j => j.id === newEvent.jobId);
          if (!selectedJob) {
            alert('勤務先を選択してください。未登録の場合は設定タブから追加できます。');
            return;
          }
          const details = calculateShiftDetails(newEvent.startTime, newEvent.endTime, selectedJob);
          calculatedAmount = details.pay;
          if (!title) title = `${selectedJob.name}`;
          isExpense = false;
          color = selectedJob.color;
          shiftMeta = {
            jobId: selectedJob.id,
            jobName: selectedJob.name,
            workHours: details.workHours,
            nightHours: details.nightHours,
            transport: details.transport,
            breakMins: details.breakMins
          };
        }

        if (editingId) {
          const updatedEvents = myEvents.map(ev => {
            if (ev.id !== editingId) return ev;
            return {
              ...newEvent,
              id: editingId,
              endDate: validEndDate,
              title: title || '無題の予定',
              amount: calculatedAmount,
              isExpense,
              color,
              shiftMeta
            };
          });
          setEvents(updatedEvents);
          setIsModalOpen(false);
          setEditingId(null);
          return;
        }

        const spanDays = Math.round((new Date(validEndDate) - new Date(newEvent.date)) / (1000 * 60 * 60 * 24));
        const targetStartDates = [newEvent.date];
        const baseDate = new Date(newEvent.date);

        if (repeatOption === 'weekly_4') {
          for (let i = 1; i <= 3; i++) {
            const d = new Date(baseDate);
            d.setDate(baseDate.getDate() + i * 7);
            targetStartDates.push(d.toISOString().split('T')[0]);
          }
        } else if (repeatOption === 'monthly_3') {
          for (let i = 1; i <= 2; i++) {
            const d = new Date(baseDate);
            d.setMonth(baseDate.getMonth() + i);
            targetStartDates.push(d.toISOString().split('T')[0]);
          }
        }

        const repeatGroupId = targetStartDates.length > 1 ? `grp_${Date.now()}` : null;

        const createdItems = targetStartDates.map((dStr, idx) => ({
          ...newEvent,
          id: `${Date.now()}_${idx}`,
          repeatGroupId,
          date: dStr,
          endDate: shiftDateStr(dStr, spanDays),
          title: title || '無題の予定',
          amount: calculatedAmount,
          isExpense,
          color,
          shiftMeta
        }));

        setEvents([...myEvents, ...createdItems]);
        setIsModalOpen(false);
        setRepeatOption('none');
        setSubItemInput({ name: '', price: '' });
      };

      const toggleComplete = (id) => {
        if (isViewingShared) return;
        setEvents(myEvents.map(ev => ev.id === id ? { ...ev, completed: !ev.completed } : ev));
      };

      const deleteEvent = (targetEv) => {
        if (isViewingShared) return;
        if (targetEv.repeatGroupId) {
          const sameGroupCount = myEvents.filter(e => e.repeatGroupId === targetEv.repeatGroupId).length;
          if (sameGroupCount > 1) {
            const deleteAll = window.confirm(
              `繰り返し予定（全${sameGroupCount}件）です。\n「OK」を押すと関連する繰り返し予定をすべて一括削除します。\n（「キャンセル」で削除を中止）`
            );
            if (deleteAll) {
              setEvents(myEvents.filter(ev => ev.repeatGroupId !== targetEv.repeatGroupId));
            }
            return;
          }
        }
        if (window.confirm('この予定を削除しますか？')) {
          setEvents(myEvents.filter(ev => ev.id !== targetEv.id));
        }
      };

      const createShareLink = () => {
        const y = currentDate.getFullYear();
        const m = currentDate.getMonth() + 1;
        const monthPrefix = `${y}-${String(m).padStart(2, '0')}`;

        const targetList = myEvents.filter(ev => {
          if (shareOptions.scope === 'day') return isEventOnDate(ev, selectedDate);
          const startM = ev.date.slice(0, 7);
          const endM = (ev.endDate || ev.date).slice(0, 7);
          return monthPrefix >= startM && monthPrefix <= endM;
        });

        const sanitized = targetList.map(ev => ({
          id: ev.id,
          date: ev.date,
          endDate: ev.endDate || ev.date,
          isAllDay: !!ev.isAllDay,
          startTime: ev.startTime,
          endTime: ev.endTime,
          color: ev.color,
          title: shareOptions.maskTitle ? (ev.isShift ? 'バイト' : '予定あり') : ev.title,
          amount: shareOptions.hideMoney ? 0 : ev.amount,
          isExpense: ev.isExpense,
          isShift: ev.isShift,
          memo: shareOptions.hideMemo ? '' : ev.memo,
          subItems: (shareOptions.hideMoney || shareOptions.hideMemo) ? [] : ev.subItems,
          completed: ev.completed
        }));

        const payload = {
          targetDate: shareOptions.scope === 'day' ? selectedDate : `${monthPrefix}-01`,
          events: sanitized
        };

        const encoded = encodeShareData(payload);
        const baseUrl = window.location.origin + window.location.pathname;
        setGeneratedShareUrl(`${baseUrl}?s=${encoded}`);
      };

      const copyShareUrl = () => {
        if (!generatedShareUrl) return;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(generatedShareUrl);
          alert('共有URLをコピーしました！');
        }
      };

      const importSharedToMine = () => {
        if (!sharedEvents) return;
        if (window.confirm(`共有された ${sharedEvents.length} 件の予定を自分のカレンダーに追加しますか？`)) {
          const imported = sharedEvents.map((ev, i) => ({
            ...ev,
            id: `imported_${Date.now()}_${i}`
          }));
          setMyEvents([...myEvents, ...imported]);
          exitShareMode();
          alert('自分のカレンダーに取り込みました！');
        }
      };

      const exitShareMode = () => {
        setSharedEvents(null);
        window.history.replaceState({}, document.title, window.location.pathname);
      };

      const addJob = () => {
        if (!newJob.name) return;
        setJobs([...jobs, { ...newJob, id: Date.now().toString() }]);
        setNewJob({ name: '', hourlyWage: 1100, transportFee: 0, autoBreak: true, nightBonus: true, color: '#10B981' });
      };

      const deleteJob = (id) => {
        setJobs(jobs.filter(j => j.id !== id));
      };

      const exportBackup = () => {
        const data = JSON.stringify({ baseBalance, jobs, events: myEvents });
        setBackupText(data);
        if (navigator.clipboard) {
          navigator.clipboard.writeText(data);
          alert('バックアップデータをクリップボードにコピーしました！');
        }
      };

      const importBackup = () => {
        try {
          const parsed = JSON.parse(backupText);
          if (parsed.jobs && parsed.events) {
            if (typeof parsed.baseBalance === 'number') setBaseBalance(parsed.baseBalance);
            setJobs(parsed.jobs);
            setMyEvents(parsed.events);
            alert('データを復元しました！');
            setBackupText('');
          } else {
            alert('データ形式が正しくありません。');
          }
        } catch (err) {
          alert('読み込みに失敗しました。');
        }
      };

      const getDaysInMonth = (date) => {
        const year = date.getFullYear();
        const month = date.getMonth();
        const days = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();
        return { days, firstDay };
      };

      const monthData = getDaysInMonth(currentDate);
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;

      const monthlyFinanceEvents = events.filter(ev => {
        const evDate = new Date(ev.date);
        return evDate.getFullYear() === year && evDate.getMonth() + 1 === month;
      }).sort((a, b) => a.date.localeCompare(b.date) || (a.isAllDay ? -1 : 1) || a.startTime.localeCompare(b.startTime));

      const monthlyStats = monthlyFinanceEvents.reduce((acc, ev) => {
        if (ev.isExpense) {
          acc.expense += ev.amount;
          if (ev.completed) acc.confirmedExpense += ev.amount;
        } else {
          acc.income += ev.amount;
          if (ev.completed) acc.confirmedIncome += ev.amount;
        }
        return acc;
      }, { income: 0, expense: 0, confirmedIncome: 0, confirmedExpense: 0 });

      const allTimeStats = myEvents.reduce((acc, ev) => {
        const diff = ev.isExpense ? -ev.amount : ev.amount;
        if (ev.completed) acc.confirmedNet += diff;
        acc.projectedNet += diff;
        return acc;

                </div>

                <div className="bg-white p-4 rounded-xl shadow">
                  <h2 className="text-sm font-bold mb-3">💼 バイト先・勤務先設定</h2>
                  {jobs.length === 0 ? (
                    <div className="text-xs text-gray-400 bg-gray-50 p-3 rounded-lg mb-3 text-center">
                      勤務先はまだ登録されていません
                    </div>
                  ) : (
                    <div className="space-y-2 mb-4">
                      {jobs.map(j => (
                        <div key={j.id} className="flex justify-between items-center p-2.5 bg-gray-50 rounded-lg">
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="w-3 h-3 rounded-full" style={{ backgroundColor: j.color }} />
                              <span className="font-bold text-xs">{j.name}</span>
                            </div>
                            <div className="text-[10px] text-gray-500 mt-0.5 ml-5">
                              時給: {j.hourlyWage}円 / 交通費: {j.transportFee || 0}円 / 休憩控除: {j.autoBreak ? 'ON' : 'OFF'} / 深夜割増: {j.nightBonus !== false ? 'ON' : 'OFF'}
                            </div>
                          </div>
                          <button onClick={() => deleteJob(j.id)} className="text-xs text-red-500">削除</button>
                        </div>
                      ))}
                    </div>
                  )}

                  <div className="border-t pt-3 space-y-2 text-xs">
                    <div className="font-bold text-gray-600">新しい勤務先を追加</div>
                    <input type="text" placeholder="勤務先名（例：カフェ）" value={newJob.name} onChange={e => setNewJob({ ...newJob, name: e.target.value })} className="w-full p-2 border rounded" />
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[10px] text-gray-400">時給 (円)</label>
                        <input type="number" value={newJob.hourlyWage} onChange={e => setNewJob({ ...newJob, hourlyWage: Number(e.target.value) })} className="w-full p-2 border rounded" />
                      </div>
                      <div>
                        <label className="text-[10px] text-gray-400">1回あたり交通費 (円)</label>
                        <input type="number" value={newJob.transportFee} onChange={e => setNewJob({ ...newJob, transportFee: Number(e.target.value) })} className="w-full p-2 border rounded" />
                      </div>
                    </div>
                    <div className="space-y-1.5 pt-1">
                      <label className="flex items-center space-x-1.5 cursor-pointer">
                        <input type="checkbox" checked={newJob.autoBreak} onChange={e => setNewJob({ ...newJob, autoBreak: e.target.checked })} />
                        <span>6h超で45分・8h超で60分休憩を自動控除</span>
                      </label>
                      <div className="flex items-center justify-between">
                        <label className="flex items-center space-x-1.5 cursor-pointer">
                          <input type="checkbox" checked={newJob.nightBonus} onChange={e => setNewJob({ ...newJob, nightBonus: e.target.checked })} />
                          <span>深夜割増（22:00〜翌5:00は時給1.25倍）</span>
                        </label>
                        <input type="color" value={newJob.color} onChange={e => setNewJob({ ...newJob, color: e.target.value })} className="w-8 h-7 p-0 border rounded" />
                      </div>
                    </div>
                    <button onClick={addJob} className="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-bold mt-2">勤務先を追加</button>
                  </div>
                </div>

                <div className="bg-white p-4 rounded-xl shadow space-y-3 text-xs">
                  <h2 className="text-sm font-bold">💾 データのバックアップ・復元</h2>
                  <button onClick={exportBackup} className="w-full bg-gray-800 text-white py-2 rounded-lg font-bold">
                    現在のデータを書き出し＆コピー
                  </button>
                  <textarea
                    placeholder="ここにバックアップ文字列を貼り付けて復元"
                    value={backupText}
                    onChange={e => setBackupText(e.target.value)}
                    className="w-full p-2 border rounded h-20 text-[10px] font-mono"
                  />
                  <button onClick={importBackup} className="w-full bg-indigo-50 text-indigo-700 border border-indigo-200 py-2 rounded-lg font-bold">
                    貼り付けたデータから復元する
                  </button>
                </div>
              </div>
            )}
          </main>

          {!isViewingShared && (
            <button
              onClick={openCreateModal}
              className="fixed bottom-20 right-5 w-14 h-14 bg-indigo-600 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-indigo-700 z-20 text-3xl font-bold"
            >
              ＋
            </button>
          )}

          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 grid grid-cols-5 z-10 text-[10px]">
            <button onClick={() => setViewMode('month')} className={`py-2.5 flex flex-col items-center ${viewMode === 'month' ? 'text-indigo-600 font-bold' : 'text-gray-400'}`}>
              <span className="text-base mb-0.5">📅</span>月表示
            </button>
            <button onClick={() => setViewMode('day')} className={`py-2.5 flex flex-col items-center ${viewMode === 'day' ? 'text-indigo-600 font-bold' : 'text-gray-400'}`}>
              <span className="text-base mb-0.5">⏰</span>日詳細
            </button>
            <button onClick={() => setViewMode('finance')} className={`py-2.5 flex flex-col items-center ${viewMode === 'finance' ? 'text-indigo-600 font-bold' : 'text-gray-400'}`}>
              <span className="text-base mb-0.5">💰</span>収支
            </button>
            <button onClick={() => setViewMode('search')} className={`py-2.5 flex flex-col items-center ${viewMode === 'search' ? 'text-indigo-600 font-bold' : 'text-gray-400'}`}>
              <span className="text-base mb-0.5">🔍</span>検索
            </button>
            <button onClick={() => setViewMode('settings')} className={`py-2.5 flex flex-col items-center ${viewMode === 'settings' ? 'text-indigo-600 font-bold' : 'text-gray-400'}`}>
              <span className="text-base mb-0.5">⚙️</span>設定
            </button>
          </nav>

          {isShareModalOpen && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center">
              <div className="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-gray-800">🔗 予定の共有リンク作成</h3>
                  <button onClick={() => setIsShareModalOpen(false)} className="text-gray-400 text-lg">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-gray-600 mb-1">1. 共有する範囲</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setShareOptions({ ...shareOptions, scope: 'month' })}
                        className={`p-2 rounded border font-bold ${shareOptions.scope === 'month' ? 'bg-indigo-50 border-indigo-600 text-indigo-700' : 'text-gray-500'}`}
                      >
                        {year}年{month}月 全体
                      </button>
                      <button
                        type="button"
                        onClick={() => setShareOptions({ ...shareOptions, scope: 'day' })}
                        className={`p-2 rounded border font-bold ${shareOptions.scope === 'day' ? 'bg-indigo-50 border-indigo-600 text-indigo-700' : 'text-gray-500'}`}
                      >
                        選択日のみ ({selectedDate.slice(5)})
                      </button>
                    </div>
                  </div>

                  <div className="bg-gray-50 p-3 rounded-lg space-y-2">
                    <div className="font-bold text-gray-600">2. プライバシー保護オプション</div>
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={shareOptions.hideMoney}
                        onChange={e => setShareOptions({ ...shareOptions, hideMoney: e.target.checked })}
                      />
                      <span>💰 給料・支出金額を隠す（0円にする）</span>
                    </label>
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={shareOptions.hideMemo}
                        onChange={e => setShareOptions({ ...shareOptions, hideMemo: e.target.checked })}
                      />
                      <span>📝 メモ・買い物内訳を隠す</span>
                    </label>
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={shareOptions.maskTitle}
                        onChange={e => setShareOptions({ ...shareOptions, maskTitle: e.target.checked })}
                      />
                      <span>🙈 予定名を隠す（「予定あり / バイト」に置換）</span>
                    </label>
                  </div>

                  <button
                    type="button"
                    onClick={createShareLink}
                    className="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold hover:bg-indigo-700"
                  >
                    共有URLを生成する
                  </button>

                  {generatedShareUrl && (
                    <div className="space-y-2 pt-2 border-t">
                      <div className="text-[11px] font-bold text-green-600">✅ 共有URLが完成しました！</div>
                      <input
                        type="text"
                        readOnly
                        value={generatedShareUrl}
                        className="w-full p-2 border rounded bg-gray-50 text-[10px] font-mono"
                      />
                      <button
                        type="button"
                        onClick={copyShareUrl}
                        className="w-full bg-gray-800 text-white py-2.5 rounded-xl font-bold"
                      >
                        URLをコピーして送る
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {isModalOpen && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center">
              <div className="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-gray-800">
                    {editingId ? '✏️ 予定・収支の編集' : '予定・収支の追加'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 text-lg">✕</button>
                </div>

                <form onSubmit={handleSaveEvent} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-gray-500 mb-1">開始日</label>
                      <input
                        type="date"
                        value={newEvent.date}
                        onChange={e => {
                          const nextStart = e.target.value;
                          const nextEnd = !newEvent.endDate || newEvent.endDate < nextStart ? nextStart : newEvent.endDate;
                          setNewEvent({ ...newEvent, date: nextStart, endDate: nextEnd });
                        }}
                        className="w-full p-2 border rounded"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-gray-500 mb-1">終了日（日またぎ可）</label>
                      <input
                        type="date"
                        value={newEvent.endDate || newEvent.date}
                        min={newEvent.date}
                        onChange={e => setNewEvent({ ...newEvent, endDate: e.target.value })}
                        className="w-full p-2 border rounded"
                        required
                      />
                    </div>
                  </div>

                  {!editingId && (
                    <div>
                      <label className="block text-gray-500 mb-1">繰り返し一括登録</label>
                      <select value={repeatOption} onChange={e => setRepeatOption(e.target.value)} className="w-full p-2 border rounded">
                        <option value="none">今回のみ（1回）</option>
                        <option value="weekly_4">毎週（4週間分）</option>
                        <option value="monthly_3">毎月（3ヶ月分）</option>
                      </select>
                    </div>
                  )}

                  <div className="flex items-center space-x-2 bg-indigo-50 p-2.5 rounded-lg">
                    <input
                      type="checkbox"
                      id="isShift"
                      checked={newEvent.isShift}
                      onChange={e => setNewEvent({ ...newEvent, isShift: e.target.checked, isAllDay: false })}
                    />
                    <label htmlFor="isShift" className="font-bold text-indigo-900 cursor-pointer">💼 アルバイトのシフトとして登録</label>
                  </div>

                  {newEvent.isShift ? (
                    jobs.length === 0 ? (
                      <div className="bg-amber-50 border border-amber-200 p-3 rounded-lg text-amber-800 space-y-2">
                        <div>勤務先がまだ登録されていません。先に設定タブから勤務先（時給）を登録してください。</div>
                        <button
                          type="button"
                          onClick={() => { setIsModalOpen(false); setViewMode('settings'); }}
                          className="bg-amber-600 text-white px-3 py-1.5 rounded font-bold"
                        >
                          設定画面へ移動する
                        </button>
                      </div>
                    ) : (
                      <div>
                        <label className="block text-gray-500 mb-1">勤務先を選択</label>
                        <select value={newEvent.jobId} onChange={e => setNewEvent({ ...newEvent, jobId: e.target.value })} className="w-full p-2 border rounded" required>
                          <option value="">選択してください</option>
                          {jobs.map(j => <option key={j.id} value={j.id}>{j.name} （時給:{j.hourlyWage}円 / 交通費:{j.transportFee || 0}円）</option>)}
                        </select>
                      </div>
                    )
                  ) : (
                    <>
                      <div>
                        <label className="block text-gray-500 mb-1">タイトル</label>
                        <input type="text" placeholder="例：大学講義、1泊2日旅行、家賃引き落とし" value={newEvent.title} onChange={e => setNewEvent({ ...newEvent, title: e.target.value })} className="w-full p-2 border rounded" required />
                      </div>

                      <div>
                        <label className="block text-gray-500 mb-1">カテゴリ色分け</label>
                        <div className="flex space-x-2 overflow-x-auto no-scrollbar py-1">
                          {COLOR_PALETTE.map(c => (
                            <button
                              type="button"
                              key={c.color}
                              onClick={() => setNewEvent({ ...newEvent, color: c.color })}
                              className={`px-2.5 py-1 rounded-full text-[10px] font-bold text-white whitespace-nowrap flex items-center space-x-1 ${newEvent.color === c.color ? 'ring-2 ring-offset-1 ring-gray-800' : 'opacity-75'}`}
                              style={{ backgroundColor: c.color }}
                            >
                              <span>{c.name}</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    </>
                  )}

                  {!newEvent.isShift && (
                    <div className="flex items-center space-x-2">
                      <input
                        type="checkbox"
                        id="isAllDay"
                        checked={newEvent.isAllDay}
                        onChange={e => setNewEvent({ ...newEvent, isAllDay: e.target.checked })}
                      />
                      <label htmlFor="isAllDay" className="text-gray-700 font-bold cursor-pointer">終日（時間指定なし）</label>
                    </div>
                  )}

                  {!newEvent.isAllDay && (
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-gray-500 mb-1">開始時間</label>
                        <input type="time" value={newEvent.startTime} onChange={e => setNewEvent({ ...newEvent, startTime: e.target.value })} className="w-full p-2 border rounded" />
                      </div>
                      <div>
                        <label className="block text-gray-500 mb-1">終了時間</label>
                        <input type="time" value={newEvent.endTime} onChange={e => setNewEvent({ ...newEvent, endTime: e.target.value })} className="w-full p-2 border rounded" />
                      </div>
                    </div>
                  )}

                  {!newEvent.isShift && (
                    <div className="space-y-2 border-t pt-2">
                      <div className="flex items-center justify-between">
                        <label className="text-gray-500 font-bold">金額・予算試算</label>
                        <div className="flex space-x-3">
                          <label className="flex items-center space-x-1 cursor-pointer">
                            <input type="radio" name="exp" checked={newEvent.isExpense} onChange={() => setNewEvent({ ...newEvent, isExpense: true })} />
                            <span className="text-red-600 font-bold">支出</span>
                          </label>
                          <label className="flex items-center space-x-1 cursor-pointer">
                            <input type="radio" name="exp" checked={!newEvent.isExpense} onChange={() => setNewEvent({ ...newEvent, isExpense: false })} />
                            <span className="text-green-600 font-bold">収入</span>
                          </label>
                        </div>
                      </div>
                      <input type="number" placeholder="合計金額（0で金額なし）" value={newEvent.amount || ''} onChange={e => setNewEvent({ ...newEvent, amount: Number(e.target.value) })} className="w-full p-2 border rounded font-bold" />

                      <div className="bg-gray-50 p-2.5 rounded-lg space-y-2">
                        <div className="text-[10px] font-bold text-gray-500">内訳を追加して自動合計する（任意）</div>
                        <div className="flex space-x-1.5">
                          <input type="text" placeholder="項目（例：交通費）" value={subItemInput.name} onChange={e => setSubItemInput({ ...subItemInput, name: e.target.value })} className="flex-1 p-1.5 border rounded bg-white" />
                          <input type="number" placeholder="金額" value={subItemInput.price} onChange={e => setSubItemInput({ ...subItemInput, price: e.target.value })} className="w-20 p-1.5 border rounded bg-white" />
                          <button type="button" onClick={handleAddSubItem} className="bg-gray-700 text-white px-2.5 rounded font-bold">追加</button>
                        </div>
                        {newEvent.subItems.length > 0 && (
                          <div className="space-y-1 pt-1">
                            {newEvent.subItems.map(sub => (
                              <div key={sub.id} className="flex justify-between items-center text-[11px] bg-white px-2 py-1 rounded border">
                                <span>{sub.name}</span>
                                <div className="flex items-center space-x-2">
                                  <span className="font-bold">{sub.price.toLocaleString()}円</span>
                                  <button type="button" onClick={() => handleRemoveSubItem(sub.id)} className="text-red-400">✕</button>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block text-gray-500 mb-1">メモ・持ち物リスト</label>
                    <textarea placeholder="メモを残せます" value={newEvent.memo} onChange={e => setNewEvent({ ...newEvent, memo: e.target.value })} className="w-full p-2 border rounded h-14" />
                  </div>

                  <button type="submit" className="w-full bg-indigo-600 text-white p-3 rounded-xl font-bold hover:bg-indigo-700 text-sm">
                    {editingId ? '変更を保存する' : '登録する'}
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
