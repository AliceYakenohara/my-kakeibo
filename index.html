<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>予定＆家計簿 Calm UI</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      font-feature-settings: "palt";
      -webkit-font-smoothing: antialiased;
    }
    input, textarea, select { user-select: auto; -webkit-user-select: auto; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-stone-200/70 min-h-screen text-slate-800 flex justify-center">
  <div id="root" class="w-full max-w-md bg-stone-50 min-h-screen flex flex-col shadow-xl border-x border-stone-200/80"></div>

  <script>
    window.onerror = function(msg, url, line) {
      var root = document.getElementById('root');
      if (root && !root.innerHTML) {
        root.innerHTML = '<div style="padding:20px;color:#B91C1C;font-size:12px;">エラーが発生しました: ' + msg + ' (Line: ' + line + ')</div>';
      }
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 落ち着いたダスティトーンのカテゴリカラー
    const COLOR_PALETTE = [
      { name: '仕事・学業', color: '#476C9B' },
      { name: '遊び・交際', color: '#B85D7A' },
      { name: '食費・買物', color: '#C28540' },
      { name: 'バイト・収入', color: '#4A8B71' },
      { name: '固定費・重要', color: '#78689E' },
      { name: 'その他', color: '#64748B' }
    ];

    // 共有予定取り込み用の落ち着いた識別カラー
    const IMPORT_COLOR_PRESETS = [
      { name: 'セージグリーン', color: '#3E7B67' },
      { name: 'ダスティローズ', color: '#A8556F' },
      { name: 'テラコッタ', color: '#B56547' },
      { name: 'スレートブルー', color: '#486B8A' },
      { name: 'モーブパープル', color: '#735E8C' },
      { name: '元の色のまま', color: 'ORIGINAL' }
    ];

    const getJapaneseHolidayName = (dateStr) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const dow = dt.getDay();

      const checkBasicHoliday = (year, month, day) => {
        const w = new Date(year, month - 1, day).getDay();
        const nthMonday = Math.floor((day - 1) / 7) + 1;

        if (month === 1 && day === 1) return '元日';
        if (month === 1 && w === 1 && nthMonday === 2) return '成人の日';
        if (month === 2 && day === 11) return '建国記念の日';
        if (month === 2 && day === 23) return '天皇誕生日';
        const vernal = Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
        if (month === 3 && day === vernal) return '春分の日';
        if (month === 4 && day === 29) return '昭和の日';
        if (month === 5 && day === 3) return '憲法記念日';
        if (month === 5 && day === 4) return 'みどりの日';
        if (month === 5 && day === 5) return 'こどもの日';
        if (month === 7 && w === 1 && nthMonday === 3) return '海の日';
        if (month === 8 && day === 11) return '山の日';
        if (month === 9 && w === 1 && nthMonday === 3) return '敬老の日';
        const autumnal = Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
        if (month === 9 && day === autumnal) return '秋分の日';
        if (month === 10 && w === 1 && nthMonday === 2) return 'スポーツの日';
        if (month === 11 && day === 3) return '文化の日';
        if (month === 11 && day === 23) return '勤労感謝の日';
        return null;
      };

      const direct = checkBasicHoliday(y, m, d);
      if (direct) return direct;

      if (dow !== 0) {
        let checkDt = new Date(y, m - 1, d - 1);
        while (true) {
          const h = checkBasicHoliday(checkDt.getFullYear(), checkDt.getMonth() + 1, checkDt.getDate());
          if (!h) break;
          if (checkDt.getDay() === 0) return '振替休日';
          checkDt.setDate(checkDt.getDate() - 1);
        }
      }
      return null;
    };

    const encodeShareData = (obj) => {
      const json = JSON.stringify(obj);
      const bytes = new TextEncoder().encode(json);
      let binString = '';
      bytes.forEach((b) => { binString += String.fromCharCode(b); });
      return btoa(binString).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    };

    const decodeShareData = (str) => {
      try {
        let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) base64 += '=';
        const binString = atob(base64);
        const bytes = new Uint8Array(binString.length);
        for (let i = 0; i < binString.length; i++) bytes[i] = binString.charCodeAt(i);
        const json = new TextDecoder().decode(bytes);
        return JSON.parse(json);
      } catch (e) {
        return null;
      }
    };

    const shiftDateStr = (dateStr, diffDays) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + diffDays);
      const ny = dt.getFullYear();
      const nm = String(dt.getMonth() + 1).padStart(2, '0');
      const nd = String(dt.getDate()).padStart(2, '0');
      return `${ny}-${nm}-${nd}`;
    };

    const isEventOnDate = (ev, dateStr) => {
      const start = ev.date;
      const end = ev.endDate && ev.endDate >= start ? ev.endDate : start;
      return dateStr >= start && dateStr <= end;
    };

    const downloadICS = (ev) => {
      const startClean = ev.date.replace(/-/g, '');
      const endClean = (ev.endDate || ev.date).replace(/-/g, '');
      let dtStartLine = '';
      let dtEndLine = '';

      if (ev.isAllDay) {
        const nextDayAfterEnd = shiftDateStr(ev.endDate || ev.date, 1).replace(/-/g, '');
        dtStartLine = `DTSTART;VALUE=DATE:${startClean}`;
        dtEndLine = `DTEND;VALUE=DATE:${nextDayAfterEnd}`;
      } else {
        const sTime = (ev.startTime || '09:00').replace(':', '') + '00';
        const eTime = (ev.endTime || '10:00').replace(':', '') + '00';
        dtStartLine = `DTSTART:${startClean}T${sTime}`;
        dtEndLine = `DTEND:${endClean}T${eTime}`;
      }

      const descParts = [];
      if (ev.amount > 0) {
        descParts.push(`金額: ${ev.isExpense ? '-' : '+'}${ev.amount.toLocaleString()}円`);
      }
      if (ev.memo) {
        descParts.push(ev.memo);
      }
      const desc = descParts.join(' / ');
      const crlf = String.fromCharCode(13, 10);

      const icsContent = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//ScheduleKakeibo//JP',
        'BEGIN:VEVENT',
        `UID:${ev.id}@schedule-kakeibo`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
        dtStartLine,
        dtEndLine,
        `SUMMARY:${ev.title}`,
        `DESCRIPTION:${desc}`,
        'END:VEVENT',
        'END:VCALENDAR'
      ].join(crlf);

      const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${ev.title}.ics`;
      a.click();
      URL.revokeObjectURL(url);
    };

    function App() {
      const todayStr = new Date().toISOString().split('T')[0];
      const [currentDate, setCurrentDate] = useState(new Date());
      const [viewMode, setViewMode] = useState('month');
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [financeFilter, setFinanceFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      const touchStartX = useRef(null);
      const touchStartY = useRef(null);

      // 共有リンク閲覧＆取り込み選択用ステート
      const [sharedEvents, setSharedEvents] = useState(null);
      const [isImportModalOpen, setIsImportModalOpen] = useState(false);
      const [selectedImportIds, setSelectedImportIds] = useState([]);
      const [importCustomColor, setImportCustomColor] = useState('#3E7B67');
      const [importBadgeLabel, setImportBadgeLabel] = useState('共有');
      const [importIncludeMoney, setImportIncludeMoney] = useState(false);

      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [shareOptions, setShareOptions] = useState({
        scope: 'month',
        hideMoney: true,
        hideMemo: true,
        maskTitle: false
      });
      const [generatedShareUrl, setGeneratedShareUrl] = useState('');

      const [baseBalance, setBaseBalance] = useState(() => {
        const saved = localStorage.getItem('app_base_balance');
        return saved !== null ? Number(saved) : 0;
      });

      const [jobs, setJobs] = useState(() => {
        const saved = localStorage.getItem('app_jobs_v4');
        return saved ? JSON.parse(saved) : [];
      });

      const [myEvents, setMyEvents] = useState(() => {
        const saved = localStorage.getItem('app_events_v4');
        return saved ? JSON.parse(saved) : [];
      });

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const shareParam = params.get('s');
        if (shareParam) {
          const decoded = decodeShareData(shareParam);
          if (decoded && Array.isArray(decoded.events)) {
            setSharedEvents(decoded.events);
            setSelectedImportIds(decoded.events.map(ev => ev.id));
            if (decoded.targetDate) {
              setCurrentDate(new Date(decoded.targetDate));
              setSelectedDate(decoded.targetDate);
            }
          }
        }
      }, []);

      const isViewingShared = sharedEvents !== null;
      const events = isViewingShared ? sharedEvents : myEvents;
      const setEvents = (updater) => {
        if (isViewingShared) return;
        setMyEvents(updater);
      };

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [subItemInput, setSubItemInput] = useState({ name: '', price: '' });
      const [repeatOption, setRepeatOption] = useState('none');
      
      const [newEvent, setNewEvent] = useState({
        title: '', date: todayStr, endDate: todayStr, isAllDay: false,
        startTime: '09:00', endTime: '17:00', color: '#476C9B',
        amount: 0, isExpense: true, isShift: false, jobId: '',
        subItems: [], memo: '', completed: false
      });

      const [newJob, setNewJob] = useState({
        name: '', hourlyWage: 1100, transportFee: 0, autoBreak: true, nightBonus: true, color: '#4A8B71'
      });
      const [backupText, setBackupText] = useState('');

      useEffect(() => { localStorage.setItem('app_base_balance', String(baseBalance)); }, [baseBalance]);
      useEffect(() => { localStorage.setItem('app_jobs_v4', JSON.stringify(jobs)); }, [jobs]);
      useEffect(() => { localStorage.setItem('app_events_v4', JSON.stringify(myEvents)); }, [myEvents]);

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
      };

      const handleTouchEnd = (e) => {
        if (touchStartX.current === null || touchStartY.current === null) return;
        const diffX = e.changedTouches[0].clientX - touchStartX.current;
        const diffY = e.changedTouches[0].clientY - touchStartY.current;
        touchStartX.current = null;
        touchStartY.current = null;

        if (Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
          if (viewMode === 'month') {
            const y = currentDate.getFullYear();
            const m = currentDate.getMonth();
            setCurrentDate(new Date(y, diffX < 0 ? m + 1 : m - 1, 1));
          } else if (viewMode === 'day') {
            handleMoveDay(diffX < 0 ? 1 : -1);
          }
        }
      };

      const handleMoveDay = (diff) => {
        const nextStr = shiftDateStr(selectedDate, diff);
        setSelectedDate(nextStr);
        const [ny, nm] = nextStr.split('-').map(Number);
        if (ny !== currentDate.getFullYear() || nm !== currentDate.getMonth() + 1) {
          setCurrentDate(new Date(ny, nm - 1, 1));
        }
      };

      const openCreateModal = () => {
        setEditingId(null);
        setRepeatOption('none');
        setSubItemInput({ name: '', price: '' });
        setNewEvent({
          title: '', date: selectedDate, endDate: selectedDate, isAllDay: false,
          startTime: '09:00', endTime: '17:00', color: '#476C9B',
          amount: 0, isExpense: true, isShift: false, jobId: '',
          subItems: [], memo: '', completed: false
        });
        setIsModalOpen(true);
      };

      const openEditModal = (ev) => {
        if (isViewingShared) return;
        setEditingId(ev.id);
        setRepeatOption('none');
        setSubItemInput({ name: '', price: '' });
        setNewEvent({
          ...ev,
          endDate: ev.endDate || ev.date,
          isAllDay: !!ev.isAllDay,
          subItems: ev.subItems || [],
          jobId: ev.shiftMeta?.jobId || ev.jobId || ''
        });
        setIsModalOpen(true);
      };

      const calculateShiftDetails = (startTime, endTime, job) => {
        if (!startTime || !endTime || !job) return { pay: 0, workHours: 0, nightHours: 0, breakMins: 0, transport: 0 };
        const [startH, startM] = startTime.split(':').map(Number);
        const [endH, endM] = endTime.split(':').map(Number);
        let startMins = startH * 60 + startM;
        let endMins = endH * 60 + endM;
        if (endMins <= startMins) endMins += 24 * 60;

        const totalMins = endMins - startMins;
        const totalHours = totalMins / 60;

        let nightMins = 0;
        if (job.nightBonus) {
          const overlap = (a1, a2, b1, b2) => Math.max(0, Math.min(a2, b2) - Math.max(a1, b1));
          nightMins += overlap(startMins, endMins, 0, 5 * 60);
          nightMins += overlap(startMins, endMins, 22 * 60, 29 * 60);
        }

        let breakMins = 0;
        if (job.autoBreak) {
          if (totalHours > 8) breakMins = 60;
          else if (totalHours > 6) breakMins = 45;
        }

        const effectiveTotalMins = Math.max(0, totalMins - breakMins);
        const effectiveNightMins = Math.min(nightMins, effectiveTotalMins);
        const effectiveNormalMins = effectiveTotalMins - effectiveNightMins;

        const normalPay = (effectiveNormalMins / 60) * job.hourlyWage;
        const nightPay = (effectiveNightMins / 60) * job.hourlyWage * 1.25;
        const wagePay = Math.round(normalPay + nightPay);
        const transport = Number(job.transportFee || 0);

        return {
          pay: wagePay + transport,
          wagePay,
          workHours: Math.round((effectiveTotalMins / 60) * 100) / 100,
          nightHours: Math.round((effectiveNightMins / 60) * 100) / 100,
          breakMins,
          transport
        };
      };

      const handleAddSubItem = () => {
        if (!subItemInput.name || !subItemInput.price) return;
        const updatedSub = [...newEvent.subItems, { id: Date.now(), name: subItemInput.name, price: Number(subItemInput.price) }];
        const sum = updatedSub.reduce((acc, item) => acc + item.price, 0);
        setNewEvent({ ...newEvent, subItems: updatedSub, amount: sum });
        setSubItemInput({ name: '', price: '' });
      };

      const handleRemoveSubItem = (id) => {
        const updatedSub = newEvent.subItems.filter(item => item.id !== id);
        const sum = updatedSub.reduce((acc, item) => acc + item.price, 0);
        setNewEvent({ ...newEvent, subItems: updatedSub, amount: sum });
      };

      const handleSaveEvent = (e) => {
        e.preventDefault();
        let calculatedAmount = Number(newEvent.amount);
        let title = newEvent.title;
        let isExpense = newEvent.isExpense;
        let color = newEvent.color;
        let shiftMeta = null;

        const validEndDate = newEvent.endDate && newEvent.endDate >= newEvent.date ? newEvent.endDate : newEvent.date;

        if (newEvent.isShift) {
          const selectedJob = jobs.find(j => j.id === newEvent.jobId);
          if (!selectedJob) {
            alert('勤務先を選択してください。未登録の場合は設定タブから追加できます。');
            return;
          }
          const details = calculateShiftDetails(newEvent.startTime, newEvent.endTime, selectedJob);
          calculatedAmount = details.pay;
          if (!title) title = `${selectedJob.name}`;
          isExpense = false;
          color = selectedJob.color;
          shiftMeta = {
            jobId: selectedJob.id,
            jobName: selectedJob.name,
            workHours: details.workHours,
            nightHours: details.nightHours,
            transport: details.transport,
            breakMins: details.breakMins
          };
        }

        if (editingId) {
          const updatedEvents = myEvents.map(ev => {
            if (ev.id !== editingId) return ev;
            return {
              ...newEvent,
              id: editingId,
              endDate: validEndDate,
              title: title || '無題の予定',
              amount: calculatedAmount,
              isExpense,
              color,
              shiftMeta
            };
          });
          setEvents(updatedEvents);
          setIsModalOpen(false);
          setEditingId(null);
          return;
        }

        const spanDays = Math.round((new Date(validEndDate) - new Date(newEvent.date)) / (1000 * 60 * 60 * 24));
        const targetStartDates = [newEvent.date];
        const baseDate = new Date(newEvent.date);

        if (repeatOption === 'weekly_4') {
          for (let i = 1; i <= 3; i++) {
            const d = new Date(baseDate);
            d.setDate(baseDate.getDate() + i * 7);
            targetStartDates.push(d.toISOString().split('T')[0]);
          }
        } else if (repeatOption === 'monthly_3') {
          for (let i = 1; i <= 2; i++) {
            const d = new Date(baseDate);
            d.setMonth(baseDate.getMonth() + i);
            targetStartDates.push(d.toISOString().split('T')[0]);
          }
        }

        const repeatGroupId = targetStartDates.length > 1 ? `grp_${Date.now()}` : null;

        const createdItems = targetStartDates.map((dStr, idx) => ({
          ...newEvent,
          id: `${Date.now()}_${idx}`,
          repeatGroupId,
          date: dStr,
          endDate: shiftDateStr(dStr, spanDays),
          title: title || '無題の予定',
          amount: calculatedAmount,
          isExpense,
          color,
          shiftMeta
        }));

        setEvents([...myEvents, ...createdItems]);
        setIsModalOpen(false);
        setRepeatOption('none');
        setSubItemInput({ name: '', price: '' });
      };

      const toggleComplete = (id) => {
        if (isViewingShared) return;
        setEvents(myEvents.map(ev => ev.id === id ? { ...ev, completed: !ev.completed } : ev));
      };

      const deleteEvent = (targetEv) => {
        if (isViewingShared) return;
        if (targetEv.repeatGroupId) {
          const sameGroupCount = myEvents.filter(e => e.repeatGroupId === targetEv.repeatGroupId).length;
          if (sameGroupCount > 1) {
            const deleteAll = window.confirm(
              `繰り返し予定（全${sameGroupCount}件）です。\n「OK」を押すと関連する繰り返し予定をすべて一括削除します。\n（「キャンセル」で削除を中止）`
            );
            if (deleteAll) {
              setEvents(myEvents.filter(ev => ev.repeatGroupId !== targetEv.repeatGroupId));
            }
            return;
          }
        }
        if (window.confirm('この予定を削除しますか？')) {
          setEvents(myEvents.filter(ev => ev.id !== targetEv.id));
        }
      };

      const createShareLink = () => {
        const y = currentDate.getFullYear();
        const m = currentDate.getMonth() + 1;
        const monthPrefix = `${y}-${String(m).padStart(2, '0')}`;

        const targetList = myEvents.filter(ev => {
          if (shareOptions.scope === 'day') return isEventOnDate(ev, selectedDate);
          const startM = ev.date.slice(0, 7);
          const endM = (ev.endDate || ev.date).slice(0, 7);
          return monthPrefix >= startM && monthPrefix <= endM;
        });

        const sanitized = targetList.map(ev => ({
          id: ev.id,
          date: ev.date,
          endDate: ev.endDate || ev.date,
          isAllDay: !!ev.isAllDay,
          startTime: ev.startTime,
          endTime: ev.endTime,
          color: ev.color,
          title: shareOptions.maskTitle ? (ev.isShift ? 'バイト' : '予定あり') : ev.title,
          amount: shareOptions.hideMoney ? 0 : ev.amount,
          isExpense: ev.isExpense,
          isShift: ev.isShift,
          memo: shareOptions.hideMemo ? '' : ev.memo,
          subItems: (shareOptions.hideMoney || shareOptions.hideMemo) ? [] : ev.subItems,
          completed: ev.completed
        }));

        const payload = {
          targetDate: shareOptions.scope === 'day' ? selectedDate : `${monthPrefix}-01`,
          events: sanitized
        };

        const encoded = encodeShareData(payload);
        const baseUrl = window.location.origin + window.location.pathname;
        setGeneratedShareUrl(`${baseUrl}?s=${encoded}`);
      };

      const copyShareUrl = () => {
        if (!generatedShareUrl) return;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(generatedShareUrl);
          alert('共有URLをコピーしました！');
        }
      };

      const toggleImportSelection = (id) => {
        if (selectedImportIds.includes(id)) {
          setSelectedImportIds(selectedImportIds.filter(item => item !== id));
        } else {
          setSelectedImportIds([...selectedImportIds, id]);
        }
      };

      const toggleSelectAllImport = () => {
        if (!sharedEvents) return;
        if (selectedImportIds.length === sharedEvents.length) {
          setSelectedImportIds([]);
        } else {
          setSelectedImportIds(sharedEvents.map(ev => ev.id));
        }
      };

      const executeCustomImport = () => {
        if (!sharedEvents || selectedImportIds.length === 0) {
          alert('取り込む予定を1件以上選択してください。');
          return;
        }
        const targets = sharedEvents.filter(ev => selectedImportIds.includes(ev.id));
        const trimmedBadge = importBadgeLabel.trim();

        const imported = targets.map((ev, i) => ({
          ...ev,
          id: `imported_${Date.now()}_${i}`,
          color: importCustomColor === 'ORIGINAL' ? (ev.color || '#3E7B67') : importCustomColor,
          isSharedImport: true,
          sharedBadge: trimmedBadge || '共有',
          amount: importIncludeMoney ? ev.amount : 0,
          subItems: importIncludeMoney ? (ev.subItems || []) : [],
          completed: false
        }));

        setMyEvents([...myEvents, ...imported]);
        setIsImportModalOpen(false);
        exitShareMode();
        alert(`${imported.length} 件の予定を自分のカレンダーに取り込みました！`);
      };

      const exitShareMode = () => {
        setSharedEvents(null);
        setSelectedImportIds([]);
        window.history.replaceState({}, document.title, window.location.pathname);
      };

      const addJob = () => {
        if (!newJob.name) return;
        setJobs([...jobs, { ...newJob, id: Date.now().toString() }]);
        setNewJob({ name: '', hourlyWage: 1100, transportFee: 0, autoBreak: true, nightBonus: true, color: '#4A8B71' });
      };

      const deleteJob = (id) => {
        setJobs(jobs.filter(j => j.id !== id));
      };

      const exportBackup = () => {
        const data = JSON.stringify({ baseBalance, jobs, events: myEvents });
        setBackupText(data);
        if (navigator.clipboard) {
          navigator.clipboard.writeText(data);
          alert('バックアップデータをクリップボードにコピーしました！');
        }
      };

      const importBackup = () => {
        try {
          const parsed = JSON.parse(backupText);
          if (parsed.jobs && parsed.events) {
            if (typeof parsed.baseBalance === 'number') setBaseBalance(parsed.baseBalance);
            setJobs(parsed.jobs);
            setMyEvents(parsed.events);
            alert('データを復元しました！');
            setBackupText('');
          } else {
            alert('データ形式が正しくありません。');
          }
        } catch (err) {
          alert('読み込みに失敗しました。');
        }
      };

      const getDaysInMonth = (date) => {
        const year = date.getFullYear();
        const month = date.getMonth();
        const days = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();
        return { days, firstDay };
      };

      const monthData = getDaysInMonth(currentDate);
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;

      const monthlyFinanceEvents = events.filter(ev => {
        const evDate = new Date(ev.date);
        return evDate.getFullYear() === year && evDate.getMonth() + 1 === month;
      }).sort((a, b) => a.date.localeCompare(b.date) || (a.isAllDay ? -1 : 1) || a.startTime.localeCompare(b.startTime));

      const monthlyStats = monthlyFinanceEvents.reduce((acc, ev) => {
        if (ev.isExpense) {
          acc.expense += ev.amount;
          if (ev.completed) acc.confirmedExpense += ev.amount;
        } else {
          acc.income += ev.amount;
          if (ev.completed) acc.confirmedIncome += ev.amount;
        }
        return acc;
      }, { income: 0, expense: 0, confirmedIncome: 0, confirmedExpense: 0 });

      const allTimeStats = myEvents.reduce((acc, ev) => {
        const diff = ev.isExpense ? -ev.amount : ev.amount;
        if (ev.completed) acc.confirmedNet += diff;
        acc.projectedNet += diff;
        return acc;
      }, { confirmedNet: 0, projectedNet: 0 });

      const currentActualBalance = baseBalance + allTimeStats.confirmedNet;
      const futureProjectedBalance = baseBalance + allTimeStats.projectedNet;

      const jobBreakdown = jobs.map(job => {
        const jobShifts = monthlyFinanceEvents.filter(ev => ev.isShift && ev.shiftMeta?.jobId === job.id);
        const totalPay = jobShifts.reduce((sum, ev) => sum + ev.amount, 0);
        const totalHours = jobShifts.reduce((sum, ev) => sum + (ev.shiftMeta?.workHours || 0), 0);
        return { ...job, count: jobShifts.length, totalPay, totalHours: Math.round(totalHours * 10) / 10 };
      }).filter(j => j.count > 0);

      const dayEvents = events
        .filter(e => isEventOnDate(e, selectedDate))
        .sort((a, b) => a.date.localeCompare(b.date) || (a.isAllDay ? -1 : 1) || a.startTime.localeCompare(b.startTime));

      const dayStats = dayEvents.reduce((acc, ev) => {
        if (ev.date !== selectedDate) return acc;
        if (ev.isExpense) acc.expense += ev.amount;
        else acc.income += ev.amount;
        return acc;
      }, { income: 0, expense: 0 });

      const filteredFinanceList = monthlyFinanceEvents.filter(ev => {
        if (ev.amount <= 0) return false;
        if (financeFilter === 'income') return !ev.isExpense;
        if (financeFilter === 'expense') return ev.isExpense;
        return true;
      });

      const searchResults = searchQuery.trim() === '' ? [] : events.filter(ev => {
        const q = searchQuery.toLowerCase();
        const inTitle = (ev.title || '').toLowerCase().includes(q);
        const inMemo = (ev.memo || '').toLowerCase().includes(q);
        const inBadge = (ev.sharedBadge || '').toLowerCase().includes(q);
        const inSub = (ev.subItems || []).some(s => s.name.toLowerCase().includes(q));
        return inTitle || inMemo || inBadge || inSub;
      }).sort((a, b) => b.date.localeCompare(a.date));

      const selectedHoliday = getJapaneseHolidayName(selectedDate);

      return (
        <div
          className="flex-1 flex flex-col pb-20 relative font-sans"
          onTouchStart={handleTouchStart}
          onTouchEnd={handleTouchEnd}
        >
          {/* 共有閲覧バナー（落ち着いたセージグリーン基調） */}
          {isViewingShared && (
            <div className="bg-emerald-800 text-stone-50 p-3 text-xs flex flex-col space-y-2 shadow-sm z-20 border-b border-emerald-900">
              <div className="flex justify-between items-center">
                <span className="font-bold tracking-wide">共有スケジュールを閲覧中（{sharedEvents.length}件）</span>
                <span className="text-[10px] bg-white/15 px-2 py-0.5 rounded-full">閲覧モード</span>
              </div>
              <div className="flex space-x-2">
                <button
                  onClick={() => {
                    setSelectedImportIds(sharedEvents.map(ev => ev.id));
                    setIsImportModalOpen(true);
                  }}
                  className="flex-1 bg-stone-50 text-emerald-900 font-bold py-1.5 rounded-lg shadow-sm hover:bg-white transition"
                >
                  選択してカレンダーに取り込む
                </button>
                <button
                  onClick={exitShareMode}
                  className="px-3.5 bg-emerald-900/80 hover:bg-emerald-950 text-stone-200 font-bold py-1.5 rounded-lg transition"
                >
                  閉じる
                </button>
              </div>
            </div>
          )}

          {/* ヘッダー（落ち着いたスレートチャコール基調） */}
          <header className={`${isViewingShared ? 'bg-slate-700' : 'bg-slate-800'} text-stone-50 px-4 py-3.5 sticky top-0 z-10 shadow-sm`}>
            <div className="flex justify-between items-center mb-2.5">
              <div className="flex items-center space-x-2.5">
                <h1 className="text-lg font-bold tracking-tight">{year}年 {month}月</h1>
                {!isViewingShared && (
                  <button
                    onClick={() => { setGeneratedShareUrl(''); setIsShareModalOpen(true); }}
                    className="bg-white/10 hover:bg-white/20 text-stone-200 text-[11px] px-2.5 py-1 rounded-md font-medium border border-white/10 transition"
                  >
                    共有リンク
                  </button>
                )}
              </div>
              <div className="flex items-center space-x-1 bg-slate-900/50 p-0.5 rounded-lg border border-white/10">
                <button onClick={() => setCurrentDate(new Date(year, month - 2, 1))} className="px-2.5 py-1 hover:bg-white/10 rounded text-xs text-stone-300">◀</button>
                <button onClick={() => { setCurrentDate(new Date()); setSelectedDate(todayStr); }} className="px-2.5 py-1 hover:bg-white/10 rounded text-xs font-bold text-white">今日</button>
                <button onClick={() => setCurrentDate(new Date(year, month, 1))} className="px-2.5 py-1 hover:bg-white/10 rounded text-xs text-stone-300">▶</button>
              </div>
            </div>

            <div className="grid grid-cols-3 gap-2 pt-2.5 border-t border-white/10 text-center text-xs">
              <div className="bg-slate-900/40 py-1.5 px-2 rounded-lg border border-white/5">
                <div className="text-slate-400 text-[10px]">当月収入</div>
                <div className="text-sm font-bold text-emerald-300 mt-0.5">+{monthlyStats.income.toLocaleString()}円</div>
              </div>
              <div className="bg-slate-900/40 py-1.5 px-2 rounded-lg border border-white/5">
                <div className="text-slate-400 text-[10px]">当月支出</div>
                <div className="text-sm font-bold text-rose-300 mt-0.5">-{monthlyStats.expense.toLocaleString()}円</div>
              </div>
              <div className="bg-slate-900/40 py-1.5 px-2 rounded-lg border border-white/5">
                <div className="text-slate-400 text-[10px]">{isViewingShared ? '月間収支' : '予定反映後残高'}</div>
                <div className={`text-sm font-bold mt-0.5 ${(isViewingShared ? (monthlyStats.income - monthlyStats.expense) : futureProjectedBalance) >= 0 ? 'text-stone-100' : 'text-rose-300'}`}>
                  {(isViewingShared ? (monthlyStats.income - monthlyStats.expense) : futureProjectedBalance).toLocaleString()}円
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 p-3">
            {/* 1. 月表示 */}
            {viewMode === 'month' && (
              <div className="bg-white rounded-2xl shadow-sm border border-stone-200/80 p-2.5">
                <div className="grid grid-cols-7 gap-1 mb-2 text-center text-[11px] font-bold text-slate-400">
                  <span className="text-rose-500/80">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span className="text-sky-600/80">土</span>

                <div className="grid grid-cols-7 gap-1">
                  {Array.from({ length: monthData.firstDay }).map((_, i) => (
                    <div key={`empty-${i}`} className="h-16 bg-stone-50/70 rounded-lg" />
                  ))}
                  {Array.from({ length: monthData.days }).map((_, i) => {
                    const dayNum = i + 1;
                    const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                    const dow = new Date(year, month - 1, dayNum).getDay();
                    const holidayName = getJapaneseHolidayName(dateStr);
                    const isRedDay = dow === 0 || Boolean(holidayName);
                    const isSat = dow === 6 && !holidayName;
                    const isSelected = dateStr === selectedDate;
                    const isToday = dateStr === todayStr;
                    const currentDayEvents = events.filter(e => isEventOnDate(e, dateStr));
                    const dayNet = currentDayEvents.reduce((sum, e) => {
                      if (e.date !== dateStr) return sum;
                      return sum + (e.isExpense ? -e.amount : e.amount);
                    }, 0);

                    return (
                      <div
                        key={dayNum}
                        onClick={() => { setSelectedDate(dateStr); setViewMode('day'); }}
                        className={`h-16 p-1 border rounded-xl flex flex-col justify-between cursor-pointer transition ${
                          isSelected
                            ? 'border-slate-700 bg-slate-100/70 ring-1 ring-slate-700/20'
                            : 'border-stone-100 hover:bg-stone-50'
                        } ${isToday ? 'bg-slate-50 font-bold' : ''}`}
                      >
                        <div className="flex justify-between items-center">
                          <span className={`text-[11px] ${
                            isToday
                              ? 'bg-slate-800 text-white rounded-full w-4 h-4 flex items-center justify-center'
                              : isRedDay ? 'text-rose-600 font-bold' : isSat ? 'text-sky-700 font-bold' : 'text-slate-700'
                          }`}>
                            {dayNum}
                          </span>
                          {dayNet !== 0 && (
                            <span className={`text-[8px] font-bold ${dayNet > 0 ? 'text-emerald-700' : 'text-rose-600'}`}>
                              {dayNet > 0 ? `+${Math.round(dayNet/1000)}k` : `-${Math.round(Math.abs(dayNet)/1000)}k`}
                            </span>
                          )}
                        </div>
                        {holidayName && currentDayEvents.length === 0 && (
                          <div className="text-[7px] text-rose-500/80 truncate leading-tight">{holidayName}</div>
                        )}
                        <div className="space-y-0.5 overflow-hidden">
                          {currentDayEvents.slice(0, 2).map((ev) => {
                            const isMultiDay = ev.endDate && ev.endDate > ev.date;
                            const isShared = ev.isSharedImport;
                            return (
                              <div
                                key={ev.id}
                                className="text-[8px] truncate px-1 py-0.5 rounded font-medium flex items-center leading-none"
                                style={
                                  isShared
                                    ? {
                                        backgroundColor: `${ev.color}18`,
                                        color: ev.color,
                                        borderLeft: `2.5px solid ${ev.color}`
                                      }
                                    : {
                                        backgroundColor: ev.color || '#476C9B',
                                        color: '#FFFFFF'
                                      }
                                }
                              >
                                <span className="truncate">{isMultiDay && ev.date !== dateStr ? `↳${ev.title}` : ev.title}</span>
                              </div>
                            );
                          })}
                          {currentDayEvents.length > 2 && (
                            <div className="text-[7px] text-slate-400 text-right font-medium">+{currentDayEvents.length - 2}件</div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div className="text-[10px] text-slate-400 text-center mt-2.5">
                  左右スワイプで前月・翌月へ移動
                </div>
              </div>
            )}

            {/* 2. 日詳細 */}
            {viewMode === 'day' && (
              <div className="space-y-3">
                <div className="bg-white p-3.5 rounded-2xl shadow-sm border border-stone-200/80 space-y-2.5">
                  <div className="flex justify-between items-center">
                    <button
                      onClick={() => handleMoveDay(-1)}
                      className="px-3 py-1.5 bg-stone-100 hover:bg-stone-200 rounded-lg text-xs font-bold text-slate-700 transition"
                    >
                      ◀ 前日
                    </button>
                    <div className="text-center">
                      <h2 className="text-base font-bold text-slate-800">{selectedDate}</h2>
                      {selectedHoliday && (
                        <div className="text-[11px] font-bold text-rose-600">{selectedHoliday}</div>
                      )}
                      <div className="text-[11px] text-slate-500 mt-0.5">
                        収入 <span className="text-emerald-700 font-bold">+{dayStats.income.toLocaleString()}円</span>
                        <span className="mx-1.5 text-stone-300">|</span>
                        支出 <span className="text-rose-600 font-bold">-{dayStats.expense.toLocaleString()}円</span>
                      </div>
                    </div>
                    <button
                      onClick={() => handleMoveDay(1)}
                      className="px-3 py-1.5 bg-stone-100 hover:bg-stone-200 rounded-lg text-xs font-bold text-slate-700 transition"
                    >
                      翌日 ▶
                    </button>
                  </div>
                  <div className="flex justify-center border-t border-stone-100 pt-2">
                    <button onClick={() => setViewMode('month')} className="text-[11px] text-slate-600 hover:text-slate-900 font-bold">
                      月カレンダーに戻る
                    </button>
                  </div>
                </div>

                <div className="space-y-2.5">
                  {dayEvents.length === 0 ? (
                    <div className="text-center py-12 bg-white rounded-2xl border border-stone-200/80 text-slate-400 text-xs">
                      この日の予定や支出はありません
                    </div>
                  ) : (
                    dayEvents.map(ev => {
                      const isMultiDay = ev.endDate && ev.endDate > ev.date;
                      const isShared = ev.isSharedImport;
                      return (
                        <div
                          key={ev.id}
                          className={`p-3.5 rounded-2xl shadow-sm transition ${ev.completed ? 'opacity-55' : ''}`}
                          style={
                            isShared
                              ? {
                                  backgroundColor: `${ev.color}0F`,
                                  border: `1px solid ${ev.color}40`,
                                  borderLeft: `4px solid ${ev.color}`
                                }
                              : {
                                  backgroundColor: '#FFFFFF',
                                  border: '1px solid #E7E5E4',
                                  borderLeft: `4px solid ${ev.color}`
                                }
                          }
                        >
                          <div className="flex items-start justify-between">
                            <div className="flex items-start space-x-3 flex-1">
                              {!isViewingShared && (
                                <button onClick={() => toggleComplete(ev.id)} className="text-slate-400 hover:text-slate-700 text-lg mt-0.5">
                                  {ev.completed ? '☑' : '☐'}
                                </button>
                              )}
                              <div className="flex-1">
                                <div className="flex flex-wrap items-center gap-1.5">
                                  {isShared && (
                                    <span
                                      className="text-[10px] font-bold px-2 py-0.5 rounded-md text-white tracking-wide"
                                      style={{ backgroundColor: ev.color }}
                                    >
                                      {ev.sharedBadge || '共有'}
                                    </span>
                                  )}
                                  <span className={`font-bold text-sm ${ev.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                                    {ev.title}
                                  </span>
                                </div>
                                <div className="flex flex-wrap items-center gap-1.5 text-xs text-slate-500 mt-1">
                                  {isMultiDay && (
                                    <span className="bg-stone-100 text-slate-700 px-1.5 py-0.5 rounded text-[10px] font-bold">
                                      {ev.date.slice(5)} 〜 {ev.endDate.slice(5)}
                                    </span>
                                  )}
                                  {ev.isAllDay ? (
                                    <span className="bg-stone-100 text-slate-600 px-1.5 py-0.5 rounded text-[10px] font-bold">終日</span>
                                  ) : (
                                    ev.startTime && <span>{ev.startTime} - {ev.endTime}</span>
                                  )}
                                  {ev.shiftMeta && (
                                    <span className="bg-emerald-50 text-emerald-800 border border-emerald-200/70 px-1.5 py-0.5 rounded text-[10px]">
                                      実働{ev.shiftMeta.workHours}h
                                      {ev.shiftMeta.nightHours > 0 ? ` / 深夜${ev.shiftMeta.nightHours}h` : ''}
                                      {ev.shiftMeta.breakMins > 0 ? ` / 休憩${ev.shiftMeta.breakMins}分` : ''}
                                      {ev.shiftMeta.transport > 0 ? ` +交通費${ev.shiftMeta.transport}円` : ''}
                                    </span>
                                  )}
                                </div>
                                {ev.memo && (
                                  <div className="text-xs text-slate-600 bg-stone-50/90 p-2.5 rounded-lg mt-2 border border-stone-200/70 leading-relaxed">
                                    {ev.memo}
                                  </div>
                                )}
                                {ev.subItems && ev.subItems.length > 0 && (
                                  <div className="mt-2 border-t border-stone-100 pt-1.5 space-y-1">
                                    <div className="text-[10px] font-bold text-slate-400">内訳:</div>
                                    {ev.subItems.map(sub => (
                                      <div key={sub.id} className="flex justify-between text-xs text-slate-600">
                                        <span>・{sub.name}</span>
                                        <span>{sub.price.toLocaleString()}円</span>
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </div>
                            </div>
                            <div className="flex flex-col items-end space-y-2 ml-2">
                              {ev.amount > 0 && (
                                <span className={`text-sm font-bold ${ev.isExpense ? 'text-rose-600' : 'text-emerald-700'}`}>
                                  {ev.isExpense ? '-' : '+'}{ev.amount.toLocaleString()}円
                                </span>
                              )}
                              <div className="flex space-x-2.5 text-[11px]">
                                <button onClick={() => downloadICS(ev)} className="text-slate-400 hover:text-slate-700" title="標準カレンダーに追加">通知</button>
                                {!isViewingShared && (
                                  <>
                                    <button onClick={() => openEditModal(ev)} className="text-slate-700 hover:underline font-bold">編集</button>
                                    <button onClick={() => deleteEvent(ev)} className="text-slate-400 hover:text-rose-600">削除</button>
                                  </>
                                )}
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* 3. 収支（家計簿・残高管理）タブ */}
            {viewMode === 'finance' && (
              <div className="space-y-3.5">
                {!isViewingShared && (
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-stone-200/80 space-y-2.5">
                    <div className="flex justify-between items-center">
                      <h2 className="text-sm font-bold text-slate-800">所持金・口座残高トラッカー</h2>
                      <span className="text-[10px] text-slate-400">完了チェック(☑)で確定</span>
                    </div>
                    <div className="grid grid-cols-2 gap-2.5 text-xs">
                      <div className="bg-slate-50 p-3 rounded-xl border border-slate-200/80">
                        <div className="text-slate-500 font-bold mb-1">現在の確定残高</div>
                        <div className={`text-lg font-bold ${currentActualBalance >= 0 ? 'text-slate-800' : 'text-rose-600'}`}>
                          {currentActualBalance.toLocaleString()}円
                        </div>
                      </div>
                      <div className="bg-stone-50 p-3 rounded-xl border border-stone-200/80">
                        <div className="text-slate-500 font-bold mb-1">全予定消化後の見込</div>
                        <div className={`text-lg font-bold ${futureProjectedBalance >= 0 ? 'text-slate-700' : 'text-rose-600'}`}>
                          {futureProjectedBalance.toLocaleString()}円
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                <div className="bg-white p-4 rounded-2xl shadow-sm border border-stone-200/80 space-y-3">
                  <h2 className="text-sm font-bold text-slate-800">{month}月の家計簿サマリー</h2>
                  <div className="grid grid-cols-2 gap-3 text-xs">
                    <div className="bg-emerald-50/60 p-3 rounded-xl border border-emerald-200/70">
                      <div className="text-emerald-800 font-bold mb-1">当月収入</div>
                      <div className="text-lg font-bold text-emerald-700">+{monthlyStats.income.toLocaleString()}円</div>
                      <div className="text-[10px] text-emerald-700/80 mt-1">確定済: {monthlyStats.confirmedIncome.toLocaleString()}円</div>
                    </div>
                    <div className="bg-rose-50/60 p-3 rounded-xl border border-rose-200/70">
                      <div className="text-rose-800 font-bold mb-1">当月支出</div>
                      <div className="text-lg font-bold text-rose-600">-{monthlyStats.expense.toLocaleString()}円</div>
                      <div className="text-[10px] text-rose-700/80 mt-1">確定済: {monthlyStats.confirmedExpense.toLocaleString()}円</div>
                    </div>
                  </div>

                  {!isViewingShared && jobBreakdown.length > 0 && (

                          <div key={jb.id} className="flex justify-between items-center text-xs bg-stone-50 p-2.5 rounded-xl border border-stone-200/60">
                            <div className="flex items-center space-x-2">
                              <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: jb.color }} />
                              <span className="font-bold text-slate-700">{jb.name}</span>
                              <span className="text-slate-400 text-[10px]">({jb.count}回 / {jb.totalHours}h)</span>

                            <span className="font-bold text-emerald-700">+{jb.totalPay.toLocaleString()}円</span>
                          </div>

                    </div>

                        readOnly
                        value={generatedShareUrl}
                        className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50 text-[10px] font-mono text-slate-600"
                      />
                      <button
                        type="button"
                        onClick={copyShareUrl}
                        className="w-full bg-emerald-800 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-bold transition"
                      >
                        URLをコピーして送る
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 予定・収支 登録＆編集モーダル */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center">
              <div className="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-center border-b border-stone-100 pb-2.5">
                  <h3 className="font-bold text-slate-800">
                    {editingId ? '予定・収支の編集' : '予定・収支の追加'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
                </div>

                <form onSubmit={handleSaveEvent} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-500 mb-1">開始日</label>
                      <input
                        type="date"
                        value={newEvent.date}
                        onChange={e => {
                          const nextStart = e.target.value;
                          const nextEnd = !newEvent.endDate || newEvent.endDate < nextStart ? nextStart : newEvent.endDate;
                          setNewEvent({ ...newEvent, date: nextStart, endDate: nextEnd });
                        }}
                        className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-slate-500 mb-1">終了日（日またぎ可）</label>
                      <input
                        type="date"
                        value={newEvent.endDate || newEvent.date}
                        min={newEvent.date}
                        onChange={e => setNewEvent({ ...newEvent, endDate: e.target.value })}
                        className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50"
                        required
                      />
                    </div>
                  </div>

                  {!editingId && (
                    <div>
                      <label className="block text-slate-500 mb-1">繰り返し一括登録</label>
                      <select value={repeatOption} onChange={e => setRepeatOption(e.target.value)} className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50">
                        <option value="none">今回のみ（1回）</option>
                        <option value="weekly_4">毎週（4週間分）</option>
                        <option value="monthly_3">毎月（3ヶ月分）</option>
                      </select>
                    </div>
                  )}

                  <div className="flex items-center space-x-2 bg-stone-100/80 p-2.5 rounded-xl border border-stone-200/70">
                    <input
                      type="checkbox"
                      id="isShift"
                      className="accent-slate-800"
                      checked={newEvent.isShift}
                      onChange={e => setNewEvent({ ...newEvent, isShift: e.target.checked, isAllDay: false })}
                    />
                    <label htmlFor="isShift" className="font-bold text-slate-800 cursor-pointer">アルバイトのシフトとして登録</label>
                  </div>

                  {newEvent.isShift ? (
                    jobs.length === 0 ? (
                      <div className="bg-amber-50/80 border border-amber-200 p-3 rounded-xl text-amber-900 space-y-2">
                        <div>勤務先がまだ登録されていません。先に設定タブから勤務先（時給）を登録してください。</div>
                        <button
                          type="button"
                          onClick={() => { setIsModalOpen(false); setViewMode('settings'); }}
                          className="bg-amber-700 text-white px-3 py-1.5 rounded-lg font-bold"
                        >
                          設定画面へ移動する
                        </button>
                      </div>
                    ) : (
                      <div>
                        <label className="block text-slate-500 mb-1">勤務先を選択</label>
                        <select value={newEvent.jobId} onChange={e => setNewEvent({ ...newEvent, jobId: e.target.value })} className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50" required>
                          <option value="">選択してください</option>
                          {jobs.map(j => <option key={j.id} value={j.id}>{j.name} （時給:{j.hourlyWage}円 / 交通費:{j.transportFee || 0}円）</option>)}
                        </select>
                      </div>
                    )
                  ) : (
                    <>
                      <div>
                        <label className="block text-slate-500 mb-1">タイトル</label>
                        <input type="text" placeholder="例：大学講義、1泊2日旅行、家賃引き落とし" value={newEvent.title} onChange={e => setNewEvent({ ...newEvent, title: e.target.value })} className="w-full p-2.5 border border-stone-200 rounded-xl bg-stone-50" required />
                      </div>

                      <div>
                        <label className="block text-slate-500 mb-1">カテゴリ色分け</label>
                        <div className="flex space-x-1.5 overflow-x-auto no-scrollbar py-1">
                          {COLOR_PALETTE.map(c => (
                            <button
                              type="button"
                              key={c.color}
                              onClick={() => setNewEvent({ ...newEvent, color: c.color })}
                              className={`px-2.5 py-1 rounded-lg text-[10px] font-bold text-white whitespace-nowrap flex items-center space-x-1 transition ${newEvent.color === c.color ? 'ring-2 ring-offset-1 ring-slate-700' : 'opacity-70 hover:opacity-100'}`}
                              style={{ backgroundColor: c.color }}
                            >
                              <span>{c.name}</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    </>
                  )}

                  {!newEvent.isShift && (
                    <div className="flex items-center space-x-2">
                      <input
                        type="checkbox"
                        id="isAllDay"
                        className="accent-slate-800"
                        checked={newEvent.isAllDay}
                        onChange={e => setNewEvent({ ...newEvent, isAllDay: e.target.checked })}
                      />
                      <label htmlFor="isAllDay" className="text-slate-700 font-bold cursor-pointer">終日（時間指定なし）</label>
                    </div>
                  )}

                  {!newEvent.isAllDay && (
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-slate-500 mb-1">開始時間</label>
                        <input type="time" value={newEvent.startTime} onChange={e => setNewEvent({ ...newEvent, startTime: e.target.value })} className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50" />
                      </div>
                      <div>
                        <label className="block text-slate-500 mb-1">終了時間</label>
                        <input type="time" value={newEvent.endTime} onChange={e => setNewEvent({ ...newEvent, endTime: e.target.value })} className="w-full p-2 border border-stone-200 rounded-xl bg-stone-50" />
                      </div>
                    </div>
                  )}

                  {!newEvent.isShift && (
                    <div className="space-y-2 border-t border-stone-100 pt-2.5">
                      <div className="flex items-center justify-between">
                        <label className="text-slate-600 font-bold">金額・予算試算</label>
                        <div className="flex space-x-3">
                          <label className="flex items-center space-x-1 cursor-pointer">
                            <input type="radio" name="exp" className="accent-rose-600" checked={newEvent.isExpense} onChange={() => setNewEvent({ ...newEvent, isExpense: true })} />
                            <span className="text-rose-600 font-bold">支出</span>
                          </label>
                          <label className="flex items-center space-x-1 cursor-pointer">
                            <input type="radio" name="exp" className="accent-emerald-700" checked={!newEvent.isExpense} onChange={() => setNewEvent({ ...newEvent, isExpense: false })} />
                            <span className="text-emerald-700 font-bold">収入</span>
                          </label>
                        </div>
                      </div>
                      <input type="number" placeholder="合計金額（0で金額なし）" value={newEvent.amount || ''} onChange={e => setNewEvent({ ...newEvent, amount: Number(e.target.value) })} className="w-full p-2.5 border border-stone-200 rounded-xl font-bold bg-stone-50" />

                      <div className="bg-stone-50 p-2.5 rounded-xl border border-stone-200/70 space-y-2">
                        <div className="text-[10px] font-bold text-slate-500">内訳を追加して自動合計する（任意）</div>
                        <div className="flex space-x-1.5">
                          <input type="text" placeholder="項目（例：交通費）" value={subItemInput.name} onChange={e => setSubItemInput({ ...subItemInput, name: e.target.value })} className="flex-1 p-1.5 border border-stone-200 rounded-lg bg-white" />
                          <input type="number" placeholder="金額" value={subItemInput.price} onChange={e => setSubItemInput({ ...subItemInput, price: e.target.value })} className="w-20 p-1.5 border border-stone-200 rounded-lg bg-white" />
                          <button type="button" onClick={handleAddSubItem} className="bg-slate-700 text-white px-3 rounded-lg font-bold">追加</button>
                        </div>
                        {newEvent.subItems.length > 0 && (
                          <div className="space-y-1 pt-1">
                            {newEvent.subItems.map(sub => (
                              <div key={sub.id} className="flex justify-between items-center text-[11px] bg-white px-2.5 py-1 rounded-lg border border-stone-200/70">
                                <span>{sub.name}</span>
                                <div className="flex items-center space-x-2">
                                  <span className="font-bold">{sub.price.toLocaleString()}円</span>
                                  <button type="button" onClick={() => handleRemoveSubItem(sub.id)} className="text-rose-500">✕</button>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block text-slate-500 mb-1">メモ・持ち物リスト</label>
                    <textarea placeholder="メモを残せます" value={newEvent.memo} onChange={e => setNewEvent({ ...newEvent, memo: e.target.value })} className="w-full p-2.5 border border-stone-200 rounded-xl h-14 bg-stone-50" />
                  </div>

                  <button type="submit" className="w-full bg-slate-800 hover:bg-slate-700 text-white p-3 rounded-xl font-bold text-sm transition">
                    {editingId ? '変更を保存する' : '登録する'}
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
